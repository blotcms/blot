name: Start MinIO
description: >
  Starts a simulated S3 for the generated assets, which live only in the
  assets bucket, and exports the app's configuration for it (BLOT_ASSETS_*,
  BLOT_AWS_*) to the rest of the job. The bucket itself is created by the
  test and benchmark runners (scripts/tests/util/bucket.js). GitHub service
  containers can't be given a command, which MinIO needs, so it's started by
  hand. MinIO no longer publishes images itself; this is a pinned build of the
  upstream release (keep it in step with scripts/tests/invoke.sh and
  scripts/development/docker-compose.yml). Its throwaway credentials mean
  nothing outside the job.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        docker run -d --name minio --network host --user root \
          -e MINIO_ROOT_USER=blot-test \
          -e MINIO_ROOT_PASSWORD=blot-test-secret \
          alpine/minio:RELEASE.2025-10-15T17-29-55Z@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4 \
          server /data --address :9000 --console-address :9001
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:9000/minio/health/live > /dev/null; then
            {
              echo "BLOT_ASSETS_BUCKET=blot-test-assets"
              echo "BLOT_ASSETS_ENDPOINT=http://localhost:9000"
              echo "BLOT_ASSETS_REGION=us-east-1"
              echo "BLOT_AWS_KEY=blot-test"
              echo "BLOT_AWS_SECRET=blot-test-secret"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          sleep 1
        done
        docker logs minio
        echo "MinIO did not become ready"
        exit 1
