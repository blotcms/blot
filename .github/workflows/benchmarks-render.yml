name: benchmarks-render

# What this workflow does
# ------------------------
# Runs the render + burst phases (tag/archives/search/sitemap/backlinks/
# not-found) against the large, cached, production-shaped corpus built by
# benchmarks-corpus.yml, instead of a freshly generated small workload. This
# gives deeper signal specifically for changes to render-critical code -
# the existing benchmarks.yml smoke check (5 sites / 1000 files, built fresh
# every run) is unaffected and keeps running on every PR/push as before.
#
# Read-only with respect to the corpus cache: this workflow never saves back
# an amended corpus - only benchmarks-corpus.yml writes that cache. History/
# regression tracking is also kept entirely separate from benchmarks.yml
# (different cache key prefix, different sticky PR comment) since the two
# workloads have different shapes and are not comparable metric-for-metric.
#
# See scripts/benchmarks/README.md for the whole picture.

on:
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/blog/**"
      - "app/models/**"
      - "app/templates/**"
      - "app/build/**"
      - "app/cdn/**"
      - "app/helper/**"
  push:
    branches: ["master"]
    paths:
      - "app/blog/**"
      - "app/models/**"
      - "app/templates/**"
      - "app/build/**"
      - "app/cdn/**"
      - "app/helper/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: benchmarks-render-${{ github.event_name == 'push' && 'master' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CORPUS_SCHEMA_VERSION: 1

jobs:
  render-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      HISTORY_DIR: .benchmarks/render-history
      RESULT_FILE: .benchmarks/render-result.json
      CORPUS_DIR: .benchmarks/corpus
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build benchmark image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: blot-bench:latest
          cache-from: |
            type=gha,scope=benchmarks-amd64
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/blot:buildcache
          cache-to: type=gha,scope=benchmarks-amd64,mode=max

      # --- restore the corpus (read-only) ----------------------------------
      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CORPUS_DIR }}/redis-dump.rdb
            ${{ env.CORPUS_DIR }}/blogs.tar.gz
            ${{ env.CORPUS_DIR }}/static.tar.gz
            ${{ env.CORPUS_DIR }}/manifest.json
          key: benchmark-corpus-v${{ env.CORPUS_SCHEMA_VERSION }}-nonexistent
          restore-keys: |
            benchmark-corpus-v${{ env.CORPUS_SCHEMA_VERSION }}-

      - name: Seed corpus from artifact if cache missed
        run: |
          node scripts/benchmarks/seed-corpus.js \
            --out-dir "$CORPUS_DIR" \
            --corpus-schema-version "$CORPUS_SCHEMA_VERSION"

      # No corpus yet (first run ever, or the corpus cache + backing
      # artifact have both aged out past retention): skip the rest of the
      # job rather than fail it. Like benchmarks.yml, GitHub-hosted runners
      # are too noisy/variable to gate a merge on, and a missing corpus
      # isn't a code regression - it just means benchmarks-corpus.yml needs
      # a workflow_dispatch run to (re)populate the cache.
      - name: Check corpus is available
        id: corpus-check
        run: |
          available=true
          for f in redis-dump.rdb blogs.tar.gz static.tar.gz manifest.json; do
            if [ ! -s "$CORPUS_DIR/$f" ]; then
              available=false
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" = "false" ]; then
            echo "::warning::No cached corpus found - run benchmarks-corpus.yml (workflow_dispatch) to populate it. Skipping the render benchmark for this run."
          fi

      - name: Mark PR comment as skipped (no corpus available)
        if: steps.corpus-check.outputs.available == 'false' && github.event_name == 'pull_request'
        run: |
          node scripts/benchmarks/pr-comment.js \
            --pr "${{ github.event.pull_request.number }}" \
            --arch amd64 \
            --status skipped \
            --sha "$HEAD_SHA" \
            --comment-tag render \
            --title "Render benchmark (large corpus)" \
            --message "No cached corpus is available yet - run benchmarks-corpus.yml (workflow_dispatch) once to populate it."

      # --- load the corpus into this job's Redis + data dirs ---------------
      - name: Restore Redis dump into service container
        if: steps.corpus-check.outputs.available == 'true'
        run: |
          CONTAINER_ID=$(docker ps --filter "ancestor=redis:6" --format '{{.ID}}' | head -1)
          if [ -z "$CONTAINER_ID" ]; then
            echo "::error::Could not find the redis:6 service container"
            exit 1
          fi
          docker cp "$CORPUS_DIR/redis-dump.rdb" "$CONTAINER_ID:/data/dump.rdb"
          # DEBUG RELOAD tells the running redis-server to reload its
          # dataset from the on-disk dump.rdb we just replaced, without a
          # process restart (which would also drop the port mapping).
          docker exec "$CONTAINER_ID" redis-cli DEBUG RELOAD

      - name: Extract corpus data directories
        if: steps.corpus-check.outputs.available == 'true'
        run: |
          mkdir -p .benchmarks/corpus/data/blogs .benchmarks/corpus/data/static
          tar -xzf "$CORPUS_DIR/blogs.tar.gz" -C .benchmarks/corpus/data
          tar -xzf "$CORPUS_DIR/static.tar.gz" -C .benchmarks/corpus/data

      - name: Mark PR benchmark comment as running
        if: steps.corpus-check.outputs.available == 'true' && github.event_name == 'pull_request'
        run: |
          node scripts/benchmarks/pr-comment.js \
            --pr "${{ github.event.pull_request.number }}" \
            --arch amd64 \
            --status running \
            --sha "$HEAD_SHA" \
            --comment-tag render \
            --title "Render benchmark (large corpus)"

      - name: Restore render benchmark history
        if: steps.corpus-check.outputs.available == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HISTORY_DIR }}
          key: render-benchmarks-history-amd64-${{ github.run_id }}
          restore-keys: |
            render-benchmarks-history-amd64-

      # Mirrors benchmarks.yml's cache-miss fallback: a render-benchmark-
      # history-amd64 artifact is uploaded on every push run (see "Upload
      # render benchmark history" below), so if the Actions cache was ever
      # evicted, restore from that instead of silently starting sustained-
      # regression detection over from zero.
      - name: Seed render benchmark history from artifact if cache missed
        if: steps.corpus-check.outputs.available == 'true'
        run: |
          node scripts/benchmarks/seed-history.js \
            --arch amd64 \
            --history-dir "$HISTORY_DIR" \
            --workflow benchmarks-render.yml \
            --artifact-name render-benchmark-history-amd64

      - name: Run render benchmark against the cached corpus
        if: steps.corpus-check.outputs.available == 'true'
        run: |
          docker run --rm \
            --network host \
            -e BLOT_REDIS_HOST=localhost \
            -e BLOT_HOST=localhost \
            -e BLOT_PROTOCOL=https \
            -e GITHUB_SHA=${{ github.sha }} \
            -v ${{ github.workspace }}/app:/usr/src/app/app \
            -v ${{ github.workspace }}/scripts:/usr/src/app/scripts \
            -v ${{ github.workspace }}/config:/usr/src/app/config \
            -v ${{ github.workspace }}/.benchmarks/corpus/data:/usr/src/app/data \
            -v ${{ github.workspace }}/.benchmarks:/benchmarks \
            blot-bench:latest \
            sh -c '
              node scripts/benchmarks \
                --corpus-mode render \
                --corpus-manifest-path /benchmarks/corpus/manifest.json \
                --output /benchmarks/render-result.json
            '

      - name: Aggregate result
        if: steps.corpus-check.outputs.available == 'true'
        run: |
          node scripts/benchmarks/aggregate.js \
            --output "$RESULT_FILE" \
            .benchmarks/render-result.json

      - name: Post PR benchmark comment
        if: steps.corpus-check.outputs.available == 'true' && github.event_name == 'pull_request'
        run: |
          node scripts/benchmarks/pr-comment.js \
            --pr "${{ github.event.pull_request.number }}" \
            --arch amd64 \
            --status done \
            --sha "$HEAD_SHA" \
            --result "$RESULT_FILE" \
            --history-dir "$HISTORY_DIR" \
            --comment-tag render \
            --title "Render benchmark (large corpus)" \
            --exclude-phase build

      - name: Mark PR benchmark comment as failed
        if: steps.corpus-check.outputs.available == 'true' && github.event_name == 'pull_request' && failure()
        run: |
          node scripts/benchmarks/pr-comment.js \
            --pr "${{ github.event.pull_request.number }}" \
            --arch amd64 \
            --status failed \
            --sha "$HEAD_SHA" \
            --comment-tag render \
            --title "Render benchmark (large corpus)"

      - name: Update rolling history
        if: steps.corpus-check.outputs.available == 'true' && github.event_name == 'push'
        run: |
          node scripts/benchmarks/update-history.js \
            --result "$RESULT_FILE" --arch amd64 --history-dir "$HISTORY_DIR" \
            --exclude-phase build

      - name: Detect sustained regression
        if: steps.corpus-check.outputs.available == 'true' && github.event_name == 'push'
        run: |
          node scripts/benchmarks/detect-regression.js \
            --history-dir "$HISTORY_DIR" --arch amd64 --alert \
            --issue-label render-benchmark-regression \
            --workflow-name benchmarks-render.yml \
            --exclude-phase build

      - name: Save render benchmark history
        if: steps.corpus-check.outputs.available == 'true' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HISTORY_DIR }}
          key: render-benchmarks-history-amd64-${{ github.run_id }}

      - name: Upload render benchmark result
        if: steps.corpus-check.outputs.available == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: render-benchmark-result
          path: ${{ env.RESULT_FILE }}
          if-no-files-found: warn

      - name: Upload render benchmark history
        if: steps.corpus-check.outputs.available == 'true' && always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: render-benchmark-history-amd64
          path: ${{ env.HISTORY_DIR }}
          retention-days: 90
          if-no-files-found: warn
