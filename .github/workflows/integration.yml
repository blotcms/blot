name: integration

# Tests for the proxy container. Build-only scaffolding still - nothing here
# is deployed.
#
#  proxy-behaviour : first the image as the config generator makes it for
#                    blot.im: it boots, the config parses, runtime settings
#                    reach the rendered config, the deploy scripts run against
#                    fake docker. Then the image for localhost vs a stub
#                    upstream (routing, caching, gzip, hardening, HTTP/3 off,
#                    the wildcard certificate from Redis). Proves the
#                    generated production config.
#  proxy-matrix    : the disk cache and what a client sees through the cached
#                    locations, request kind by request kind.
#  proxy-parity    : this tree's proxy vs origin/master's, request for request
#                    (pull requests only).
#  cert-issuance   : on-demand custom-domain certificate issuance through the
#                    proxy against a Pebble ACME test server, that an issued
#                    cert survives a container recreate (persistence), and
#                    what custom-domain HTTPS does while Redis is paused,
#                    stopped, READONLY or NOREPLICAS.
#  zero-downtime   : a blue/green handover (SO_REUSEPORT + graceful drain)
#                    serves every request while the old container is stopped.
#                    Then host fail2ban's filters (config/host/fail2ban)
#                    against the access log of an image that logs to a file,
#                    as production does: each filter matches exactly the
#                    requests meant to trigger it, on the real client IP.
#
# The jobs are independent (each builds its own image from the registry
# cache) and run concurrently, so none of them gates another.

# Pushes to master and pull requests alike run it only when something it
# covers changed (the paths below; keep the two lists the same). The real-app
# round trip through the proxy is app-e2e.yml, which runs on every PR.
# deploy.yml treats this workflow as optional: a deploy waits for it when it
# ran, and a push that changed none of these paths has no run.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/integration.yml"
      - ".github/actions/build-proxy-image/**"
      - "docker-bake.hcl"
      - "proxy/**"
      - "config/host/**"
      - "package.json"
      - "app/config.js"
      - "config/index.js"
      - "app/helper/drain.js"
      - "app/helper/listen.js"
      - "app/server.js"
      - "app/index.js"
      - "scripts/deploy/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/integration.yml"
      - ".github/actions/build-proxy-image/**"
      - "docker-bake.hcl"
      - "proxy/**"
      - "config/host/**"
      - "package.json"
      - "app/config.js"
      - "config/index.js"
      - "app/helper/drain.js"
      - "app/helper/listen.js"
      - "app/server.js"
      - "app/index.js"
      - "scripts/deploy/**"

# Superseded PR pushes are cancelled. Each master push gets its own group, so
# a master run is never cancelled.
concurrency:
  group: integration-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The compiled stages of the proxy image come from here (proxy/build/image.sh);
  # unit-image.yml writes it on master. Layers are arm64, as production.
  PROXY_IMAGE_CACHE: ghcr.io/blotcms/blot:cache-proxy-arm64
  BLOT_HOST: localhost
  BLOT_REPO: ${{ github.workspace }}
  # Skip the BunnyCDN edge-IP fetch so image builds stay hermetic. Local and
  # deploy generates still fetch by default (see proxy/build/index.js).
  FETCH_CDN_IPS: "false"

jobs:
  proxy-behaviour:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      # Which host scripts/deploy/units.sh and util/sshCommand.js ssh to
      # (BLOT_DEPLOY_TARGET), against a stub ssh.
      - name: Deploy ssh target
        run: bash scripts/deploy/tests/target.sh

      # The image for the default host (blot.im), as the config generator
      # makes it without a BLOT_HOST. The empty value overrides the job's
      # localhost for this build only. Everything here finishes (and its
      # container is gone) before the localhost image below is built, so the
      # checks after it run on the same image as ever.
      - uses: ./.github/actions/build-proxy-image
        env:
          BLOT_HOST: ""
        with:
          tag: blot-proxy:ci

      - name: Check OpenResty release and record build options
        run: |
          docker run --rm --entrypoint openresty blot-proxy:ci -V 2>&1 | tee openresty-version.txt
          grep -Fq 'nginx version: openresty/1.31.1.1' openresty-version.txt

      - name: Validate generated OpenResty config
        # The image holds a template; render it (as the entrypoint does) first
        run: |
          docker run --rm -e PROXY_FETCH_CDN_IPS=false --entrypoint bash blot-proxy:ci \
            -c 'render-config && /usr/local/openresty/bin/openresty -t'

      - name: Runtime settings reach the rendered config
        run: |
          docker run --rm --entrypoint bash \
            -e PROXY_FETCH_CDN_IPS=false \
            -e PROXY_REDIS_HOST=10.1.2.3 \
            -e PROXY_SERVER_LABEL=eu \
            -e PROXY_RESOLVER=127.0.0.11 \
            -e PROXY_PRIVATE_IP=127.0.0.2 \
            -e PROXY_UNIT_WORKER=10.0.0.1:9089 \
            -e PROXY_PEER_WORKER=10.0.0.2:9088 \
            -e PROXY_UNIT_MAIN=10.0.0.3:9090 \
            -e PROXY_PEER_MAIN=10.0.0.4:9091 \
            blot-proxy:ci -c '
              set -e
              render-config
              conf=/usr/local/openresty/nginx/conf/nginx.conf
              grep -q "host = \"10.1.2.3\"" $conf
              grep -q "Blot-Server. .eu. always" $conf
              grep -q "resolver 127.0.0.11;" $conf
              grep -q "listen 127.0.0.2:8077 reuseport;" $conf
              grep -q "server 10.0.0.1:9089 weight=100 max_fails=0;" $conf
              grep -q "server 10.0.0.2:9088 backup max_fails=0;" $conf
              grep -q "server 10.0.0.3:9090 weight=100 max_fails=0;" $conf
              grep -q "server 10.0.0.4:9091 backup max_fails=0;" $conf
              if grep -q "\${PROXY_" $conf; then echo "unsubstituted placeholder"; exit 1; fi
              /usr/local/openresty/bin/openresty -t
            '

      - name: Deploy scripts (fake docker and systemctl)
        env:
          BLOT_HOST: ""
        run: bash proxy/deploy/tests/run.sh

      # Port 8080 is the e2e proxy's below, so this container goes first.
      - name: Boot container and check health endpoint
        run: |
          docker run -d --name blot-proxy-ci --cap-add SYS_NICE \
            -p 8080:80 -e BLOT_HOST=example.com blot-proxy:ci
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          echo "--- container logs ---"
          docker logs blot-proxy-ci || true
          docker rm -f blot-proxy-ci >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then
            echo "proxy container did not serve /health with 200"
            exit 1
          fi

      - uses: ./.github/actions/build-proxy-image
        with:
          tag: blot-proxy:e2e

      - name: Start proxy + stub upstream
        run: |
          # A file under the image's default GLOBAL_STATIC_FILES_DIR
          # (proxy/build/locals.js), read-only, so checks.sh can prove
          # cdn. serves it from disk (location / on cdn. in server.conf)
          # instead of falling through to the stub upstream.
          mkdir -p "$RUNNER_TEMP/global-static"
          echo -n "served from disk" > "$RUNNER_TEMP/global-static/cdn-test.txt"
          docker run -d --name proxy -p 8080:80 -p 8443:443 \
            -e BLOT_HOST=localhost \
            -e PROXY_UNIT_MAIN=127.0.0.1:8090 -e PROXY_UNIT_WORKER=127.0.0.1:8089 -e PROXY_PEER_MAIN=127.0.0.1:8088 -e PROXY_PEER_WORKER=127.0.0.1:8088 \
            -v "$RUNNER_TEMP/global-static":/var/www/blot/app/blog/static:ro \
            blot-proxy:e2e
          docker run -d --name stub --network container:proxy \
            -v "$PWD/proxy/e2e/stub-upstream.js:/s.js" \
            node:24.22.1-alpine node /s.js
          for i in $(seq 1 30); do
            docker exec proxy sh -c 'wget -qO- -T1 http://127.0.0.1:8090/ >/dev/null 2>&1' && break
            sleep 1
          done
          # The loop above only proves the stub is up. OpenResty can take longer.
          for i in $(seq 1 30); do
            curl -s -o /dev/null --max-time 1 http://127.0.0.1:8080/health && break
            sleep 1
          done

      - name: Run behavioural checks
        env:
          PROXY_HTTP: http://127.0.0.1:8080
          PROXY_HTTPS: https://127.0.0.1:8443
        run: bash proxy/e2e/checks.sh

      # The base image still includes HTTP/3, but the generated config must
      # expose no QUIC listener. Check live UDP sockets and HTTP/1.1 + HTTP/2
      # on every public vhost, including clearing cached Alt-Svc routes.
      - name: HTTP/3 disabled; HTTP/1.1 and HTTP/2 available
        run: node proxy/e2e/http3-disabled-checks.js

      # The wildcard certificate comes from Redis when it is there, else from
      # the file. Starts a Redis in the proxy's network namespace, which the
      # proxy has not had until now; keep this the last check.
      - name: Wildcard certificate from Redis
        env:
          PROXY_HTTPS_HOST: 127.0.0.1:8443
        run: bash proxy/e2e/wildcard-cert-checks.sh

      # Repeat after loading the wildcard certificate from Redis. HTTP/3
      # must remain disabled while HTTP/1.1 and HTTP/2 still serve that cert.
      - name: Protocol checks with the wildcard certificate from Redis
        run: node proxy/e2e/http3-disabled-checks.js anything.localhost

      - name: Proxy logs
        if: always()
        run: docker logs proxy || true

  # Both start their own containers on their own ports from the built image;
  # they need nothing from proxy-behaviour's containers.
  proxy-matrix:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - uses: ./.github/actions/build-proxy-image
        with:
          tag: blot-proxy:e2e

      # The disk cache (proxy/config/diskcache.lua, proxy/evict.sh) against the
      # real image: starts its own dc-* proxy containers on ports 18080-18084,
      # two of them sharing a cache volume, and removes them afterwards.
      - name: Disk cache checks
        run: node proxy/e2e/diskcache-checks.js

      # What a client sees through the cached locations, request kind by
      # request kind, against the same image: starts its own rm-* containers
      # (ports 18120-18139), each with a stub upstream, and removes them.
      # Behaviour that looks wrong today is asserted and labelled KNOWN.
      - name: Request matrix
        run: node proxy/e2e/request-matrix.js

  proxy-parity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - uses: ./.github/actions/build-proxy-image
        with:
          tag: blot-proxy:e2e

      # The proxy of the base ref (origin/master) and this tree's side by side,
      # the same ~770 requests to both (miss, hit, purge, refill, Node down,
      # Node back): status, decoded body and headers must match unless a rule
      # in parity-checks.js explains the difference. Builds the baseline image
      # itself, from a worktree of origin/master. Containers pa-*, ports
      # 18090-18093. Pull requests only: on a push to master both sides are
      # the same code.
      - name: Parity with origin/master
        if: github.event_name == 'pull_request'
        env:
          PARITY_GENDEPS: ${{ runner.temp }}/gendeps
          PARITY_TREE_IMAGE: blot-proxy:e2e
        run: |
          git fetch --no-tags --depth=1 origin '+refs/heads/master:refs/remotes/origin/master'
          node proxy/e2e/parity-checks.js

  # On-demand certificate issuance for custom domains, end to end, against a
  # Pebble ACME test server (no public DNS or rate limits). Also asserts the
  # issued cert survives recreating the proxy container (persistence).
  cert-issuance:
    runs-on: ubuntu-24.04-arm
    env:
      TEST_DOMAIN: cert-test.example
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - uses: ./.github/actions/build-proxy-image
        with:
          tag: blot-proxy:acme

      - name: Start Redis, challtestsrv and Pebble
        env:
          # The upstream images are distroless (entrypoint is the binary) and
          # published on ghcr.io, not Docker Hub.
          PEBBLE_IMAGE: ghcr.io/letsencrypt/pebble:latest
          CHALLTESTSRV_IMAGE: ghcr.io/letsencrypt/pebble-challtestsrv:latest
        run: |
          set -eux

          # HTTP-01 validation must reach the proxy's default server, not the
          # loopback-only internal server, so the challenge host resolves to
          # the runner's routable IP (the proxy binds it via --network host).
          HOSTIP=$(hostname -I | awk '{print $1}')
          echo "HOSTIP=$HOSTIP" >> "$GITHUB_ENV"

          docker run -d --name redis --network host redis:6.2.12-alpine

          # challtestsrv only needs its DNS server; disable the HTTP/HTTPS/
          # TLS-ALPN/DoH listeners and AAAA so nothing competes with the proxy.
          docker run -d --name challtestsrv --network host "$CHALLTESTSRV_IMAGE" \
            -dnsserver :8053 -management :8055 \
            -http01 "" -https01 "" -tlsalpn01 "" -doh "" -defaultIPv6 ""

          docker run -d --name pebble --network host \
            -e "PEBBLE_VA_NOSLEEP=1" -e "PEBBLE_WFE_NONCEREJECT=0" \
            -v "$PWD/proxy/e2e/pebble-config.json:/test/config/pebble-config.json:ro" \
            "$PEBBLE_IMAGE" \
            -config /test/config/pebble-config.json -dnsserver 127.0.0.1:8053

          # The CA in front of Pebble's ACME endpoint (:14000) - the proxy's
          # dehydrated hook (curl) must trust this to place an order. The
          # image has no shell, so copy the file out of a created container.
          cid=$(docker create "$PEBBLE_IMAGE")
          docker cp "$cid:/test/certs/pebble.minica.pem" pebble.minica.pem
          docker rm "$cid"
          test -s pebble.minica.pem

          for i in $(seq 1 30); do
            curl -sf -X POST -d '{"host":"'"$TEST_DOMAIN"'.","addresses":["'"$HOSTIP"'"]}' \
              http://127.0.0.1:8055/add-a && break
            sleep 1
          done

          # Wait for Pebble, then build a CA bundle from the root AND
          # intermediate that sign ISSUED certs (both generated fresh at
          # Pebble startup, distinct from pebble.minica.pem). Trusting the
          # intermediate too means the leaf verifies whether or not the proxy
          # serves a full chain.
          for i in $(seq 1 30); do
            curl -sk https://127.0.0.1:14000/dir >/dev/null && break
            sleep 1
          done
          curl -sk https://127.0.0.1:15000/roots/0 -o pebble-root.pem
          curl -sk https://127.0.0.1:15000/intermediates/0 -o pebble-int.pem
          cat pebble-root.pem pebble-int.pem > pebble-ca.bundle.pem
          test -s pebble-root.pem && test -s pebble-int.pem

      - name: Allow the domain and start the upstream
        run: |
          set -eux
          docker exec redis redis-cli set "domain:$TEST_DOMAIN" 1
          docker run -d --name stub --network host \
            -v "$PWD/proxy/e2e/stub-upstream.js:/s.js" node:24.22.1-alpine node /s.js
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8088/ && break
            sleep 1
          done

      - name: Start the proxy (auto-ssl storage on a named volume)
        run: |
          set -eux
          docker volume create blot-acme-storage
          docker run -d --name proxy --network host --cap-add SYS_NICE \
            -e BLOT_HOST=localhost \
            -e PROXY_UNIT_MAIN=127.0.0.1:8090 -e PROXY_UNIT_WORKER=127.0.0.1:8089 -e PROXY_PEER_MAIN=127.0.0.1:8088 -e PROXY_PEER_WORKER=127.0.0.1:8088 \
            -e PROXY_ACME_CA=https://127.0.0.1:14000/dir \
            -e ACME_CA_CERT=/pebble-ca.pem \
            -v "$PWD/pebble.minica.pem:/pebble-ca.pem:ro" \
            -v blot-acme-storage:/etc/resty-auto-ssl \
            blot-proxy:acme
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' proxy)" = healthy ] && break
            sleep 2
          done

      - name: Issue a certificate through the proxy
        run: |
          set -eux
          # First HTTPS request triggers issuance; retry with -k while the
          # order is in flight, then require a clean verify against the
          # Pebble issuing root.
          ok=""
          for i in $(seq 1 40); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' \
              --resolve "$TEST_DOMAIN:443:$HOSTIP" \
              "https://$TEST_DOMAIN/" || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          [ -n "$ok" ] || { docker logs proxy; exit 1; }

          # Show the chain the proxy actually serves (helps if verify fails).
          echo | openssl s_client -connect "$HOSTIP:443" \
            -servername "$TEST_DOMAIN" -showcerts 2>/dev/null \
            | openssl crl2pkcs7 -nocrl -certfile /dev/stdin 2>/dev/null \
            | openssl pkcs7 -print_certs -noout 2>/dev/null || true

          # The leaf must be a real Pebble-issued cert...
          issuer=$(echo | openssl s_client -connect "$HOSTIP:443" \
            -servername "$TEST_DOMAIN" 2>/dev/null \
            | openssl x509 -noout -issuer)
          echo "issuer: $issuer"
          if ! echo "$issuer" | grep -qi pebble || echo "$issuer" | grep -qi placeholder; then
            echo "=== still on the placeholder - running dehydrated directly for the full error ===" >&2
            docker exec proxy sh -c 'cat /etc/resty-auto-ssl/letsencrypt/config; echo; ls -la /etc/resty-auto-ssl/letsencrypt/' >&2 || true
            docker exec -e CURL_CA_BUNDLE=/pebble-ca.pem proxy sh -c 'cd /etc/resty-auto-ssl/letsencrypt && /usr/bin/resty-auto-ssl/dehydrated --register --accept-terms --config ./config 2>&1' >&2 || true
            docker exec -e CURL_CA_BUNDLE=/pebble-ca.pem proxy sh -c 'HOOK_SERVER_PORT=8999 /usr/bin/resty-auto-ssl/dehydrated --cron --accept-terms --no-lock --domain '"$TEST_DOMAIN"' --challenge http-01 --config /etc/resty-auto-ssl/letsencrypt/config --hook /usr/bin/resty-auto-ssl/letsencrypt_hooks 2>&1' >&2 || true
            docker exec proxy sh -c 'curl -sv --cacert /pebble-ca.pem https://127.0.0.1:14000/dir 2>&1 | tail -20' >&2 || true
            exit 1
          fi

          # ...and verify cleanly against the Pebble root+intermediate bundle.
          if ! curl -sS -o /dev/null --cacert pebble-ca.bundle.pem \
                 --resolve "$TEST_DOMAIN:443:$HOSTIP" "https://$TEST_DOMAIN/"; then
            echo "verify failed; leaf + bundle:" >&2
            echo | openssl s_client -connect "$HOSTIP:443" -servername "$TEST_DOMAIN" \
              2>/dev/null | openssl x509 -noout -issuer -subject >&2
            head -1 pebble-root.pem pebble-int.pem >&2
            exit 1
          fi

      - name: Certificate persists across a container recreate
        run: |
          set -eux

          # The cert store is Redis (storage_adapter = redis), so that is what
          # must hold the cert after issuance...
          docker exec redis redis-cli --scan --pattern 'ssl*' | tee /tmp/ssl-keys
          test -s /tmp/ssl-keys

          # ...and whatever the auto-ssl volume does hold (dehydrated account /
          # hook state) must not be lost across the recreate.
          before=$(docker run --rm -v blot-acme-storage:/s alpine \
            sh -c 'find /s -type f | wc -l')
          echo "auto-ssl volume files before recreate: $before"

          docker rm -f proxy
          docker run -d --name proxy --network host --cap-add SYS_NICE \
            -e BLOT_HOST=localhost \
            -e PROXY_UNIT_MAIN=127.0.0.1:8090 -e PROXY_UNIT_WORKER=127.0.0.1:8089 -e PROXY_PEER_MAIN=127.0.0.1:8088 -e PROXY_PEER_WORKER=127.0.0.1:8088 \
            -e PROXY_ACME_CA=https://127.0.0.1:14000/dir \
            -e ACME_CA_CERT=/pebble-ca.pem \
            -v "$PWD/pebble.minica.pem:/pebble-ca.pem:ro" \
            -v blot-acme-storage:/etc/resty-auto-ssl \
            blot-proxy:acme
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' proxy)" = healthy ] && break
            sleep 2
          done

          after=$(docker run --rm -v blot-acme-storage:/s alpine \
            sh -c 'find /s -type f | wc -l')
          [ "$after" -ge "$before" ]

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            --cacert pebble-ca.bundle.pem \
            --resolve "$TEST_DOMAIN:443:$HOSTIP" "https://$TEST_DOMAIN/")
          [ "$code" = "200" ]

          # And the recreated container serves the stored cert without asking
          # the ACME server for a new one.
          if docker logs proxy 2>&1 | grep -i "issuing new certificate"; then
            echo "FAIL: proxy re-issued the certificate after recreate" >&2
            exit 1
          fi

      - name: A Redis which stops answering neither stalls nor allows issuance
        run: |
          set -eux
          trap 'docker unpause redis 2>/dev/null || true' EXIT

          before=$(docker logs proxy 2>&1 | grep -c "failed to obtain lock" || true)

          # Redis accepts connections but never replies. For a domain the
          # proxy cannot confirm is allowed, the handshake must give up after
          # the short Redis timeout (not nginx's 60s default) and must not
          # start an ACME order (which would first try to take the Redis lock).
          docker pause redis
          start=$(date +%s)
          curl -sk -o /dev/null -m 30 \
            --resolve "unlisted.example:443:$HOSTIP" https://unlisted.example/ || true
          elapsed=$(( $(date +%s) - start ))
          docker unpause redis
          echo "handshake took ${elapsed}s"
          [ "$elapsed" -lt 20 ]

          after=$(docker logs proxy 2>&1 | grep -c "failed to obtain lock" || true)
          [ "$after" -eq "$before" ]

      # auto-ssl caches a certificate for an hour before reading Redis again;
      # PROXY_AUTO_SSL_CACHE_TTL shortens that so the checks below can get
      # past it.
      - name: Restart the proxy with a 5s certificate cache
        run: |
          set -eux
          docker rm -f proxy
          docker run -d --name proxy --network host --cap-add SYS_NICE \
            -e BLOT_HOST=localhost \
            -e PROXY_UNIT_MAIN=127.0.0.1:8090 -e PROXY_UNIT_WORKER=127.0.0.1:8089 -e PROXY_PEER_MAIN=127.0.0.1:8088 -e PROXY_PEER_WORKER=127.0.0.1:8088 \
            -e PROXY_ACME_CA=https://127.0.0.1:14000/dir \
            -e ACME_CA_CERT=/pebble-ca.pem \
            -e PROXY_AUTO_SSL_CACHE_TTL=5 \
            -v "$PWD/pebble.minica.pem:/pebble-ca.pem:ro" \
            -v blot-acme-storage:/etc/resty-auto-ssl \
            blot-proxy:acme
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' proxy)" = healthy ] && break
            sleep 2
          done

      - name: Redis stopped, a newer certificate in Redis, READONLY and NOREPLICAS
        env:
          CA_BUNDLE: pebble-ca.bundle.pem
          CACHE_TTL: "5"
        run: bash proxy/e2e/redis-outage-checks.sh

      - name: An expired certificate in Redis is not served
        env:
          CA_BUNDLE: pebble-ca.bundle.pem
          CACHE_TTL: "5"
        run: bash proxy/e2e/expired-cert-checks.sh

      - name: Logs
        if: always()
        run: |
          for c in proxy pebble challtestsrv stub redis; do
            echo "=== $c ==="; docker logs --tail 100 "$c" 2>&1 || true
          done

      - name: Tear down
        if: always()
        run: |
          docker rm -f proxy pebble challtestsrv stub redis 2>/dev/null || true
          docker volume rm blot-acme-storage 2>/dev/null || true

  # A blue/green handover: two proxy containers share :80/:443 via SO_REUSEPORT
  # on `--network host`; stopping the first one with a drain timeout must not
  # drop a single request.
  zero-downtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - uses: ./.github/actions/build-proxy-image
        with:
          tag: blot-proxy:zd

      - name: Start upstream + proxy A + proxy B
        run: |
          set -eux
          # Blog/site traffic must hit the :80 default server, not the
          # loopback-only internal server, so target the runner's routable IP.
          HOSTIP=$(hostname -I | awk '{print $1}')
          echo "HOSTIP=$HOSTIP" >> "$GITHUB_ENV"

          docker run -d --name stub --network host \
            -v "$PWD/proxy/e2e/stub-upstream.js:/s.js" node:24.22.1-alpine node /s.js
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8088/ && break; sleep 1
          done

          start_proxy() {
            docker run -d --name "$1" --network host --cap-add SYS_NICE \
              -e BLOT_HOST=localhost -e PROXY_UNIT_MAIN=127.0.0.1:8090 -e PROXY_UNIT_WORKER=127.0.0.1:8089 -e PROXY_PEER_MAIN=127.0.0.1:8088 -e PROXY_PEER_WORKER=127.0.0.1:8088 blot-proxy:zd
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$1")" = healthy ] && return 0
              sleep 2
            done
            docker logs "$1"; return 1
          }
          start_proxy zd-a
          curl -sf -o /dev/null -H 'Host: someblog.example' "http://$HOSTIP/"  # baseline
          start_proxy zd-b

      - name: Hammer the proxy while stopping A
        run: |
          set -eux
          rm -f stopped
          (
            # No --retry: every attempt is recorded as-is, so a single
            # refused/dropped connection during the handover shows up as a
            # non-200 and fails the assertion below. That is the whole point.
            # Runs until the stop has returned (plus a few seconds on B alone,
            # past the drain), not for a fixed count.
            while [ ! -e stopped ]; do
              curl -s -o /dev/null -w '%{http_code}\n' --max-time 5 \
                -H 'Host: someblog.example' "http://$HOSTIP/" || echo "curl-err"
              sleep 0.05
            done
          ) > codes.txt &
          loop=$!
          sleep 3
          docker stop --time 30 zd-a
          sleep 8
          touch stopped
          wait "$loop"

          total=$(wc -l < codes.txt)
          bad=$(grep -vc '^200$' codes.txt || true)
          echo "total=$total bad=$bad"
          sort codes.txt | uniq -c
          # ~6 req/s over at least the 3s before the stop plus the 8s after
          [ "$total" -ge 30 ]
          [ "$bad" -eq 0 ]

      - name: Logs
        if: always()
        run: |
          for c in zd-a zd-b stub; do
            echo "=== $c ==="; docker logs --tail 80 "$c" 2>&1 || true
          done

      # The fail2ban checks below bind the same host ports (:80, 8088), so
      # nothing from the handover may be left running.
      - name: Remove the handover containers
        run: docker rm -f zd-a zd-b stub

      # Host fail2ban (config/host/fail2ban/jail.local) reads the container's
      # access log (/var/instance-ssd/logs/access.log, the log dir bind mount,
      # see proxy/deploy/common.sh). Proves it still bans on that log the way
      # it did on bare metal: fail2ban-regex with every filter in
      # config/host/fail2ban/filter.d must match exactly the requests meant to
      # trigger it, and the <HOST> it extracts must be the real client IP, not
      # an attacker-supplied X-Forwarded-For. Host networking and the runner's
      # routable IP, as in the handover above and for the same reason.
      - name: Install fail2ban (for fail2ban-regex)
        run: sudo apt-get update && sudo apt-get install -y fail2ban

      # Same as unit-image.yml: production-shaped logging (to files), so this
      # exercises the log path host fail2ban actually reads.
      - uses: ./.github/actions/build-proxy-image
        env:
          LOG_TO_STDOUT: "false"
        with:
          tag: blot-proxy:f2b

      - name: Start proxy (host networking, as production) + stub upstream
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/proxylogs"
          echo "ACCESS_LOG=$RUNNER_TEMP/proxylogs/access.log" >> "$GITHUB_ENV"

          docker run -d --name f2b-proxy --network host --cap-add SYS_NICE \
            -e BLOT_HOST=localhost -e PROXY_FETCH_CDN_IPS=false \
            -e PROXY_UNIT_MAIN=127.0.0.1:8090 -e PROXY_UNIT_WORKER=127.0.0.1:8089 -e PROXY_PEER_MAIN=127.0.0.1:8088 -e PROXY_PEER_WORKER=127.0.0.1:8088 \
            -v "$RUNNER_TEMP/proxylogs:/var/log/openresty" \
            blot-proxy:f2b
          docker run -d --name f2b-stub --network host \
            -v "$PWD/proxy/e2e/stub-upstream.js:/s.js" \
            node:24.22.1-alpine node /s.js
          for i in $(seq 1 30); do
            docker exec f2b-proxy sh -c 'wget -qO- -T1 http://127.0.0.1:8090/ >/dev/null 2>&1' && break
            sleep 1
          done

      - name: Traffic + fail2ban-regex checks
        env:
          PROXY_HTTP: http://${{ env.HOSTIP }}
        run: bash proxy/e2e/fail2ban-check.sh

      - name: access.log (for debugging)
        if: always()
        run: tail -n 200 "$ACCESS_LOG" || true

      - name: Proxy logs (fail2ban)
        if: always()
        run: docker logs f2b-proxy || true

      - name: Tear down
        if: always()
        run: docker rm -f zd-a zd-b stub f2b-proxy f2b-stub 2>/dev/null || true
