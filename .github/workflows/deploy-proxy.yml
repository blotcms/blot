name: Deploy proxy

# Swaps the production proxy container for a new image with
# proxy/deploy/blue-green.sh (via scripts/deploy/proxy.sh). Manual only, like
# deploy.yml: purges sent during the few seconds both containers are up reach
# only one of them, so deploy at a quiet time (proxy/deploy/README.md).

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional commit hash or short code on master (defaults to the dispatched commit)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-proxy
  cancel-in-progress: false

env:
  BLOT_DEPLOY_SSH_HOST: ${{ secrets.BLOT_DEPLOY_SSH_HOST }}
  BLOT_DEPLOY_SSH_PORT: ${{ secrets.BLOT_DEPLOY_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history (treeless) so a short code can be resolved and
          # checked against master; see deploy.yml.
          fetch-depth: 0
          filter: blob:none

      - name: Check branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "❌ Error: This workflow can only be run on the master branch."
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi

      - name: Resolve target commit
        id: resolve
        env:
          # Bind inputs to the environment so a dispatcher cannot inject
          # shell syntax into the script below.
          COMMIT_INPUT: ${{ github.event.inputs.commit }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git fetch --quiet origin master

          if [ -z "$COMMIT_INPUT" ]; then
            # Default: the immutable commit the run was dispatched against.
            SHA="$DISPATCH_SHA"
            echo "custom=false" >> "$GITHUB_OUTPUT"
          else
            SHA=$(git rev-parse --verify --quiet "${COMMIT_INPUT}^{commit}") || {
              echo "❌ Error: could not resolve commit '$COMMIT_INPUT'"
              exit 1
            }
            echo "custom=true" >> "$GITHUB_OUTPUT"
          fi

          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "❌ Error: commit $SHA is not on master"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "✅ Target commit: $SHA"

      # Run the deploy scripts from the commit being deployed.
      - name: Switch workspace to target commit
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: git checkout --detach "$TARGET_SHA"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOT_DEPLOY_SSH_KEY }}

      - name: Configure SSH alias
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host blot
            HostName ${BLOT_DEPLOY_SSH_HOST}
            User deploy
            Port ${BLOT_DEPLOY_SSH_PORT}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH connection
        run: ssh blot "echo 'SSH connection successful'"

      # proxy.sh waits for the image (up to 25 min for the dispatched commit,
      # 2 min for a chosen one, as deploy.yml does).
      - name: Deploy
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          SKIP_BRANCH_CHECK: true
          PROXY_IMAGE_WAIT: ${{ steps.resolve.outputs.custom == 'true' && '120' || '1500' }}
        run: |
          set -o pipefail
          scripts/deploy/proxy.sh "$TARGET_SHA" 2>&1 | tee deploy.log

      # A failed swap whose old container would not come back keeps the new
      # one running and says so; make that visible on the run page.
      - name: Surface a rollback warning
        if: failure()
        run: |
          if [ -f deploy.log ] && grep -q 'WARNING:' deploy.log; then
            echo "::error::$(grep 'WARNING:' deploy.log | tail -1)"
          fi
