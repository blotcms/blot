name: Deploy proxy

# Retired: blot-blue and blot-green are units now (OpenResty and Node in one
# container, #2119), and the Deploy workflow (deploy.yml) deploys them. This
# workflow used to put a proxy-only image in both containers; run after the
# cutover it would replace the units' Node processes with nothing, so it fails
# instead. It goes in PR 7, with the other old deploy code.
#
# The one reason to deploy a proxy-only image is rolling back the cutover, by
# hand: proxy/deploy/README.md "Rolling back the cutover".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Say so
        run: |
          echo "::error::Deploy proxy is retired: blot-blue and blot-green are units, deployed by the Deploy workflow. To roll back to proxy-only containers see proxy/deploy/README.md (Rolling back the cutover)."
          exit 1
