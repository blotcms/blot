# Fails a pull request if any of its commits credits Claude, as a
# Co-Authored-By trailer or as the commit's author or committer. Squash
# merges copy the PR's commit messages into master and add a co-author
# trailer for every commit author, so a clean PR keeps master clean.
name: no-claude-coauthor

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if git log -1 --format='%an%n%cn' "$c" | grep -qiE '^claude( |$)' ||
              git log -1 --format='%ae%n%ce%n%B' "$c" | grep -qiE '^co-authored-by:.*(claude|anthropic)|@anthropic\.com$'; then
              git log -1 --format='::error::%h %s credits Claude' "$c"
              bad=1
            fi
          done
          exit $bad
