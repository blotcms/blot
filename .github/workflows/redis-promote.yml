name: redis-promote

# Runs config/redis/promote.sh against Redis 6.2 containers (old on 6.2.12,
# the production version), with ssh and sudo stubbed: see
# config/redis/tests/promote.sh. It needs Docker on the runner, so it cannot
# run inside the test image like the rest of config/redis.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/redis-promote.yml"
      - "config/redis/promote.sh"
      - "config/redis/lib.sh"
      - "config/redis/tests/promote.sh"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/redis-promote.yml"
      - "config/redis/promote.sh"
      - "config/redis/lib.sh"
      - "config/redis/tests/promote.sh"

permissions:
  contents: read

# Superseded PR pushes are cancelled. Each master push gets its own group, so
# a master run is never cancelled.
concurrency:
  group: redis-promote-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Promotion, failure paths and rollback
        run: config/redis/tests/promote.sh
