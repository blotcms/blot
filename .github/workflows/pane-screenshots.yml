# Spike for app/helper/pane: can hosted runners screenshot a real Finder,
# File Explorer and GNOME Files window? Uploads whatever we manage to capture
# as artifacts. Every capture step is best-effort so one failing platform
# doesn't hide the others' results. See app/helper/pane/PLAN.md.
name: pane-screenshots

on:
  push:
    paths:
      - "app/helper/pane/**"
      - ".github/workflows/pane-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pane-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
        scale: [2]
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME Files and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nautilus openbox feh x11-xserver-utils libglib2.0-bin xvfb xdotool imagemagick dbus-x11 dconf-gsettings-backend \
            gsettings-desktop-schemas adwaita-icon-theme gnome-themes-extra \
            fonts-cantarell libadwaita-1-0 librsvg2-common adwaita-icon-theme-full shared-mime-info
      - name: Screenshot
        run: xvfb-run -a -s "-screen 0 2560x2400x24" bash app/helper/pane/screenshots/linux.sh ${{ matrix.theme }} out ${{ matrix.scale }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pane-linux-${{ matrix.theme }}-${{ matrix.scale }}x
          path: out
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
        scale: [2]
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot
        run: bash app/helper/pane/screenshots/macos.sh ${{ matrix.theme }} out ${{ matrix.scale }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pane-macos-${{ matrix.theme }}-${{ matrix.scale }}x
          path: out
          if-no-files-found: warn

  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
        theme: [light, dark]
        scale: [2]
    steps:
      # the repo contains filenames Windows can't check out, so fetch just the script
      - name: Fetch script
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/app/helper/pane/screenshots"
          Invoke-WebRequest "$base/windows.ps1" -OutFile windows.ps1
          New-Item -ItemType Directory -Force fixture-assets | Out-Null
          foreach ($f in "checker.png", "checker.gif", "checker.jpg", "checker.html") { Invoke-WebRequest "$base/fixture-assets/$f" -OutFile "fixture-assets/$f" }
      - name: Screenshot
        shell: pwsh
        run: ./windows.ps1 -Theme ${{ matrix.theme }} -Out out -Label windows -Scale ${{ matrix.scale }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pane-windows-${{ matrix.theme }}-${{ matrix.scale }}x
          path: out
          if-no-files-found: warn

  # Commits the captures to app/helper/pane/reference so they show up in the
  # pull request. Pushes made with GITHUB_TOKEN don't trigger new workflow runs.
  commit:
    needs: [linux, macos, windows]
    if: ${{ !cancelled() && github.ref_type == 'branch' && github.ref != 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: captured
      - name: Commit images
        run: |
          REF=app/helper/pane/reference
          for os in macos windows linux; do
            rm -f "$REF/$os"/*.png
            rm -rf "$REF/resources/$os/capture-logs"
            mkdir -p "$REF/$os" "$REF/resources/$os/capture-logs"
          done
          for dir in captured/pane-*; do
            name="${dir#captured/pane-}"     # e.g. macos-light-2x
            os="${name%%-*}"
            [ -d "$REF/$os" ] || continue
            for f in "$dir"/*; do
              base="$(basename "$f")"
              case "$base" in
                # the screenshots are named <os>-<theme>[@2x][-view].png
                "$os"-*.png) cp "$f" "$REF/$os/" ;;
                # everything else (logs, versions, debug images) is a resource
                *) mkdir -p "$REF/resources/$os/capture-logs/$name"; cp "$f" "$REF/resources/$os/capture-logs/$name/" ;;
              esac
            done
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$REF"
          git diff --cached --quiet && exit 0
          git commit -m "Update pane reference screenshots"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
