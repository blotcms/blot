# Spike for app/helper/pane: can hosted runners screenshot a real Finder,
# File Explorer and GNOME Files window? Uploads whatever we manage to capture
# as artifacts. Every capture step is best-effort so one failing platform
# doesn't hide the others' results. See app/helper/pane/PLAN.md.
name: pane-screenshots

on:
  push:
    paths:
      - "app/helper/pane/**"
      - ".github/workflows/pane-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pane-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME Files and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nautilus xvfb xdotool imagemagick dbus-x11 dconf-gsettings-backend \
            gsettings-desktop-schemas adwaita-icon-theme gnome-themes-extra \
            fonts-cantarell libadwaita-1-0 librsvg2-common adwaita-icon-theme-full shared-mime-info
      - name: Screenshot
        run: xvfb-run -a -s "-screen 0 1280x800x24" bash app/helper/pane/screenshots/linux.sh ${{ matrix.theme }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pane-linux-${{ matrix.theme }}
          path: out
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot
        run: bash app/helper/pane/screenshots/macos.sh ${{ matrix.theme }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pane-macos-${{ matrix.theme }}
          path: out
          if-no-files-found: warn

  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        theme: [light, dark]
    steps:
      # the repo contains filenames Windows can't check out, so fetch just the script
      - name: Fetch script
        shell: pwsh
        run: Invoke-WebRequest "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/app/helper/pane/screenshots/windows.ps1" -OutFile windows.ps1
      - name: Screenshot
        shell: pwsh
        run: ./windows.ps1 -Theme ${{ matrix.theme }} -Out out -Label ${{ matrix.runner }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pane-${{ matrix.runner }}-${{ matrix.theme }}
          path: out
          if-no-files-found: warn

  # Commits the captures to app/helper/pane/reference so they show up in the
  # pull request. Pushes made with GITHUB_TOKEN don't trigger new workflow runs.
  commit:
    needs: [linux, macos, windows]
    if: ${{ !cancelled() && github.ref_type == 'branch' && github.ref != 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: captured
      - name: Commit images
        run: |
          rm -rf app/helper/pane/reference
          for dir in captured/pane-*; do
            name="${dir#captured/pane-}"
            mkdir -p "app/helper/pane/reference/$name"
            cp "$dir"/*.png "$dir"/versions.txt "app/helper/pane/reference/$name/" 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/helper/pane/reference
          git diff --cached --quiet && exit 0
          git commit -m "Update pane reference screenshots"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
