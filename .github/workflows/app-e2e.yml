name: app-e2e

# A real round trip through the proxy container to a Blot app container (site +
# dashboard sign in / sign out, plus a seeded blog rendering on its own vhost).
#
# Its own workflow so it runs on every PR and every push to master: GitHub's
# path filters are per workflow, and integration.yml filters the rest of the
# proxy suites. It builds its own proxy image and runs the production app image
# build.yml pushes for the commit (:<sha>-arm64) - the bytes deploy.yml ships -
# so it also stands in for a boot check of the prod target.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  BLOT_HOST: localhost
  BLOT_REPO: ${{ github.workspace }}
  # Skip the BunnyCDN edge-IP fetch so image builds stay hermetic. Local and
  # deploy generates still fetch by default (see proxy/build/index.js).
  FETCH_CDN_IPS: "false"

jobs:
  app-e2e:
    # arm64: the app image it pulls (build.yml's) is arm64 only
    runs-on: ubuntu-24.04-arm
    # A fork PR's build.yml can't push the image to GHCR, so there is none to run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install config generator dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/gendeps"
          cd "$RUNNER_TEMP/gendeps"
          npm init -y >/dev/null
          npm install --no-audit --no-fund mustache@4.2.0 fs-extra@11.1.0

      - name: Generate proxy config (BLOT_HOST=localhost)
        run: bash proxy/build/build.sh
        env:
          NODE_PATH: ${{ runner.temp }}/gendeps/node_modules:${{ github.workspace }}/app

      - name: Build proxy image
        run: docker build -f proxy/Dockerfile -t blot-proxy:e2e proxy/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build.yml pushes this commit's prod image (blot:prod-<sha>-arm64) once it has built it, and this
      # workflow doesn't wait for it, so poll for it.
      - name: Pull Blot app image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/blot:prod-${{ github.sha }}-arm64"
          for i in $(seq 1 240); do
            docker manifest inspect "$IMAGE" > /dev/null 2>&1 && break
            [ "$i" = 1 ] && echo "Waiting for build.yml to push $IMAGE"
            sleep 5
          done
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::$IMAGE was not pushed within 20 minutes; did the build workflow fail?"
            exit 1
          fi
          docker pull "$IMAGE"
          echo "BLOT_APP_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: ./.github/actions/start-minio

      - name: Create the storage bucket
        run: aws --endpoint-url "$BLOT_STORAGE_ENDPOINT" s3 mb "s3://$BLOT_STORAGE_BUCKET"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.BLOT_AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BLOT_AWS_SECRET }}
          AWS_DEFAULT_REGION: ${{ env.BLOT_STORAGE_REGION }}

      - name: Start the stack
        run: docker compose -f proxy/e2e/docker-compose.yml up -d --wait --wait-timeout 420

      # /health answers before the app has finished starting up: it is still
      # building the global templates and the folder templates, which would race
      # the seed scripts below (both build templates). The production app logs
      # one of these lines when the folder build is done.
      - name: Wait for the app to finish starting
        run: |
          for i in $(seq 1 120); do
            docker compose -f proxy/e2e/docker-compose.yml logs --no-color app \
              | grep -qE "Built folders asynchronously|Error building folders" && exit 0
            sleep 1
          done
          echo "::error::the app did not finish starting within 2 minutes"
          exit 1

      - name: Seed a user
        run: |
          docker compose -f proxy/e2e/docker-compose.yml cp \
            proxy/e2e/seed-user.js app:/tmp/seed-user.js
          docker compose -f proxy/e2e/docker-compose.yml exec -T app \
            node /tmp/seed-user.js e2e@example.com e2e-password

      - name: Seed a blog
        id: seed-blog
        run: |
          docker compose -f proxy/e2e/docker-compose.yml cp \
            proxy/e2e/seed-blog.js app:/tmp/seed-blog.js
          out=$(docker compose -f proxy/e2e/docker-compose.yml exec -T app \
            node /tmp/seed-blog.js e2e@example.com e2eblog)
          echo "$out"
          json=$(echo "$out" | grep -o 'SEED_BLOG_RESULT=.*' | head -n1 | cut -d= -f2-)
          host=$(printf '%s' "$json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).host))')
          test -n "$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Run end-to-end checks
        env:
          PROXY_ORIGIN: https://127.0.0.1
          E2E_EMAIL: e2e@example.com
          E2E_PASSWORD: e2e-password
          E2E_BLOG_HOST: ${{ steps.seed-blog.outputs.host }}
        run: node proxy/e2e/run.js

      # The git client through the same proxy, with the runner's real git.
      # Seeded after the existing suite's steps and run under !cancelled(), so
      # a failure in run.js still lets these run (and the reverse).
      # One blog per client under test, so the handle-rename check (which
      # mutates the blog) in one client's run can't break another's. They share
      # the one user, and so the one token.
      - name: Seed git blogs
        id: seed-git
        if: ${{ !cancelled() && steps.seed-blog.conclusion == 'success' }}
        run: |
          docker compose -f proxy/e2e/docker-compose.yml cp \
            proxy/e2e/seed-git.js app:/tmp/seed-git.js
          field() { printf '%s' "$2" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[process.argv[1]]))' "$1"; }
          # output-prefix:handle
          for spec in :e2egit old_:e2egitold libgit2_:e2egitlibgit2; do
            prefix=${spec%%:*}
            out=$(docker compose -f proxy/e2e/docker-compose.yml exec -T app \
              node /tmp/seed-git.js e2e@example.com "${spec#*:}")
            json=$(echo "$out" | grep -o 'SEED_GIT_RESULT=.*' | head -n1 | cut -d= -f2-)
            # Everything the seed printed except the result line (it has the token)
            echo "$out" | grep -v 'SEED_GIT_RESULT=' || true
            test -n "$json"
            token=$(field token "$json")
            echo "::add-mask::$token"
            {
              echo "${prefix}handle=$(field handle "$json")"
              echo "${prefix}host=$(field host "$json")"
              echo "${prefix}blog_id=$(field blogID "$json")"
              echo "token=$token"
            } >> "$GITHUB_OUTPUT"
            echo "seeded git blog $(field handle "$json")"
          done

      - name: Run git end-to-end checks
        if: ${{ !cancelled() && steps.seed-git.conclusion == 'success' }}
        env:
          PROXY_ORIGIN: https://127.0.0.1
          E2E_GIT_EMAIL: e2e@example.com
          E2E_GIT_HANDLE: ${{ steps.seed-git.outputs.handle }}
          E2E_GIT_BLOG_HOST: ${{ steps.seed-git.outputs.host }}
          E2E_GIT_BLOG_ID: ${{ steps.seed-git.outputs.blog_id }}
          E2E_GIT_TOKEN: ${{ steps.seed-git.outputs.token }}
        run: node proxy/e2e/git-checks.js

      # Git 2.37 is the oldest stock git seen from real clients (GitHub
      # Desktop, VS Code, Xcode and Git for Windows all wrap stock git, so
      # versions stand in for them). Built from the pinned release tarball and
      # cached; no supported distro release ships 2.37.
      - name: Cache git 2.37.7
        id: cache-old-git
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/git-2.37.7
          key: git-2.37.7-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Build git 2.37.7
        if: ${{ !cancelled() && steps.cache-old-git.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev zlib1g-dev
          curl -fsSL -o "$RUNNER_TEMP/git.tar.gz" https://www.kernel.org/pub/software/scm/git/git-2.37.7.tar.gz
          echo "2108fa57b74add4300b8960e9404e0ed3e5f0efda7470450c67c67e8ab7616d5  $RUNNER_TEMP/git.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/git.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/git-2.37.7" -j"$(nproc)" prefix="$HOME/git-2.37.7" \
            NO_GETTEXT=1 NO_TCL=1 NO_PERL=1 NO_PYTHON=1 NO_EXPAT=1 NO_INSTALL_HARDLINKS=1 install

      - name: Run git end-to-end checks (git 2.37.7)
        if: ${{ !cancelled() && steps.seed-git.conclusion == 'success' }}
        env:
          GIT_BIN: /home/runner/git-2.37.7/bin/git
          PROXY_ORIGIN: https://127.0.0.1
          E2E_GIT_EMAIL: e2e@example.com
          E2E_GIT_HANDLE: ${{ steps.seed-git.outputs.old_handle }}
          E2E_GIT_BLOG_HOST: ${{ steps.seed-git.outputs.old_host }}
          E2E_GIT_BLOG_ID: ${{ steps.seed-git.outputs.old_blog_id }}
          E2E_GIT_TOKEN: ${{ steps.seed-git.outputs.token }}
        run: node proxy/e2e/git-checks.js

      # Working Copy (iOS) is built on libgit2 rather than the git CLI.
      - name: Smoke test through libgit2 (pygit2)
        if: ${{ !cancelled() && steps.seed-git.conclusion == 'success' }}
        env:
          PROXY_ORIGIN: https://127.0.0.1
          E2E_GIT_EMAIL: e2e@example.com
          E2E_GIT_HANDLE: ${{ steps.seed-git.outputs.libgit2_handle }}
          E2E_GIT_BLOG_HOST: ${{ steps.seed-git.outputs.libgit2_host }}
          E2E_GIT_TOKEN: ${{ steps.seed-git.outputs.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pygit2-venv"
          "$RUNNER_TEMP/pygit2-venv/bin/pip" install --quiet --disable-pip-version-check pygit2==1.18.0
          "$RUNNER_TEMP/pygit2-venv/bin/python" proxy/e2e/libgit2-smoke.py

      - name: Stack logs
        if: always()
        run: docker compose -f proxy/e2e/docker-compose.yml logs --no-color --tail 300 || true

      - name: Tear down
        if: always()
        run: docker compose -f proxy/e2e/docker-compose.yml down -v || true
