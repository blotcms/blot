name: app-e2e

# A real round trip through the proxy to a Blot app (site + dashboard sign in /
# sign out and a saved setting, a seeded blog rendering on its own vhost, the
# client for pushing to a blog), gating deploy.yml.
#
# Its own workflow so it runs on every PR and every push to master: GitHub's
# path filters are per workflow, and integration.yml filters the rest of the
# proxy suites. On master it runs the unit image unit-image.yml pushes
# (:<sha>-arm64), the bytes deploy.yml ships, as docker-compose.unit.yml. A PR
# can't rely on that image (unit-image.yml is path filtered), so there it builds
# its own proxy image and runs the production app image build.yml pushes
# (:prod-<sha>-arm64), which also stands in for a boot check of the prod target.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # The compiled stages of the proxy image come from here (proxy/build/image.sh);
  # unit-image.yml writes it on master. Layers are arm64, as production.
  PROXY_IMAGE_CACHE: ghcr.io/blotcms/blot:cache-proxy-arm64
  BLOT_HOST: localhost
  BLOT_REPO: ${{ github.workspace }}
  # Skip the BunnyCDN edge-IP fetch so image builds stay hermetic. Local and
  # deploy generates still fetch by default (see proxy/build/index.js).
  FETCH_CDN_IPS: "false"
  # TEMPORARY: also on this PR's branch, to test the master path before merge
  E2E_UNIT: ${{ github.event_name == 'push' || github.head_ref == 'claude/ci-smoke-deployed-image' }}
  E2E_COMPOSE_FILE: ${{ (github.event_name == 'push' || github.head_ref == 'claude/ci-smoke-deployed-image') && 'proxy/e2e/docker-compose.unit.yml' || 'proxy/e2e/docker-compose.yml' }}

jobs:
  app-e2e:
    # arm64: the app image it pulls (build.yml's) is arm64 only
    runs-on: ubuntu-24.04-arm
    # A fork PR's build.yml can't push the image to GHCR, so there is none to run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install config generator dependencies
        if: ${{ env.E2E_UNIT != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/gendeps"
          cd "$RUNNER_TEMP/gendeps"
          npm init -y >/dev/null
          npm install --no-audit --no-fund mustache@4.2.0 fs-extra@11.1.0

      - name: Generate proxy config (BLOT_HOST=localhost)
        if: ${{ env.E2E_UNIT != 'true' }}
        run: bash proxy/build/build.sh
        env:
          NODE_PATH: ${{ runner.temp }}/gendeps/node_modules:${{ github.workspace }}/app

      - name: Build proxy image
        if: ${{ env.E2E_UNIT != 'true' }}
        run: bash proxy/build/image.sh blot-proxy:e2e

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # unit-image.yml pushes the unit image (:<sha>-arm64) as soon as it has built it,
      # before its own checks, and build.yml the prod image (:prod-<sha>-arm64); this
      # workflow doesn't wait for either, so poll.
      - name: Pull Blot image
        run: |
          if [ "$E2E_UNIT" = true ]; then
            IMAGE="ghcr.io/${{ github.repository_owner }}/blot:${{ github.sha }}-arm64"
          else
            IMAGE="ghcr.io/${{ github.repository_owner }}/blot:prod-${{ github.sha }}-arm64"
          fi
          for i in $(seq 1 120); do
            docker manifest inspect "$IMAGE" > /dev/null 2>&1 && break
            [ "$i" = 1 ] && echo "Waiting for $IMAGE"
            sleep 5
          done
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::$IMAGE was not pushed within 10 minutes; did the image workflow fail?"
            exit 1
          fi
          docker pull "$IMAGE"
          echo "BLOT_APP_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: ./.github/actions/start-minio

      - name: Create the storage bucket
        run: aws --endpoint-url "$BLOT_STORAGE_ENDPOINT" s3 mb "s3://$BLOT_STORAGE_BUCKET"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.BLOT_AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BLOT_AWS_SECRET }}
          AWS_DEFAULT_REGION: ${{ env.BLOT_STORAGE_REGION }}

      - name: Start the stack
        run: docker compose -f "$E2E_COMPOSE_FILE" up -d --wait --wait-timeout 420

      # /health answers before the app has finished starting up: it is still
      # building the global templates and the folder templates, which would race
      # the seed scripts below (both build templates). The production app logs
      # one of these lines when the folder build is done.
      - name: Wait for the app to finish starting
        run: |
          for i in $(seq 1 120); do
            docker compose -f "$E2E_COMPOSE_FILE" logs --no-color app \
              | grep -qE "Built folders asynchronously|Error building folders" && exit 0
            sleep 1
          done
          echo "::error::the app did not finish starting within 2 minutes"
          exit 1

      - name: Seed a user
        run: |
          docker compose -f "$E2E_COMPOSE_FILE" cp \
            proxy/e2e/seed-user.js app:/tmp/seed-user.js
          docker compose -f "$E2E_COMPOSE_FILE" exec -T -u 1000 app \
            node /tmp/seed-user.js e2e@example.com e2e-password

      - name: Seed a blog
        id: seed-blog
        run: |
          docker compose -f "$E2E_COMPOSE_FILE" cp \
            proxy/e2e/seed-blog.js app:/tmp/seed-blog.js
          out=$(docker compose -f "$E2E_COMPOSE_FILE" exec -T -u 1000 app \
            node /tmp/seed-blog.js e2e@example.com e2eblog)
          echo "$out"
          json=$(echo "$out" | grep -o 'SEED_BLOG_RESULT=.*' | head -n1 | cut -d= -f2-)
          host=$(printf '%s' "$json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).host))')
          test -n "$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Run end-to-end checks
        env:
          PROXY_ORIGIN: https://127.0.0.1
          E2E_EMAIL: e2e@example.com
          E2E_PASSWORD: e2e-password
          E2E_BLOG_HOST: ${{ steps.seed-blog.outputs.host }}
        run: node proxy/e2e/run.js

      # The git client through the same proxy, with the runner's real git.
      # Seeded after the existing suite's steps and run under !cancelled(), so
      # a failure in run.js still lets these run (and the reverse).
      - name: Seed git blog
        id: seed-git
        if: ${{ !cancelled() && steps.seed-blog.conclusion == 'success' }}
        run: |
          docker compose -f "$E2E_COMPOSE_FILE" cp \
            proxy/e2e/seed-git.js app:/tmp/seed-git.js
          out=$(docker compose -f "$E2E_COMPOSE_FILE" exec -T -u 1000 app \
            node /tmp/seed-git.js e2e@example.com e2egit)
          json=$(echo "$out" | grep -o 'SEED_GIT_RESULT=.*' | head -n1 | cut -d= -f2-)
          # Everything the seed printed except the result line (it has the token)
          echo "$out" | grep -v 'SEED_GIT_RESULT=' || true
          test -n "$json"
          field() { printf '%s' "$json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[process.argv[1]]))' "$1"; }
          token=$(field token)
          echo "::add-mask::$token"
          {
            echo "handle=$(field handle)"
            echo "host=$(field host)"
            echo "blog_id=$(field blogID)"
            echo "token=$token"
          } >> "$GITHUB_OUTPUT"
          echo "seeded git blog $(field handle)"

      - name: Run git end-to-end checks
        if: ${{ !cancelled() && steps.seed-git.conclusion == 'success' }}
        env:
          PROXY_ORIGIN: https://127.0.0.1
          E2E_GIT_EMAIL: e2e@example.com
          E2E_GIT_HANDLE: ${{ steps.seed-git.outputs.handle }}
          E2E_GIT_BLOG_HOST: ${{ steps.seed-git.outputs.host }}
          E2E_GIT_BLOG_ID: ${{ steps.seed-git.outputs.blog_id }}
          E2E_GIT_TOKEN: ${{ steps.seed-git.outputs.token }}
        run: node proxy/e2e/git-checks.js

      - name: Stack logs
        if: always()
        run: |
          docker compose -f "$E2E_COMPOSE_FILE" logs --no-color --tail 300 || true
          # the unit's OpenResty writes its logs to files, not stdout
          if [ "$E2E_UNIT" = true ]; then
            docker compose -f "$E2E_COMPOSE_FILE" exec -T app sh -c 'echo "--- error.log"; tail -n 60 /var/log/openresty/error.log; echo "--- access.log"; tail -n 80 /var/log/openresty/access.log' || true
          fi

      - name: Tear down
        if: always()
        run: docker compose -f "$E2E_COMPOSE_FILE" down -v || true
