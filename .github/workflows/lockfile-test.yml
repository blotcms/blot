# TEMPORARY: checks a package-lock.json generated on macOS or on linux arm64
# installs sharp on both. Delete before merging.
name: lockfile-test

on:
  push:
    branches: [claude/awesome-gauss-nwwvxs]

permissions:
  contents: read

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
          - name: linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        uses: ./.github/actions/versions
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.NODE_VERSION }}
      - name: Generate lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          node -v; npm -v; uname -a
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "sharp platform packages in lockfile:"
          grep -o '"node_modules/@img/[^"]*"' package-lock.json | sort
          grep -q '"node_modules/@img/sharp-linuxmusl-arm64"' package-lock.json
          grep -q '"node_modules/@img/sharp-darwin-arm64"' package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: lock-${{ matrix.name }}
          path: package-lock.json

  mac:
    needs: generate
    strategy:
      fail-fast: false
      matrix:
        lock: [mac, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: versions
        uses: ./.github/actions/versions
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: lock-${{ matrix.lock }}
      - name: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci --no-audit --no-fund
      - name: sharp works
        run: |
          node -e "
            const sharp = require('sharp');
            console.log(sharp.versions);
            sharp({create:{width:64,height:64,channels:3,background:'red'}})
              .jpeg().toBuffer()
              .then(b => sharp(b).resize(32).webp().toBuffer())
              .then(b => console.log('ok, webp bytes', b.length));
          "
          node -e "require('re2'); console.log('re2 ok')"
      - name: npm install leaves the lockfile alone
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          cp package-lock.json /tmp/before.json
          npm install --no-audit --no-fund
          diff /tmp/before.json package-lock.json && echo "unchanged"

  docker:
    needs: generate
    strategy:
      fail-fast: false
      matrix:
        lock: [mac, linux]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - id: versions
        uses: ./.github/actions/versions
      - uses: actions/download-artifact@v4
        with:
          name: lock-${{ matrix.lock }}
      - name: Build prod and dev
        run: |
          set -a; . config/versions.env; set +a
          for target in prod dev; do
            docker build --target $target \
              --build-arg NODE_BASE --build-arg PANDOC_VERSION \
              --build-arg NSJAIL_VERSION --build-arg NSJAIL_COMMIT \
              -t blot-$target .
          done
      - name: sharp works in prod (system libvips, HEIC)
        run: |
          docker run --rm blot-prod node -e "
            const sharp = require('sharp');
            console.log(sharp.versions);
            sharp({create:{width:64,height:64,channels:3,background:'red'}})
              .jpeg().toBuffer()
              .then(b => sharp(b).resize(32).webp().toBuffer())
              .then(b => console.log('ok, webp bytes', b.length));
            console.log('heif', sharp.format.heif.input);
            require('re2'); console.log('re2 ok');
          "
