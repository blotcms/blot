# Screenshots the template gallery previews and commits the images.
#
# Nearly all of the wall-clock time used to go on rebuilding the demo blogs the
# previews are rendered from, so this workflow:
#   - caches the built demo blogs (data/blogs, data/static, data/redis) and
#     re-uses them, leaving the folder build to sync only what changed
#   - builds only the demo folders needed by the templates being screenshotted
#   - takes screenshots several at a time instead of one every two seconds
#
# Caches are scoped per branch, but every branch can read the caches saved by
# master. Running this workflow on master once therefore warms the cache for
# every other branch.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      templates:
        description: 'Templates to screenshot, comma-separated (e.g. "album,blog"). Blank screenshots every template.'
        required: false
        default: ""
      rebuild_demo_blogs:
        description: "Reset cache"
        type: boolean
        default: false

jobs:
  test:
    runs-on: macos-latest

    strategy:
      matrix:
        node-version: [22.14.0]
        # Matches the version installed in the Dockerfile. The macOS build must
        # be arm64: the runners are Apple silicon and an x86_64 pandoc would be
        # translated by Rosetta on every conversion, which the folder build does
        # thousands of.
        pandoc-version: [3.6.1]

    env:
      # How many screenshots to take at once. A tuning knob for the runner
      # rather than something to vary per run, so it lives here rather than
      # as a workflow_dispatch input - edit this line to change it.
      BLOT_SCREENSHOT_CONCURRENCY: 4
      TEMPLATES: ${{ inputs.templates }}

    steps:
      # GITHUB_TOKEN is deliberately not used here: GitHub does not let a
      # push authenticated with GITHUB_TOKEN trigger other workflow runs (to
      # prevent recursive triggering), so the "Commit changes" push at the
      # end of this job would silently never run build.yml/node.yml's checks
      # on this PR. SCREENSHOTS_PUSH_TOKEN is a personal access token (repo
      # Settings -> Secrets and variables -> Actions) scoped to this repo's
      # Contents: Read and write - falls back to GITHUB_TOKEN if unset, which
      # still works but without triggering CI on the resulting commit.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.SCREENSHOTS_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      # hashFiles() only works inside a step (job-level env can't see the
      # checked-out files yet), so the key is computed here and exported for
      # the restore/delete/save steps below to share - keeping the three from
      # drifting apart.
      - name: Compute demo blogs cache key
        run: |
          echo "DEMO_BLOGS_CACHE_KEY=demo-blogs-v1-pandoc${{ matrix.pandoc-version }}-${{ hashFiles('app/templates/folders/**', 'app/build/**', 'app/sync/**', 'app/models/**', 'package.json') }}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ./package.json

      - name: Cache Pandoc
        id: cache-pandoc
        uses: actions/cache@v4
        with:
          path: data/pandoc
          key: pandoc-${{ matrix.pandoc-version }}-arm64-macos

      - name: Set up Pandoc
        run: |
          # The archive unpacks to pandoc-<version>-arm64/
          PANDOC_DIR="$(pwd)/data/pandoc/pandoc-${{ matrix.pandoc-version }}-arm64"
          if [ ! -x "$PANDOC_DIR/bin/pandoc" ]; then
            mkdir -p data/pandoc
            cd data/pandoc
            curl -fsSL -o pandoc.zip \
              https://github.com/jgm/pandoc/releases/download/${{ matrix.pandoc-version }}/pandoc-${{ matrix.pandoc-version }}-arm64-macOS.zip
            unzip -q -o pandoc.zip
            rm pandoc.zip
            cd ../..
          fi
          echo "BLOT_PANDOC_PATH=$PANDOC_DIR/bin/pandoc" >> $GITHUB_ENV
          "$PANDOC_DIR/bin/pandoc" --version

      # node_modules rather than just the npm download cache: there is no
      # package-lock.json (see the Dockerfile) so `npm install` re-resolves and
      # rebuilds sharp every run, and puppeteer re-downloads Chrome.
      - name: Cache Node modules and the Puppeteer browser
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ matrix.node-version }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/var/homebrew/locks
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/screenshots.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Install dnsmasq, Redis and Nginx
        run: brew install dnsmasq redis nginx

      - name: Use dnsmasq to resolve blot.development
        run: |
          export LOCAL_CUSTOM_TLD="blot.development"
          echo "address=/.${LOCAL_CUSTOM_TLD}/127.0.0.1" >> $(brew --prefix)/etc/dnsmasq.conf
          sudo mkdir -p /etc/resolver/
          cat <<EOF | sudo tee /etc/resolver/${LOCAL_CUSTOM_TLD}
          nameserver 127.0.0.1
          EOF
          sudo brew services restart dnsmasq
          sudo killall -HUP mDNSResponder
          scutil --dns

      - name: Configure and start Nginx reverse proxy
        run: |
          sudo tee /opt/homebrew/etc/nginx/nginx.conf <<EOF
          events { }
          http {
              server {
                  listen 80;
                  location / {
                      proxy_pass http://localhost:8080;
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                  }
              }
          }
          EOF
          sudo nginx

      # The demo blogs are expensive to build: every file is converted with
      # pandoc, every image resized, and the result written to Redis. Their
      # blog IDs are random, so the folders, the resized images and the Redis
      # database have to be restored together or not at all.
      #
      # The key covers the demo folders and the code that turns them into
      # entries. It deliberately excludes app/templates/source, which is what
      # usually changes when this workflow is run and which the templates build
      # picks up on every run anyway. There are no restore-keys: a partial hit
      # would restore entries built by different code without rebuilding them,
      # which would silently screenshot stale pages.
      - name: Restore demo blogs
        id: cache-demo-blogs
        if: ${{ !inputs.rebuild_demo_blogs }}
        uses: actions/cache/restore@v4
        with:
          path: |
            data/blogs
            data/static
            data/cdn
            data/redis
          key: ${{ env.DEMO_BLOGS_CACHE_KEY }}

      # actions/cache/save refuses to overwrite an existing key, so without
      # this, rebuild_demo_blogs would rebuild locally but the next run would
      # still restore the very cache entry it was meant to replace.
      - name: Drop the cached demo blogs before rebuilding
        if: ${{ inputs.rebuild_demo_blogs }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete "$DEMO_BLOGS_CACHE_KEY" --repo "${{ github.repository }}" ||
            echo "No cached demo blogs at $DEMO_BLOGS_CACHE_KEY to delete"

      - name: Start Redis
        run: |
          mkdir -p data/redis
          redis-server --daemonize yes --dir "$(pwd)/data/redis" --dbfilename dump.rdb
          until redis-cli ping 2>/dev/null | grep -q PONG; do sleep 0.2; done
          echo "Redis holds $(redis-cli dbsize | tr -d '[:space:]') keys"

      - name: Take screenshots
        id: screenshots
        env:
          BLOT_PROTOCOL: http
          BLOT_ENVIRONMENT: development
          BLOT_HOST: blot.development
        run: |
          export BLOT_DIRECTORY=$(pwd)
          export NODE_PATH=$(pwd)/app

          echo "Building templates"
          node app/templates/index.js --no-watch

          node app/index.js &

          echo "Building demo folders"
          node app/templates/folders/index.js --for-templates="$TEMPLATES"

          # Flush Redis to disk here rather than at the end of the job: this is
          # the state worth caching, and it is worth caching even if a
          # screenshot fails further down.
          redis-cli save
          echo "demo_blogs_built=true" >> $GITHUB_OUTPUT

          # The folder build used to take minutes, which was long enough for
          # the server to come up on its own. A cache hit skips almost all of
          # that work, so wait explicitly rather than screenshot a server that
          # is not listening yet. The Host header picks the same vhost the
          # previews are served from.
          echo "Waiting for the server to listen"
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null -H "Host: $BLOT_HOST" http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS -o /dev/null -H "Host: $BLOT_HOST" http://localhost:8080/health

          echo "Taking screenshots"
          node app/templates/screenshots.js "$TEMPLATES"

      # Only a full run has built every demo folder, so only a full run may
      # write the cache the next run will trust. A failed screenshot says
      # nothing about the demo blogs, so cache them either way.
      - name: Save demo blogs
        if: ${{ always() && steps.screenshots.outputs.demo_blogs_built == 'true' && inputs.templates == '' && steps.cache-demo-blogs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/blogs
            data/static
            data/cdn
            data/redis
          key: ${{ env.DEMO_BLOGS_CACHE_KEY }}

      # Deliberately not run when the screenshots step failed: the image
      # directory is emptied before a run, so committing a partial run would
      # publish a template gallery with missing images.
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Updates screenshots of templates"
            git push
          fi
