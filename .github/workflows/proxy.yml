name: proxy

# Build-only CI for the containerised OpenResty proxy (see proxy/README.md).
# It generates the config, builds the image, checks the config parses and
# checks the container boots and answers a health check. It does NOT deploy
# anything and does not yet run the proxy/tests integration suite.

# The path filters include the external inputs the config generator reads
# directly (root package.json for mustache/fs-extra, app/config.js ->
# config/index.js for icloud/webhooks limits, config/openresty for the
# canonical .conf / .lua files), not just proxy/.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/proxy.yml"
      - "proxy/**"
      - "config/openresty/**"
      - "package.json"
      - "app/config.js"
      - "config/index.js"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/proxy.yml"
      - "proxy/**"
      - "config/openresty/**"
      - "package.json"
      - "app/config.js"
      - "config/index.js"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 21.7.3

      # The repo has no committed package-lock.json, so `npm ci` / cache: npm
      # are not usable, and `npm install` in the repo root would build the
      # whole native dependency tree. The config generator only needs these
      # two packages; require("config") resolves to app/config.js, which has
      # no third-party dependencies.
      - name: Install config generator dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/gendeps"
          cd "$RUNNER_TEMP/gendeps"
          npm init -y >/dev/null
          npm install --no-audit --no-fund mustache@4.2.0 fs-extra@11.1.0

      - name: Generate OpenResty config
        run: bash proxy/build/build.sh
        env:
          NODE_PATH: ${{ runner.temp }}/gendeps/node_modules:${{ github.workspace }}/app
          FETCH_CDN_IPS: "false"

      - name: Build proxy image
        run: docker build -f proxy/Dockerfile -t blot-proxy:ci proxy/

      - name: Validate generated OpenResty config
        # The image holds a template; render it (as the entrypoint does) first
        run: |
          docker run --rm -e PROXY_FETCH_CDN_IPS=false --entrypoint bash blot-proxy:ci \
            -c 'render-config && /usr/local/openresty/bin/openresty -t'

      - name: Runtime settings reach the rendered config
        run: |
          docker run --rm --entrypoint bash \
            -e PROXY_FETCH_CDN_IPS=false \
            -e PROXY_REDIS_HOST=10.1.2.3 \
            -e PROXY_SERVER_LABEL=eu \
            -e PROXY_RESOLVER=127.0.0.11 \
            -e PROXY_PRIVATE_IP=127.0.0.2 \
            -e PROXY_UPSTREAM_GREEN=10.0.0.1:9089 \
            -e PROXY_UPSTREAM_BLUE=10.0.0.2:9088 \
            -e PROXY_UPSTREAM_YELLOW=10.0.0.3:9090 \
            blot-proxy:ci -c '
              set -e
              render-config
              conf=/usr/local/openresty/nginx/conf/nginx.conf
              grep -q "host = \"10.1.2.3\"" $conf
              grep -q "Blot-Server. .eu. always" $conf
              grep -q "resolver 127.0.0.11;" $conf
              grep -q "listen 127.0.0.2:8077 reuseport;" $conf
              grep -q "server 10.0.0.1:9089 weight=100;" $conf
              grep -q "server 10.0.0.2:9088 weight=100;" $conf
              grep -q "server 10.0.0.3:9090 weight=100;" $conf
              grep -q "proxy_pass http://10.0.0.1:9089;" $conf
              if grep -q "\${PROXY_" $conf; then echo "unsubstituted placeholder"; exit 1; fi
              /usr/local/openresty/bin/openresty -t
            '

      - name: Deploy scripts (fake docker and systemctl)
        run: bash proxy/deploy/tests/run.sh

      - name: Boot container and check health endpoint
        run: |
          docker run -d --name blot-proxy-ci --cap-add SYS_NICE \
            -p 8080:80 -e BLOT_HOST=example.com blot-proxy:ci
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          echo "--- container logs ---"
          docker logs blot-proxy-ci || true
          docker rm -f blot-proxy-ci >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then
            echo "proxy container did not serve /health with 200"
            exit 1
          fi
