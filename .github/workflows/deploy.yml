name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional commit hash or short code on master (defaults to the dispatched commit)"
        required: false
        default: ""
      skip_checks:
        description: "Deploy even if CI for the commit hasn't passed (emergencies only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read # To read CI results for the target commit

env:
  REGISTRY_URL: ghcr.io/blotcms/blot
  AIRLOCK_REGISTRY_URL: ghcr.io/blotcms/blot-airlock
  BLOT_DEPLOY_SSH_HOST: ${{ secrets.BLOT_DEPLOY_SSH_HOST }}
  BLOT_DEPLOY_SSH_PORT: ${{ secrets.BLOT_DEPLOY_SSH_PORT }}

# Deploys the two units, blot-blue then blot-green (scripts/deploy/units.sh and
# proxy/deploy/blue-green.sh; each unit is OpenResty and Node in one container,
# #2119). The first run on a host that still has the proxy-only containers and
# the blot-container-* Node containers is the cutover (proxy/deploy/README.md).
#
# One production deploy at a time. A queued run waits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Everything that doesn't depend on the image (checkout, SSH, Node, GHCR
# login) runs first, so when the run is dispatched straight after a merge the
# only thing left once build.yml publishes the image is the deploy itself.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: deploy

    steps:
      - name: Check branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "❌ Error: This workflow can only be run on the master branch."
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full commit history so an older commit or short code can be
          # resolved and verified against master, but nothing else: tree:0
          # fetches commits only, and the sparse checkout then pulls just the
          # trees and blobs for scripts/deploy and proxy/deploy (the deploy
          # scripts need nothing but Node built-ins, bash and ssh).
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            scripts/deploy
            proxy/deploy

      - name: Resolve and check out target commit
        id: resolve
        env:
          # Bind inputs to the environment so a dispatcher cannot inject
          # shell syntax into the script below.
          COMMIT_INPUT: ${{ github.event.inputs.commit }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git fetch --quiet origin master

          if [ -z "$COMMIT_INPUT" ]; then
            # Default: the immutable commit the run was dispatched against.
            SHA="$DISPATCH_SHA"
            CUSTOM=false
          else
            SHA=$(git rev-parse --verify --quiet "${COMMIT_INPUT}^{commit}") || {
              echo "❌ Error: could not resolve commit '$COMMIT_INPUT'"
              exit 1
            }
            CUSTOM=true
          fi

          # The deploy environment's branch policy is evaluated against the
          # run ref (master), so the target must live on master too - both to
          # honour that policy and because build.yml only publishes images
          # for master commits.
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "❌ Error: commit $SHA is not on master"
            exit 1
          fi

          git checkout --quiet --detach "$SHA"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "custom=$CUSTOM" >> "$GITHUB_OUTPUT"
          echo "✅ Target commit: $SHA (custom=$CUSTOM)"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOT_DEPLOY_SSH_KEY }}

      - name: Configure and verify SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host blot
            HostName ${BLOT_DEPLOY_SSH_HOST}
            User deploy
            Port ${BLOT_DEPLOY_SSH_PORT}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            # scripts/deploy runs dozens of separate ssh commands; reuse one
            # connection instead of a fresh handshake for each.
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 30m
          EOF
          chmod 600 ~/.ssh/config
          ssh blot "echo 'SSH connection successful'"

      # No npm install: scripts/deploy only uses Node built-ins.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Don't ship a commit whose CI failed. build.yml publishes the image only
      # after its own checks, but node.yml (tests) is independent of it.
      - name: Wait for CI on the target commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          CUSTOM: ${{ steps.resolve.outputs.custom }}
          SKIP_CHECKS: ${{ github.event.inputs.skip_checks }}
          REQUIRED: "node build app-e2e integration proxy-image unit-image"
          OPTIONAL: "proxy proxy-fail2ban .github/workflows/proxy-deploy-e2e.yml"
        run: |
          if [ "$SKIP_CHECKS" = "true" ]; then
            echo "::warning::skip_checks is set - deploying $TARGET_SHA without waiting for CI to pass."
            exit 0
          fi

          # Same bounds as the image wait: the dispatched commit's CI may
          # still be running, a chosen older commit's should already be done.
          if [ "$CUSTOM" = "true" ]; then
            MAX_TRIES=12    # ~2 min
          else
            MAX_TRIES=240   # ~40 min: app-e2e alone may wait 20 min for the image
          fi

          for i in $(seq 1 "$MAX_TRIES"); do
            # Latest attempt of each workflow's push run for this commit, as
            # "name<TAB>status<TAB>conclusion<TAB>html_url". Tolerate an API
            # blip: an empty result just means "not yet" and we poll again.
            RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100" \
              --jq '.workflow_runs | group_by(.name) | map(max_by(.run_attempt)) | .[] | [.name, .status, (.conclusion // ""), .html_url] | @tsv' || true)

            PENDING=""
            for NAME in $REQUIRED $OPTIONAL; do
              ROW=$(printf '%s\n' "$RUNS" | awk -F'\t' -v n="$NAME" '$1 == n')
              if [ -z "$ROW" ]; then
                # Path-filtered workflows may legitimately not have run.
                case " $OPTIONAL " in *" $NAME "*) ;; *) PENDING="$PENDING $NAME" ;; esac
                continue
              fi
              STATUS=$(printf '%s' "$ROW" | cut -f2)
              CONCLUSION=$(printf '%s' "$ROW" | cut -f3)
              URL=$(printf '%s' "$ROW" | cut -f4)
              if [ "$STATUS" != "completed" ]; then
                PENDING="$PENDING $NAME"
              elif [ "$CONCLUSION" != "success" ]; then
                echo "❌ CI workflow '$NAME' concluded '$CONCLUSION' for $TARGET_SHA: $URL"
                echo "   Fix it and re-run, or re-dispatch with skip_checks to deploy anyway (emergencies only)."
                exit 1
              fi
            done

            if [ -z "$PENDING" ]; then
              echo "✅ CI passed for $TARGET_SHA"
              exit 0
            fi
            echo "  waiting for CI:$PENDING ($i/$MAX_TRIES)..."; sleep 10
          done

          echo "❌ CI did not finish for $TARGET_SHA in time (still waiting for:$PENDING)."
          echo "   Re-dispatch once it has passed, or use skip_checks to deploy anyway (emergencies only)."
          exit 1

      - name: Wait for build images to be available
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          CUSTOM: ${{ steps.resolve.outputs.custom }}
        run: |
          IMAGE="${{ env.REGISTRY_URL }}:${TARGET_SHA}"
          AIRLOCK_IMAGE="${{ env.AIRLOCK_REGISTRY_URL }}:${TARGET_SHA}"
          WAIT_INTERVAL=5

          # For the default (dispatched) commit the build workflow may still
          # be running, so wait up to 25 min. For an explicitly chosen commit
          # the image should already exist - build.yml tags only the push-tip
          # github.sha of each master push, so an intermediate or merged-in
          # commit never gets one. Fail fast with a clear reason instead of
          # polling 25 min for a tag that will never appear.
          if [ "$CUSTOM" = "true" ]; then
            MAX_APP_TRIES=24   # ~2 min grace
          else
            MAX_APP_TRIES=300  # ~25 min
          fi

          # The app image is required.
          echo "Waiting for app image: $IMAGE (up to $((MAX_APP_TRIES * WAIT_INTERVAL / 60)) min)"
          for i in $(seq 1 "$MAX_APP_TRIES"); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "✅ App image found: $IMAGE"
              break
            fi
            if [ "$i" -eq "$MAX_APP_TRIES" ]; then
              echo "❌ App image not found: $IMAGE"
              if [ "$CUSTOM" = "true" ]; then
                echo "   build.yml only publishes an image for the tip commit of each master push."
                echo "   Pick a commit that was a push tip on master (not an intermediate or merge parent)."
              fi
              exit 1
            fi
            echo "  not ready yet ($i/$MAX_APP_TRIES)..."; sleep $WAIT_INTERVAL
          done

          # The airlock image is best-effort. build-airlock runs in parallel
          # with the app build and is usually a little slower (Alpine +
          # Chromium + the verify step), so give it a bounded grace window
          # once the app image is up - but do NOT let it block the deploy:
          # the unit deploy (proxy/deploy/common.sh) falls back to the airlock
          # image already running when there is none for this commit, and an
          # airlock build failure must not be able to hold up an app hotfix.
          echo "Waiting (best-effort) for airlock image: $AIRLOCK_IMAGE"
          AIRLOCK_AVAILABLE=false
          for i in $(seq 1 60); do   # up to 5 min
            if docker manifest inspect "$AIRLOCK_IMAGE" > /dev/null 2>&1; then
              echo "✅ Airlock image found: $AIRLOCK_IMAGE"
              AIRLOCK_AVAILABLE=true
              break
            fi
            echo "  not ready yet ($i/60)..."; sleep $WAIT_INTERVAL
          done

          if [ "$AIRLOCK_AVAILABLE" = false ]; then
            echo "::warning::Airlock image $AIRLOCK_IMAGE not available after the grace period - the deploy will run and keep the airlock images the units already have (ensure_airlock in proxy/deploy/common.sh). Re-deploy this commit once build-airlock succeeds."
          fi

      - name: Deploy
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          # Skip branch check since we're in CI and may be checking out a specific commit
          SKIP_BRANCH_CHECK: true
          # units.sh waits for the image: 25 min for the dispatched commit,
          # 2 for a chosen one (as the wait above)
          UNIT_IMAGE_WAIT: ${{ steps.resolve.outputs.custom == 'true' && '120' || '1500' }}
        run: |
          set -o pipefail
          scripts/deploy/units.sh "$TARGET_SHA" 2>&1 | tee deploy.log
          echo "### Deployed \`${TARGET_SHA}\` 🚀" >> "$GITHUB_STEP_SUMMARY"

      # A failed swap whose old container would not come back keeps the new
      # one running and says so; make that visible on the run page.
      - name: Surface a rollback warning
        if: failure()
        run: |
          if [ -f deploy.log ] && grep -q 'WARNING:' deploy.log; then
            echo "::error::$(grep 'WARNING:' deploy.log | tail -1)"
          fi
