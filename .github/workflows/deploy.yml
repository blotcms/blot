name: Deploy to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_URL: ghcr.io/davidmerfield/blot
  AIRLOCK_REGISTRY_URL: ghcr.io/davidmerfield/blot-airlock
  BLOT_DEPLOY_SSH_HOST: ${{ secrets.BLOT_DEPLOY_SSH_HOST }}

jobs:
  wait-for-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "❌ Error: This workflow can only be run on the master branch."
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Branch check passed: running on master branch"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for build images to be available
        run: |
          IMAGE="${{ env.REGISTRY_URL }}:${{ github.sha }}"
          AIRLOCK_IMAGE="${{ env.AIRLOCK_REGISTRY_URL }}:${{ github.sha }}"
          WAIT_INTERVAL=10

          # The app image is required.
          echo "Waiting for app image: $IMAGE"
          for i in $(seq 1 150); do   # up to 25 min
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "✅ App image found: $IMAGE"
              break
            fi
            if [ "$i" -eq 150 ]; then
              echo "❌ Timeout: app image not found after 25 minutes: $IMAGE"
              exit 1
            fi
            echo "  not ready yet ($i/150)..."; sleep $WAIT_INTERVAL
          done

          # The airlock image is best-effort. build-airlock runs in parallel
          # with the app build and is usually a little slower (Alpine +
          # Chromium + the verify step), so give it a bounded grace window
          # once the app image is up - but do NOT let it block the deploy:
          # deployAirlockIfNeeded() in scripts/deploy already skips a missing
          # airlock manifest non-fatally, and an airlock build failure must
          # not be able to hold up an app hotfix.
          echo "Waiting (best-effort) for airlock image: $AIRLOCK_IMAGE"
          for i in $(seq 1 30); do   # up to 5 min
            if docker manifest inspect "$AIRLOCK_IMAGE" > /dev/null 2>&1; then
              echo "✅ Airlock image found: $AIRLOCK_IMAGE"
              exit 0
            fi
            echo "  not ready yet ($i/30)..."; sleep $WAIT_INTERVAL
          done

          echo "::warning::Airlock image $AIRLOCK_IMAGE not available after the grace period - the deploy will run, but scripts/deploy will skip the airlock update for this commit (see deployAirlockIfNeeded). Re-deploy this commit once build-airlock succeeds."

  deploy:
    needs: wait-for-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deploy
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOT_DEPLOY_SSH_KEY }}

      - name: Configure SSH alias
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host blot
            HostName ${BLOT_DEPLOY_SSH_HOST}
            User deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH connection
        run: ssh blot "echo 'SSH connection successful'"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Deploy via npm script
        run: npm run deploy-node -- ${{ github.sha }}
        env:
          # Skip branch check since we're in CI and may be checking out a specific commit
          SKIP_BRANCH_CHECK: true

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Deployment completed successfully! 🚀"

