# Builds the unit image (Dockerfile target `unit`: the app, OpenResty and the
# proxy's files in one container, #2119) and publishes it to GHCR as
# ghcr.io/<owner>/blot:<commit sha> (the name the Node-only image used before), after boot-testing it with
# proxy/unit/smoke.sh. The Deploy workflow deploys it (scripts/deploy/units.sh).
#
# Its own workflow because it needs two images that other workflows build: it
# takes OpenResty from the proxy image for the same commit (proxy-image.yml)
# instead of compiling it again, and builds the app on the layers build.yml
# cached. It waits for the proxy image, so its pull request paths are
# proxy-image.yml's (plus its own, which proxy-image.yml also lists): a change
# elsewhere only builds the unit on master, where proxy-image.yml always runs.
# arm64 only, as the other images (production is Graviton).
name: unit-image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/unit-image.yml"
      - "proxy/**"
      - "Dockerfile"
      - "scripts/security/check-base-image.js"
      - "package.json"
      - "app/config.js"
      - "config/index.js"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blot
  PROXY_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blot-proxy
  APP_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blot

# Superseded PR pushes are cancelled; each master push keeps its own run
concurrency:
  group: unit-image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-24.04-arm
    # A fork PR's proxy-image.yml can't push the proxy image this builds on
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # As build.yml: the docs site reads each template's latest commit
          # time, recorded below, because the image is built without .git
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Record template commit times
        run: node app/documentation/build/latest-commits.js

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # proxy-image.yml pushes this commit's proxy image once it has built it,
      # and this workflow doesn't wait for that job, so poll for it.
      - name: Wait for the proxy image
        run: |
          IMAGE="$PROXY_IMAGE_NAME:${{ github.sha }}-arm64"
          for i in $(seq 1 240); do
            docker manifest inspect "$IMAGE" > /dev/null 2>&1 && exit 0
            [ "$i" = 1 ] && echo "Waiting for proxy-image.yml to push $IMAGE"
            sleep 5
          done
          echo "::error::$IMAGE was not pushed within 20 minutes; did the proxy-image workflow fail?"
          exit 1

      - name: Build and push the unit image
        uses: Wandalen/wretry.action@v3
        with:
          action: docker/build-push-action@v6
          attempt_limit: 2
          attempt_delay: 10000
          with: |
            context: .
            target: unit
            platforms: linux/arm64
            push: true
            build-args: PROXY_IMAGE=${{ env.PROXY_IMAGE_NAME }}:${{ github.sha }}-arm64
            tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
            cache-from: type=registry,ref=${{ env.APP_IMAGE_NAME }}:cache-arm64

      - uses: ./.github/actions/start-minio

      - name: Start Redis
        run: |
          docker run -d --name redis --network host redis:6.2.12-alpine
          for i in $(seq 1 30); do
            docker exec redis redis-cli ping > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Redis did not become ready"
          exit 1

      - name: Create the storage bucket
        run: aws --endpoint-url "$BLOT_STORAGE_ENDPOINT" s3 mb "s3://$BLOT_STORAGE_BUCKET"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.BLOT_AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BLOT_AWS_SECRET }}
          AWS_DEFAULT_REGION: ${{ env.BLOT_STORAGE_REGION }}

      - name: Boot the unit image
        run: proxy/unit/smoke.sh "$IMAGE_NAME:${{ github.sha }}-arm64"

      - name: Unit logs
        if: always()
        run: docker logs --tail 300 blot-unit-smoke || true

      - name: Publish the manifest list
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            "$IMAGE_NAME:${{ github.sha }}-arm64"
