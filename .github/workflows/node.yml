# Unit tests, run against the Dockerfile's `dev` image with the working tree
# bind mounted, so the image only changes when dependencies or system packages
# do. The lint job builds and pushes that image (tagged by a hash of what it is
# built from, scripts/tests/ci/image-tag.sh) only when it doesn't exist yet.
#
# The test jobs don't wait for the lint job: the matrix is just the job
# numbers, and every job works out its own share of the spec files
# (scripts/tests/ci/plan.js) and pulls the image, waiting for it only on the
# rare run that has to build it.
name: node

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read  # To check out code
  packages: write # To push to GitHub Container Registry

# Superseded PR pushes are cancelled; master runs each get their own group.
concurrency:
  group: node-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The test suites - single source of truth. Each runs in its own test runner
  # processes (scripts/tests), never mixed with another suite's files.
  #
  # Format is "<path>[|<exclude>,<exclude>...]". An optional "|"-separated
  # exclude list carves a sub-tree out into its own entry (e.g.
  # app/clients/git runs separately from the rest of app/clients).
  #
  # scripts/tests/ci/plan.js splits the suites' spec files between the test
  # jobs (the `runner` list below) and TEST_LANES lanes per job, run in
  # parallel (scripts/tests/ci/run-lanes.sh), balanced by the seconds in
  # scripts/tests/ci/timings.json. Refresh that from a run's test-timings
  # artifact when the lanes drift apart (scripts/tests/ci/README).
  TEST_LANES: 3
  TEST_SUITES: |
    - app/blog
    - app/build
    - app/clients|app/clients/git
    - app/clients/git
    - app/dashboard
    - app/documentation
    - app/helper
    - app/models|app/models/entry
    - app/models/entry
    - app/scheduler
    - app/site
    - app/storage
    - app/sync
    - app/templates
    - config/redis
    - proxy
    - scripts/deploy

jobs:
  # Static checks, folded into one job so they share a runner and checkout.
  lint:
    runs-on: ubuntu-24.04-arm
    # Every file with describe()/it() must sit in a <suite>/tests/ directory
    # (or be named tests.js) so the runner picks it up. The only exception is
    # scripts/benchmarks/spec/build-render.spec.js: it is a Jasmine spec run
    # by its own workflow (benchmarks.yml), never by the unit-test matrix.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      # Builds and pushes the test image when nothing has pushed it yet, i.e.
      # when Dockerfile, .dockerignore or package.json changed. (Here rather
      # than in a job of its own: it's a few seconds when the image exists.
      # The test jobs don't wait for this job, only for the image.)
      - name: Set image tag
        id: image-tag
        run: echo "image_tag=$(bash scripts/tests/ci/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check-image
        run: |
          IMAGE_TAG="${{ steps.image-tag.outputs.image_tag }}"
          if docker manifest inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            echo "Image $IMAGE_TAG exists, skipping build"
            echo "image_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Image $IMAGE_TAG does not exist, will build it"
            echo "image_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.image_exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        if: steps.check-image.outputs.image_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          target: dev
          context: .
          # Push zstd-compressed layers instead of gzip. Every test job pays a
          # fresh image pull; zstd decompresses
          # several times faster than gzip (and packs a little smaller), which
          # is the bulk of that per-job overhead. force-compression re-encodes
          # layers restored from the gzip build cache. Needs a runner Docker
          # >= 23 to pull, which GitHub-hosted ubuntu images satisfy.
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/blot:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/blot:buildcache-arm64,mode=max
          tags: |
            ${{ steps.image-tag.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/blot:test-latest

      - name: Find unused dependencies
        if: always()
        # node-addon-api,node-gyp are required to build sharp
        run: npx depcheck --ignores=node-addon-api,node-gyp,depcheck,nyc,nodemon,blessed-contrib,fontkit,text-to-svg --skip-missing

      - name: Find unused files
        if: always()
        run: npx knip --config scripts/development/knip.json --files

      - name: List test suites
        if: always()
        run: node scripts/tests/ci/plan.js --suites | jq -r '.[]' | tee matrix_suites.txt

      - name: Find all spec files
        if: always()
        run: |
          # First find files containing "describe("
          echo "Finding all potential spec files..."
          DESCRIBE_FILES=$(grep -r --include="*.js" -l "describe(" . | 
                        grep -v "node_modules" || true)
          
          echo "Files with describe():"
          echo "$DESCRIBE_FILES"
          
          # Then among those, find files also containing "it("
          if [ -n "$DESCRIBE_FILES" ]; then
            echo "Filtering for files with both describe() and it()..."
            SPEC_FILES=$(echo "$DESCRIBE_FILES" | xargs grep -l "it(" || true)
          else
            SPEC_FILES=""
          fi

          # scripts/benchmarks/spec is a benchmark spec run by benchmarks.yml,
          # not the unit-test matrix - exclude it from this check.
          SPEC_FILES=$(echo "$SPEC_FILES" | grep -v "scripts/benchmarks/spec/" || true)

          echo "Files with both describe() and it():"
          echo "$SPEC_FILES"

          # Save the list to a file for further processing
          echo "$SPEC_FILES" > all_spec_files.txt

      - name: Check if all specs are executed by test matrix
        if: always()
        run: |
          if [ ! -s all_spec_files.txt ]; then
            echo "No spec files found or all have been filtered out. Nothing to check."
            exit 0
          fi
          
          # Create a regex pattern from the matrix suites for RUNNABLE test files
          # This matches files in /tests/ directories or named tests.js within the matrix suites
          PATTERN=""
          while read -r suite; do
            if [ -n "$suite" ]; then
              # Only match files in /tests/ directories or named tests.js within each suite
              PATTERN="${PATTERN}|^\./${suite}/.*/tests/.*\.js|^\./${suite}/.*tests\.js|^\./${suite}/tests/.*\.js"
            fi
          done < matrix_suites.txt
          
          if [ -z "$PATTERN" ]; then
            echo "No test suites defined in matrix. Cannot perform check."
            exit 1
          fi
          
          PATTERN="${PATTERN:1}" # Remove the leading |
          echo "Test execution pattern: $PATTERN"
          
          # Find spec files not matching the execution pattern
          echo "Checking for spec files not executed by any test suite in the matrix..."
          UNEXECUTED_SPECS=$(grep -v -E "$PATTERN" all_spec_files.txt || true)
          
          if [ -n "$UNEXECUTED_SPECS" ]; then
            echo "WARNING: Found spec files that contain tests but won't be executed by the test runner:"
            echo "$UNEXECUTED_SPECS"
            echo ""
            echo "These files contain describe() and it() blocks but aren't in a /tests/ directory or named tests.js,"
            echo "so they won't be picked up by the test runner within their respective test suites."
            echo ""
            echo "Please either move them into a <suite>/tests/ directory, rename"
            echo "them to tests.js, or add their suite to TEST_SUITES in node.yml"
            echo "so the runner executes them."
            exit 1
          else
            echo "All spec files are properly located to be executed by the test runner. Good job!"
          fi
                
  test:
    name: test ${{ matrix.runner }}
    runs-on: ubuntu-24.04-arm
    # run-lanes.sh caps each test process at 12 minutes; this is the backstop,
    # with room to wait for the lint job to build the image.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # One entry per test job. plan.js reads the count from
        # strategy.job-total, so adding or removing one is all it takes.
        runner: [1, 2, 3, 4]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Start the image pull (the slowest step) before the checkout, so the
      # two overlap.
      - name: Start pulling images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The four files that name the image, fetched from the API rather
          # than checked out, so this needn't wait for (or narrow) a checkout
          SRC="$RUNNER_TEMP/image-tag"
          mkdir -p "$SRC/scripts/tests/ci"
          for f in Dockerfile .dockerignore package.json scripts/tests/ci/image-tag.sh; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GITHUB_REPOSITORY/contents/$f?ref=$GITHUB_SHA" > "$SRC/$f"
          done
          IMAGE_TAG=$(bash "$SRC/scripts/tests/ci/image-tag.sh")
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          nohup bash -c '
            # On a run that changes dependencies the lint job is still
            # building the image; wait for it to be pushed.
            for i in $(seq 1 180); do
              docker manifest inspect "$0" > /dev/null 2>&1 && break
              [ "$i" = 1 ] && echo "Waiting for the lint job to push $0"
              sleep 10
            done
            docker pull -q "$0" &
            docker pull -q redis:6.2.12 &
            docker pull -q alpine/minio:RELEASE.2025-10-15T17-29-55Z@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4 &
            wait
            echo $? > "$1/pull.done"
          ' "$IMAGE_TAG" "$RUNNER_TEMP" > "$RUNNER_TEMP/pull.log" 2>&1 &

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Plan
        run: |
          node scripts/tests/ci/plan.js --runners=${{ strategy.job-total }} --lanes="$TEST_LANES" --check
          LANES=$(node scripts/tests/ci/plan.js --runners=${{ strategy.job-total }} --lanes="$TEST_LANES" --runner=${{ matrix.runner }})
          echo "LANES=$LANES" >> "$GITHUB_ENV"
          node scripts/tests/ci/plan.js --runners=${{ strategy.job-total }} --lanes="$TEST_LANES" | awk '/^runner ${{ matrix.runner }} /{p=1;print;next} /^runner /{p=0} p'

      - name: Wait for images
        run: |
          until [ -f "$RUNNER_TEMP/pull.done" ]; do sleep 1; done
          cat "$RUNNER_TEMP/pull.log"
          docker image inspect "$IMAGE_TAG" > /dev/null

      - name: Run tests
        env:
          BLOT_STRIPE_KEY: ${{ secrets.BLOT_STRIPE_KEY }}
          BLOT_STRIPE_SECRET: ${{ secrets.BLOT_STRIPE_SECRET }}
          BLOT_STRIPE_PRODUCT: ${{ secrets.BLOT_STRIPE_PRODUCT }}
          RUNNER_INDEX: ${{ matrix.runner }}
          # Coverage is only collected on master; it slows the specs down
          COVERAGE: ${{ github.event_name == 'push' && '1' || '' }}
        run: bash scripts/tests/ci/run-lanes.sh

      - name: Upload coverage
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.runner }}
          path: .nyc_output
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          # A re-run of this job (e.g. after a flaky failure) reuses the same
          # workflow run, so without this the previous attempt's artifact of
          # the same name sticks around too. node-ok then downloads
          # both copies into one folder and nyc chokes on the stale/partial
          # one. Overwriting keeps only the latest attempt's coverage.
          overwrite: true

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.runner }}
          path: .test-timings
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # One stable check name for branch protection: the test matrix is named
  # "test N" and N changes with the lane plan, so it can't be listed as a
  # required check. The last step passes only if every job it needs succeeded.
  #
  # On master it first merges the coverage and timings the test jobs uploaded
  # (pull requests run without coverage, and get no report, so every step
  # until the last is skipped there). It runs even when a test job failed, as
  # the coverage job did, and a coverage failure fails the run, as it did; the
  # check on a master commit is red then too, which nothing reads.
  node-ok:
    name: node ok
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write # to read/write the coverage-baseline cache
      pull-requests: write # to post/update the sticky PR comment
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # nyc only needs the sources it reports on (for the HTML report) and the
      # comment script, so skip the ~300MB of templates, images and fixtures
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /package.json
            /app/**/*.js
            /scripts/coverage/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Download coverage from every job
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-raw

      - name: Download timings from every job
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: timings-*
          path: timings-raw

      # Every spec file's seconds from this run, as one JSON object: the
      # input for refreshing scripts/tests/ci/timings.json
      - name: Merge timings
        if: github.event_name == 'push'
        run: |
          mkdir -p test-timings
          jq -S -s 'add // {} | with_entries(.value |= (. * 10 | round / 10))' timings-raw/*/*.json > test-timings/timings.json || echo '{}' > test-timings/timings.json
          echo "$(jq length test-timings/timings.json) spec files timed"

      - name: Upload merged timings
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: test-timings
          path: test-timings
          overwrite: true

      # Master's most recent line-coverage % (if any), so a PR run can show a
      # delta. Keyed by run so every push to master adds a fresh entry;
      # restore-keys picks up the most recent one.
      - name: Restore coverage baseline
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: .coverage/history
          key: coverage-master-${{ github.run_id }}
          restore-keys: |
            coverage-master-

      - name: Merge coverage and build report
        id: merge-coverage
        if: github.event_name == 'push'
        run: |
          mkdir -p .nyc_output coverage

          # Each job's raw coverage json files are the direct children of
          # coverage-raw/<artifact-name>/ - flatten them into one directory so
          # `nyc report` can treat it as a single temp dir. Filenames are
          # content-addressed UUIDs, so collisions across jobs aren't a concern.
          find coverage-raw -mindepth 2 -maxdepth 2 -type f -name '*.json' \
            -exec cp {} .nyc_output/ \;

          echo "Merging $(ls .nyc_output | wc -l) raw coverage files from $(ls coverage-raw | wc -l) jobs"

          # The coverage was recorded in the test containers, where the
          # checkout is /usr/src/app; point that at this checkout so the
          # report finds the sources.
          sudo mkdir -p /usr/src
          sudo ln -sfn "$GITHUB_WORKSPACE" /usr/src/app
          cd /usr/src/app

          # Same nyc as package.json
          NYC_VERSION=$(jq -r '.devDependencies.nyc // .dependencies.nyc' "$GITHUB_WORKSPACE/package.json" 2>/dev/null || true)
          NYC_ARGS="--include=app/**/*.js --exclude=**/tests/** --exclude=**/tests.js --exclude=app/views-built/** --exclude=app/templates/source/**"
          set -o pipefail
          npx --yes "nyc@${NYC_VERSION:-17.1.0}" report -t .nyc_output $NYC_ARGS \
            --reporter=text --reporter=text-summary --reporter=lcov --reporter=json-summary -o coverage \
            | tee coverage/text-report.txt

      - name: Add coverage summary to job summary
        if: steps.merge-coverage.outcome == 'success'
        run: |
          echo "## Code coverage - \`${{ env.HEAD_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 coverage/text-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage report
        id: upload-report
        if: steps.merge-coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          # Deliberately NOT prefixed "coverage-" - the "Download coverage
          # from every shard" step above matches that prefix, and on a rerun
          # within the same workflow run (e.g. re-running just one flaky test
          # job) a prior successful attempt's merged report would otherwise
          # get swept back in as if it were a raw per-shard coverage file,
          # which crashes nyc ("Invalid file coverage object, missing keys")
          # since a coverage-summary.json isn't shaped like raw nyc output.
          name: merged-coverage-report-${{ github.sha }}
          path: coverage
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      # master: record this run's line coverage % as the new baseline for
      # future PRs to diff against.
      - name: Save coverage baseline
        if: steps.merge-coverage.outcome == 'success' && github.event_name == 'push'
        run: |
          mkdir -p .coverage/history
          node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            fs.writeFileSync(
              '.coverage/history/latest.json',
              JSON.stringify({ sha: process.env.HEAD_SHA, linesPct: s.total.lines.pct })
            );
          "

      - name: Save coverage baseline cache
        if: steps.merge-coverage.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .coverage/history
          key: coverage-master-${{ github.run_id }}

      # pull_request: post/update the sticky coverage comment.
      - name: Post PR coverage comment
        if: always() && github.event_name == 'pull_request' && steps.merge-coverage.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/coverage/pr-comment.js \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "$HEAD_SHA" \
            --status done \
            --summary coverage/coverage-summary.json \
            --baseline .coverage/history/latest.json \
            --artifact-url "${{ steps.upload-report.outputs.artifact-url }}"

      - name: Post PR coverage comment (failed)
        if: always() && github.event_name == 'pull_request' && steps.merge-coverage.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/coverage/pr-comment.js \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "$HEAD_SHA" \
            --status failed

      # Always last and always run: a failed, skipped or cancelled needed job
      # fails the check, whatever the coverage steps did.
      - name: Require every job to have succeeded
        if: always()
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "❌ A required job did not succeed"; exit 1; }
          done
