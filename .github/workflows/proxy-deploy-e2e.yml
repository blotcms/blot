# Runs the REAL proxy/deploy/blue-green.sh against real Docker: real Redis, a
# stub upstream, and stand-in units (the proxy image plus a stub in place of the
# app, proxy/deploy/e2e/unit; see proxy/deploy/e2e/README.md).
#
# unit-deploy-e2e: a fresh start with nothing running, a re-run that changes
# nothing, a deploy replacing blot-blue then blot-green under load with no
# failed request, and the failures a deploy must roll back from (a new unit
# that never becomes healthy, failed site checks, an unhealthy other unit).
#
# unit-swap-load-e2e: one unit image deployed over another (and back, and again,
# and the same one twice) under a load generator that checks every response
# against the stub upstream, then a deploy that fails halfway
# (proxy/deploy/e2e/swap-load.sh). Every deploy is rehearsed this way.
#
# proxy/deploy/tests/run.sh (which this workflow does not replace) covers the
# script's order-of-operations against fake docker/systemctl/curl and is much
# faster; this workflow instead proves the script works against the real
# things. Recommended item under blotcms/blot#1941.
#
# No `branches: [master]` filter on the pull_request trigger: this workflow
# is meant to run on a PR based on another feature branch (a stacked PR), not
# only ones based on master. The push trigger IS filtered to master, so a
# push to a branch with an open (possibly stacked) PR doesn't fire this
# ~30-minute real-Docker/systemd job twice for the same commit.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/proxy-deploy-e2e.yml"
      - "proxy/**"
      - "config/host/**"
      - "scripts/deploy/constants.js"
      - "scripts/deploy/unit-settings.js"
      - "package.json"
      - "app/config.js"
      - "config/index.js"
  pull_request:
    paths:
      - ".github/workflows/proxy-deploy-e2e.yml"
      - "proxy/**"
      - "config/host/**"
      - "scripts/deploy/constants.js"
      - "scripts/deploy/unit-settings.js"
      - "package.json"
      - "app/config.js"
      - "config/index.js"
  workflow_dispatch:

jobs:
  # The stand-in unit is the real proxy image plus a stub in place of the app
  # (proxy/deploy/e2e/unit): building and booting the real unit image is
  # unit-image.yml's job (proxy/unit/smoke.sh), and it is not available to this
  # workflow in time. So what this does not cover is the app itself: the real
  # verify-container checks, the real airlock (its egress filter and Chromium),
  # node-a and node-b starting from the real image, and the memory limit holding
  # the real heaps. The "unit" images are in different repositories because
  # blue-green.sh removes the other tags of the repository it deploys.
  unit-deploy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOT_HOST: blot.im
      # The host the generated config's virtual hosts are built for
      # (proxy/build/build.sh) and the harness's certificate is issued to.
      PROXY_CANARY_HOST: preview-of-wireframe-on-david.blot.im
      PROXY_AUTOSSL_VOLUME: blot-e2e-auto-ssl
      PROXY_SKIP_CERT_SWEEP: "1" # no Pebble/lua-resty-auto-ssl storage in this harness - see README.md
      PROXY_HEALTH_TIMEOUT: "40"
      PROXY_AIRLOCK_IMAGE: blot-airlock-stub:e2e
      PROXY_IMAGE: blot-proxy:e2e
      UNIT_A: a.test/blot-unit:e2e
      UNIT_B: b.test/blot-unit:e2e
      UNIT_BROKEN: c.test/blot-unit:e2e
    steps:
      - uses: actions/checkout@v4

      # Before any listener exists: the kernel reads the setting when a reuseport
      # group is created (the first proxy to bind :443), so setting it later, as
      # deploy-under-load.sh does, does not cover a group that already exists. With
      # it, closing a listener hands its queued connections to the other one
      # instead of resetting them (kernel 5.14+).
      - name: Let a closing reuseport listener hand its queued connections over
        run: |
          sudo sysctl -w net.ipv4.tcp_migrate_req=1
          cat /proc/sys/net/ipv4/tcp_migrate_req

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      # The `runner` context (RUNNER_TEMP) isn't available in a job-level
      # `env:` block, only in steps - so these are exported to $GITHUB_ENV
      # here instead, as early as possible, rather than declared statically
      # above. Everything the harness writes lives under RUNNER_TEMP, not the
      # checkout, so there's nothing to .gitignore and nothing left behind
      # for the next job on a reused runner.
      - name: Compute harness paths
        run: |
          E2E_ROOT="$RUNNER_TEMP/proxy-e2e"
          {
            echo "E2E_ROOT=$E2E_ROOT"
            echo "PROXY_ENV_FILE=$E2E_ROOT/proxy.env"
            # A second env file, identical except for an unroutable
            # PROXY_PRIVATE_IP, for the deterministic forced-failure
            # scenarios below (see proxy/deploy/e2e/setup.sh, which writes it).
            echo "PROXY_ENV_FILE_BAD=$E2E_ROOT/proxy-unroutable-private-ip.env"
            echo "PROXY_DISK_CACHE_DIR=$E2E_ROOT/disk-cache"
            echo "PROXY_LOG_DIR=$E2E_ROOT/logs"
            echo "PROXY_CERT_DIR=$E2E_ROOT/certs"
            echo "PROXY_GLOBAL_STATIC_DIR=$E2E_ROOT/global-static"
            echo "PROXY_UNIT_SETTINGS=$E2E_ROOT/unit-settings.env"
            echo "PROXY_SECRETS_ENV_FILE=$E2E_ROOT/secrets.env"
          } >> "$GITHUB_ENV"

      - name: Install config generator dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/gendeps"
          cd "$RUNNER_TEMP/gendeps"
          npm init -y >/dev/null
          npm install --no-audit --no-fund mustache@4.2.0 fs-extra@11.1.0
          echo "NODE_PATH=$RUNNER_TEMP/gendeps/node_modules:${{ github.workspace }}/app" >> "$GITHUB_ENV"

      # The image the stand-in units are built on.
      - name: Generate proxy config
        run: bash proxy/build/build.sh
        env:
          LOG_TO_STDOUT: "false" # the deploy script refuses an image that logs to stdout
          FETCH_CDN_IPS: "false"

      - name: Build the proxy image, the three stand-in units and the stand-in airlock
        run: |
          docker build -f proxy/Dockerfile -t "$PROXY_IMAGE" proxy/
          docker build -f proxy/deploy/e2e/unit/Dockerfile -t "$UNIT_A" proxy/deploy/e2e/unit
          docker build -f proxy/deploy/e2e/unit/Dockerfile --label e2e.variant=b -t "$UNIT_B" proxy/deploy/e2e/unit
          docker build -f proxy/deploy/e2e/unit/Dockerfile --build-arg BREAK=a -t "$UNIT_BROKEN" proxy/deploy/e2e/unit
          docker build -f proxy/deploy/e2e/unit/airlock.Dockerfile -t "$PROXY_AIRLOCK_IMAGE" proxy/deploy/e2e/unit

      - name: Set up the harness (Redis, stub upstream, certs) and the unit's host directories
        run: |
          set -euo pipefail
          bash proxy/deploy/e2e/setup.sh
          bash proxy/deploy/e2e/unit-setup.sh

      # ---- 1. a fresh start: no unit is running ---------------------------------
      # blue-green.sh starts blot-blue and then blot-green with no overlap and
      # makes each permanent only once the site answers 200 with the right
      # certificate.
      - name: blue-green starts both units when none is running
        run: |
          set -euo pipefail
          ! docker ps -a --format '{{.Names}}' | grep -Eq '^blot-(blue|green)'
          bash proxy/deploy/blue-green.sh "$UNIT_A"
          for u in blue green; do
            [ "$(docker inspect -f '{{.Config.Image}}' blot-$u)" = "$UNIT_A" ]
            [ "$(docker inspect -f '{{.State.Running}}' blot-$u)" = true ]
            [ "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' blot-$u)" = unless-stopped ]
            [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' blot-$u)" = host ]
            [ "$(docker inspect -f '{{.HostConfig.Memory}}' blot-$u)" = 4026531840 ]
            [ "$(docker inspect -f '{{len .HostConfig.PortBindings}}' blot-$u)" = 0 ]
            docker exec blot-$u printenv PROXY_UNIT | grep -qx "$u"
            docker exec blot-$u printenv BLOT_UNIT | grep -qx "$u"
            docker exec blot-$u printenv BLOT_SOCKET | grep -qx "/run/blot/$u-a.sock"
            docker exec blot-$u printenv BLOT_WORKER_MAX_OLD_SPACE_SIZE | grep -qx 750
            docker exec blot-$u printenv BLOT_RELEASE_ID | grep -qx e2e
            [ "$(docker inspect -f '{{.State.Running}}' blot-$u-airlock)" = true ]
          done
          # one airlock per unit, each published on loopback at its own ports
          [ "$(docker port blot-blue-airlock 9222/tcp)" = 127.0.0.1:19222 ]
          [ "$(docker port blot-green-airlock 9222/tcp)" = 127.0.0.1:19223 ]
          [ "$(docker port blot-blue-airlock 8888/tcp)" = 127.0.0.1:18888 ]
          [ "$(docker port blot-green-airlock 8888/tcp)" = 127.0.0.1:18889 ]
          docker exec blot-blue printenv BLOT_AIRLOCK_BROWSER_URL | grep -qx http://127.0.0.1:19222
          docker exec blot-green printenv BLOT_AIRLOCK_PROXY_URL | grep -qx http://127.0.0.1:18889
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-to "$BLOT_HOST:443:127.0.0.1:443" "https://$BLOT_HOST/")
          [ "$code" = 200 ]
          # a fresh start empties the cache directory (the
          # files are deleted in the background, so only the top level is checked)
          [ ! -e "$PROXY_DISK_CACHE_DIR/warm-1" ]

      # ---- 2. a re-run with the image both units run: a no-op ------------------
      - name: A re-run leaves both units and their airlocks alone
        run: |
          set -euo pipefail
          before=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' blot-blue blot-green blot-blue-airlock blot-green-airlock)
          bash proxy/deploy/blue-green.sh "$UNIT_A" | tee rerun.log
          grep -q "nothing to do" rerun.log
          [ "$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' blot-blue blot-green blot-blue-airlock blot-green-airlock)" = "$before" ]

      # ---- 3. a steady deploy replaces blue, then green ------------------------
      # UNIT_B is a different image, so both units are replaced, one at a time
      # while the other carries the traffic: no request may fail.
      - name: A steady deploy replaces blot-blue then blot-green with zero failed requests
        run: |
          set -euo pipefail
          blue=$(docker inspect -f '{{.Id}}' blot-blue); green=$(docker inspect -f '{{.Id}}' blot-green)
          bash proxy/deploy/e2e/deploy-under-load.sh "$UNIT_B"
          [ "$(docker inspect -f '{{.Id}}' blot-blue)" != "$blue" ]
          [ "$(docker inspect -f '{{.Id}}' blot-green)" != "$green" ]
          for u in blue green; do
            [ "$(docker inspect -f '{{.Config.Image}}' blot-$u)" = "$UNIT_B" ]
            [ "$(docker inspect -f '{{.State.Running}}' blot-$u)" = true ]
            [ "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' blot-$u)" = unless-stopped ]
          done
          # the previous containers are gone, and the name filter is exact
          [ "$(docker ps -a --format '{{.Names}}' | grep -Ec '^blot-(blue|green)(-previous)?$')" = 2 ]

      # ---- 4. a new blue whose node-a never listens -----------------------------
      - name: A new blot-blue whose node-a never becomes healthy is rolled back and blot-green is never touched
        run: |
          set +e
          blue=$(docker inspect -f '{{.Id}}' blot-blue)
          green=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' blot-green)
          bash proxy/deploy/blue-green.sh "$UNIT_BROKEN"
          rc=$?
          set -e
          [ "$rc" -ne 0 ]
          [ "$(docker inspect -f '{{.Id}}' blot-blue)" = "$blue" ]
          [ "$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' blot-green)" = "$green" ]
          for u in blue green; do
            [ "$(docker inspect -f '{{.Config.Image}}' blot-$u)" = "$UNIT_B" ]
            [ "$(docker inspect -f '{{.State.Running}}' blot-$u)" = true ]
          done
          [ "$(docker ps -a --format '{{.Names}}' | grep -Ec '^blot-(blue|green)(-previous)?$')" = 2 ]
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-to "$BLOT_HOST:443:127.0.0.1:443" "https://$BLOT_HOST/")
          [ "$code" = 200 ]

      # ---- 5. a unit whose proxy cannot start is rolled back, the other is untouched
      # Deterministic (no timing/log-line trigger needed): PROXY_ENV_FILE_BAD's
      # PROXY_PRIVATE_IP is 198.51.100.7 (TEST-NET-2, RFC 5737), which no
      # runner interface owns, so the real new container's :8077 listener
      # fails to bind and openresty exits immediately - wait_healthy sees it
      # not running and fails fast. validate_image() runs `openresty -t` with
      # ip_nonlocal_bind, so preflight still passes with this file. Blue is
      # replaced first, so it is blue that fails and green that must not move.
      - name: blue-green rolls blot-blue back and never touches blot-green when the new blot-blue exits
        env:
          PROXY_ENV_FILE: ${{ env.PROXY_ENV_FILE_BAD }}
        run: |
          set +e
          blue=$(docker inspect -f '{{.Id}}' blot-blue)
          green=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' blot-green)
          bash proxy/deploy/blue-green.sh "$UNIT_A"
          rc=$?
          set -e
          [ "$rc" -ne 0 ]
          # the same containers, not recreated: blue came back from -previous
          [ "$(docker inspect -f '{{.Id}}' blot-blue)" = "$blue" ]
          [ "$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' blot-green)" = "$green" ]
          [ "$(docker inspect -f '{{.State.Running}}' blot-blue)" = true ]
          [ "$(docker inspect -f '{{.Config.Image}}' blot-blue)" = "$UNIT_B" ]
          [ "$(docker ps -a --format '{{.Names}}' | grep -Ec '^blot-(blue|green)(-previous)?$')" = 2 ]
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-to "$BLOT_HOST:443:127.0.0.1:443" "https://$BLOT_HOST/")
          [ "$code" = 200 ]

      # ---- 6. failed site checks after blue was replaced roll back ---------------
      # Deterministic: Redis stopped for the whole run. blue-green's preflight
      # only calls redis_reachable() when PROXY_SKIP_CERT_SWEEP is unset (it's
      # set here), so stopping Redis doesn't affect preflight or the new unit's
      # health (its health socket doesn't need Redis either) - only the
      # live_checks() after blot-blue was replaced, which calls
      # redis_reachable(), fails, no timing required at all.
      - name: blue-green puts blot-blue back when the checks after replacing it fail
        run: |
          set +e
          blue=$(docker inspect -f '{{.Id}}' blot-blue); green=$(docker inspect -f '{{.Id}}' blot-green)
          docker stop blot-e2e-redis >/dev/null
          bash proxy/deploy/blue-green.sh "$UNIT_A"
          rc=$?
          docker start blot-e2e-redis >/dev/null
          set -e
          for i in $(seq 1 30); do timeout 2 bash -c "</dev/tcp/127.0.0.1/6379" 2>/dev/null && break; sleep 1; done
          [ "$rc" -ne 0 ]
          [ "$(docker inspect -f '{{.Id}}' blot-blue)" = "$blue" ]
          [ "$(docker inspect -f '{{.Id}}' blot-green)" = "$green" ]
          [ "$(docker inspect -f '{{.State.Running}}' blot-blue)" = true ]
          [ "$(docker inspect -f '{{.Config.Image}}' blot-blue)" = "$UNIT_B" ]
          [ "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' blot-blue)" = unless-stopped ]
          [ "$(docker ps -a --format '{{.Names}}' | grep -Ec '^blot-(blue|green)(-previous)?$')" = 2 ]
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-to "$BLOT_HOST:443:127.0.0.1:443" "https://$BLOT_HOST/")
          [ "$code" = 200 ]

      # ---- 7. blot-blue is not stopped while blot-green is unhealthy -------------
      # The health socket is removed from blot-green: it still serves (nginx
      # keeps its listening socket) but no longer answers its health check.
      - name: blue-green refuses to stop blot-blue while blot-green is unhealthy
        run: |
          set +e
          blue=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' blot-blue)
          docker exec -u 0 blot-green rm -f /run/openresty/health.sock
          bash proxy/deploy/blue-green.sh "$UNIT_A" 2>&1 | tee refuse.log
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -ne 0 ]
          grep -q "refusing to stop blot-blue" refuse.log
          [ "$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' blot-blue)" = "$blue" ]
          [ "$(docker ps -a --format '{{.Names}}' | grep -Ec '^blot-(blue|green)(-previous)?$')" = 2 ]
          # what the operator does (and the health cron does within a minute)
          docker restart --time 40 blot-green >/dev/null
          for i in $(seq 1 60); do docker exec blot-green curl -fsS -o /dev/null --unix-socket /run/openresty/health.sock http://localhost/health && break; sleep 1; done
          bash proxy/deploy/blue-green.sh "$UNIT_A"
          for u in blue green; do [ "$(docker inspect -f '{{.Config.Image}}' blot-$u)" = "$UNIT_A" ]; done

      # ---- 8. forced failure on a fresh start: the first unit never becomes
      # healthy and there is no other to fall back to, so the script must
      # leave no unit behind. Same unroutable PROXY_PRIVATE_IP as step 5.
      - name: blue-green removes a first unit that never becomes healthy
        env:
          PROXY_ENV_FILE: ${{ env.PROXY_ENV_FILE_BAD }}
        run: |
          docker rm -f blot-blue blot-green >/dev/null
          set +e
          bash proxy/deploy/blue-green.sh "$UNIT_A"
          rc=$?
          set -e
          [ "$rc" -ne 0 ]
          ! docker ps -a --format '{{.Names}}' | grep -Eq '^blot-(blue|green)(-previous)?$'

      - name: Logs
        if: always()
        run: |
          for c in blot-blue blot-green blot-blue-previous blot-green-previous blot-blue-airlock blot-green-airlock blot-e2e-stub blot-e2e-redis; do
            echo "=== $c ==="; docker logs --tail 100 "$c" 2>&1 || true
          done
          # LOG_TO_STDOUT=false, so `docker logs` above is near-empty for the
          # units - the real access/error logs are these files on
          # $PROXY_LOG_DIR, shared by both units (see run_args() in common.sh).
          echo "=== $PROXY_LOG_DIR/access.log (tail) ==="
          sudo tail -n 100 "$PROXY_LOG_DIR/access.log" 2>&1 || true
          echo "=== $PROXY_LOG_DIR/error.log (tail) ==="
          sudo tail -n 100 "$PROXY_LOG_DIR/error.log" 2>&1 || true

  # blue-green.sh between two unit images, as every deploy does it (see
  # proxy/deploy/e2e/swap-load.sh): A -> B, B -> A (the rollback), A -> B again
  # and B -> A, each replacing blot-blue and then blot-green while a load
  # generator sends cached, uncached, large, Range, POST and event-stream
  # requests and a purge every 500 ms, and checks every response against what
  # the stub upstream would have served; then a deploy that fails after
  # blot-blue was stopped. Any failed, reset or wrong response, or a page older
  # than the last purge, fails the job. A and B are the same build with
  # one extra label, in different repositories (blue-green.sh removes the other
  # tags of the repository it deploys). The stand-in units send their traffic
  # to the stub upstream (E2E_UPSTREAMS_FROM_ENV), not to their own sockets.
  unit-swap-load-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLOT_HOST: blot.im
      PROXY_CANARY_HOST: preview-of-wireframe-on-david.blot.im
      PROXY_AUTOSSL_VOLUME: blot-e2e-auto-ssl
      PROXY_SKIP_CERT_SWEEP: "1" # see proxy/deploy/e2e/README.md
      PROXY_HEALTH_TIMEOUT: "40"
      PROXY_AIRLOCK_IMAGE: blot-airlock-stub:e2e
      E2E_UPSTREAMS_FROM_ENV: "1"
      IMAGE_A: a.test/blot-unit-sl:e2e
      IMAGE_B: b.test/blot-unit-sl:e2e
    steps:
      - uses: actions/checkout@v4

      # Before any listener exists: the kernel reads the setting when a reuseport
      # group is created (the first proxy to bind :443), so setting it later, as
      # deploy-under-load.sh does, does not cover a group that already exists. With
      # it, closing a listener hands its queued connections to the other one
      # instead of resetting them (kernel 5.14+).
      - name: Let a closing reuseport listener hand its queued connections over
        run: |
          sudo sysctl -w net.ipv4.tcp_migrate_req=1
          cat /proc/sys/net/ipv4/tcp_migrate_req

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Compute harness paths
        run: |
          E2E_ROOT="$RUNNER_TEMP/proxy-e2e"
          {
            echo "E2E_ROOT=$E2E_ROOT"
            echo "PROXY_ENV_FILE=$E2E_ROOT/proxy.env"
            echo "PROXY_ENV_FILE_BAD=$E2E_ROOT/proxy-unroutable-private-ip.env"
            echo "PROXY_DISK_CACHE_DIR=$E2E_ROOT/disk-cache"
            echo "PROXY_LOG_DIR=$E2E_ROOT/logs"
            echo "PROXY_CERT_DIR=$E2E_ROOT/certs"
            echo "PROXY_GLOBAL_STATIC_DIR=$E2E_ROOT/global-static"
            echo "PROXY_UNIT_SETTINGS=$E2E_ROOT/unit-settings.env"
            echo "PROXY_SECRETS_ENV_FILE=$E2E_ROOT/secrets.env"
          } >> "$GITHUB_ENV"

      - name: Install config generator dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/gendeps"
          cd "$RUNNER_TEMP/gendeps"
          npm init -y >/dev/null
          npm install --no-audit --no-fund mustache@4.2.0 fs-extra@11.1.0
          echo "GENDEPS_MODULES=$RUNNER_TEMP/gendeps/node_modules" >> "$GITHUB_ENV"

      - name: Build the two stand-in units and the stand-in airlock
        run: |
          bash proxy/deploy/e2e/build-unit-image.sh . "$IMAGE_A"
          bash proxy/deploy/e2e/build-unit-image.sh . "$IMAGE_B" --label e2e.variant=b
          docker build -f proxy/deploy/e2e/unit/airlock.Dockerfile -t "$PROXY_AIRLOCK_IMAGE" proxy/deploy/e2e/unit

      - name: Set up the harness (Redis, stub upstream, certs) and the unit's host directories
        run: |
          set -euo pipefail
          bash proxy/deploy/e2e/setup.sh
          bash proxy/deploy/e2e/unit-setup.sh
        env:
          STUB_JS: ${{ github.workspace }}/proxy/deploy/e2e/swap-load-stub.js

      - name: Deploy under load, back, again, again onto itself, and a deploy that fails
        run: bash proxy/deploy/e2e/swap-load.sh

      - name: Logs
        if: always()
        run: |
          for c in blot-blue blot-green blot-blue-airlock blot-green-airlock blot-e2e-stub blot-e2e-redis; do
            echo "=== $c ==="; docker logs --tail 100 "$c" 2>&1 || true
          done
          echo "=== $PROXY_LOG_DIR/error.log (tail) ==="
          sudo tail -n 100 "$PROXY_LOG_DIR/error.log" 2>&1 || true
          for f in "$E2E_ROOT"/swap-load/*.log "$E2E_ROOT"/swap-load/*.err; do
            echo "=== $f ==="; tail -n 40 "$f" 2>&1 || true
          done
