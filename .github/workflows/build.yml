# The reason this is so complicated is because github actions cache for docker
# build doesn't seem to work as well as it should. Ideally it just caches the
# work it has done before but I couldn't get this to work with much trying.
# So we manually compute the hash of the files which the base docker image layer
# depends upon and use this to tag images. If for some reason at some point
# the github actions docker cache works more efficiently, we can simplyify.

# The goals are:
# - reproducible builds
# - fast tests
# - fast deployments
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blot
  AIRLOCK_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blot-airlock

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Per-arch registry cache. Keeps layers hot on each native runner.
      - name: Build and push (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: ${{ matrix.platform }}          # native, no QEMU
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:cache-${{ matrix.arch }}
          cache-to: |
            type=registry,ref=${{ env.IMAGE_NAME }}:cache-${{ matrix.arch }},mode=max

      - name: Verify health check (${{ matrix.arch }})
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker network create test_network

          redis_container_id=$(docker run -d --name test_redis --network test_network redis:6.2.12)

          timeout=30; interval=2; elapsed=0
          until docker exec "$redis_container_id" redis-cli ping | grep -q PONG; do
            if [ $elapsed -ge $timeout ]; then
              echo "Redis not ready in $timeout s"
              docker logs "$redis_container_id" || true
              exit 1
            fi
            sleep $interval; elapsed=$((elapsed+interval))
          done

          app_id=$(docker run -d --network test_network -e BLOT_REDIS_HOST=test_redis -p 8080:8080 "$IMAGE")

          timeout=60; interval=5; elapsed=0
          until [ "$(docker inspect --format='{{json .State.Health.Status}}' "$app_id")" = '"healthy"' ]; do
            if [ $elapsed -ge $timeout ]; then
              echo "App health check failed"
              docker logs "$app_id" || true
              exit 1
            fi
            sleep $interval; elapsed=$((elapsed+interval))
          done

          docker rm -f "$app_id" "$redis_container_id"
          docker network rm test_network

  manifest:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/blot"
          SHA="${{ github.sha }}"
          docker buildx imagetools create \
            -t "$IMAGE:$SHA" \
            "$IMAGE:$SHA-amd64" \
            "$IMAGE:$SHA-arm64"

          # Optional: tag branch and latest on default branch
          if [ "${{ github.ref_name }}" = "master" ]; then
            docker buildx imagetools create \
              -t "$IMAGE:latest" \
              "$IMAGE:$SHA"
          fi

  # Builds the airlock image (config/airlock) - the egress boundary the
  # deploy script (scripts/deploy) brings up alongside the app containers.
  # See config/airlock/README.md for what it's for. Production routes
  # bookmark-link screenshots and remote-image downloads through it
  # (config.airlock), so a broken image here degrades those; and
  # scripts/deploy/index.js expects a manifest for every commit's SHA to
  # exist, same as the app image.
  build-airlock:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push airlock (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: config/airlock
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.AIRLOCK_IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: |
            type=registry,ref=${{ env.AIRLOCK_IMAGE_NAME }}:cache-${{ matrix.arch }}
          cache-to: |
            type=registry,ref=${{ env.AIRLOCK_IMAGE_NAME }}:cache-${{ matrix.arch }},mode=max

      - name: Verify egress filter (${{ matrix.arch }})
        env:
          IMAGE: ${{ env.AIRLOCK_IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          # A user-defined network, not the default bridge: DNS is Docker's
          # embedded resolver on 127.0.0.11, which the egress filter allows
          # over loopback; the default bridge's resolver is a private
          # address the filter would drop. See config/airlock/README.md.
          docker network create airlock_test_network

          # 169.254.169.254 and 10.0.0.1 have no route at all from a
          # GitHub-hosted runner's network, egress filter or not - curl
          # fails against them regardless of whether egress.nft is loaded,
          # wrong, or missing entirely (verified: a stock, unfiltered
          # alpine container on this same network also can't reach them).
          # Testing against them here would prove nothing. Instead, put a
          # real listener on a THIRD, plain sibling container: its IP is
          # assigned from Docker's default pool, which sits entirely inside
          # 172.16.0.0/12 - the exact range egress.nft blocks - so it is
          # genuinely reachable in this topology unless something is
          # actively filtering it. A second, unfiltered sibling establishes
          # that baseline before the airlock is asked to reach the same
          # target, so a pass here means the filter did something, not
          # that the address was already dead.
          docker run -d --name airlock_test_target --network airlock_test_network \
            alpine:3.20 sh -c 'while true; do nc -l -p 80; done'

          target_ip=$(docker inspect --format='{{(index .NetworkSettings.Networks "airlock_test_network").IPAddress}}' airlock_test_target)
          echo "Target container is at $target_ip"

          docker run -d --name airlock_test_control --network airlock_test_network \
            alpine:3.20 sleep 300

          echo "Sanity check: an unfiltered sibling container CAN reach the target..."
          docker exec airlock_test_control sh -c "nc -z -w3 $target_ip 80"

          # Docker's embedded resolver (127.0.0.11) only proxies DNS - it
          # forwards cache misses to the host's upstream nameservers. On the
          # production cloud host that upstream is the VPC resolver, itself
          # at a private address egress.nft rejects, so a bare "127.0.0.11
          # accept" still leaves every lookup returning SERVFAIL (this is a
          # real incident the probe caught). A GitHub runner's upstream
          # happens to be reachable, so to actually exercise that path here
          # we stand up our own resolver on a sibling container - its IP is
          # from Docker's default pool, entirely inside the 172.16.0.0/12
          # range egress.nft blocks - and point the airlock at it. The
          # forward can only succeed via the `meta skuid 0 udp/tcp dport 53`
          # rules in egress.nft; drop those and this step goes red.
          docker run -d --name airlock_test_dns --network airlock_test_network \
            alpine:3.20 sh -c 'apk add --no-cache dnsmasq >/dev/null && exec dnsmasq -k --no-resolv --server=1.1.1.1 --server=8.8.8.8'
          dns_ip=$(docker inspect --format='{{(index .NetworkSettings.Networks "airlock_test_network").IPAddress}}' airlock_test_dns)
          echo "Sibling resolver (in the blocked range) is at $dns_ip"
          for i in $(seq 1 20); do
            if docker exec airlock_test_control sh -c "nslookup example.com $dns_ip >/dev/null 2>&1"; then break; fi
            [ "$i" = 20 ] && { echo "sibling resolver never came up"; docker logs airlock_test_dns || true; exit 1; }
            sleep 1
          done

          airlock_id=$(docker run -d --network airlock_test_network --cap-add=NET_ADMIN --dns "$dns_ip" "$IMAGE")

          timeout=30; interval=2; elapsed=0
          until [ "$(docker inspect --format='{{json .State.Health.Status}}' "$airlock_id")" = '"healthy"' ]; do
            if [ $elapsed -ge $timeout ]; then
              echo "Airlock health check failed"
              docker logs "$airlock_id" || true
              exit 1
            fi
            sleep $interval; elapsed=$((elapsed+interval))
          done

          echo "Checking the airlock CANNOT reach that same, genuinely-reachable target..."
          if docker exec "$airlock_id" sh -c "curl -fsS -m3 http://$target_ip/"; then
            echo "FAIL: a private IP a sibling container can reach was reachable from inside the airlock"
            exit 1
          fi

          # -f, not just -sS: a rejected connection isn't the only way this
          # can fail. tinyproxy answers with its OWN valid HTTP response
          # (e.g. "500 Unable to connect") when it can't reach an upstream,
          # and curl without -f treats any completed HTTP response as
          # success regardless of status - so a plain -sS check here would
          # falsely PASS a broken filter that let tinyproxy's own error page
          # through, and would misreport a working `reject`-style rule (an
          # immediate refusal, answered fast enough for tinyproxy to relay
          # its error page inside curl's own timeout) as "reachable". -f
          # treats that error page as the failure it represents.
          echo "Checking the airlock's own DevTools endpoint is unreachable through its proxy..."
          if docker exec "$airlock_id" sh -c 'curl -fsS -m3 -x http://127.0.0.1:8888 http://127.0.0.1:9221/json/version'; then
            echo "FAIL: loopback was reachable through the proxy"
            exit 1
          fi

          # These also confirm DNS works: the airlock's only resolver is the
          # sibling at $dns_ip, in a range egress.nft blocks, so a resolved
          # name proves the uid-0 :53 forward rules are in place.
          echo "Checking the public internet is reachable, direct and via the proxy..."
          docker exec "$airlock_id" sh -c 'curl -m8 -sSf -o /dev/null https://example.com'
          docker exec "$airlock_id" sh -c 'curl -m8 -sSf -x http://127.0.0.1:8888 -o /dev/null https://example.com'

          docker rm -f "$airlock_id" airlock_test_target airlock_test_control airlock_test_dns
          docker network rm airlock_test_network

  manifest-airlock:
    needs: build-airlock
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build-airlock.result == 'success' }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/blot-airlock"
          SHA="${{ github.sha }}"
          docker buildx imagetools create \
            -t "$IMAGE:$SHA" \
            "$IMAGE:$SHA-amd64" \
            "$IMAGE:$SHA-arm64"

          if [ "${{ github.ref_name }}" = "master" ]; then
            docker buildx imagetools create \
              -t "$IMAGE:latest" \
              "$IMAGE:$SHA"
          fi
