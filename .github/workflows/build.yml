# Builds the production app image, checks it starts healthy (PRs), and publishes the
# manifest list deploy.yml waits for. The airlock image is
# built by airlock.yml.
#
# Production is arm64 (Graviton), so only arm64 is built, on one native runner,
# which also publishes the :<sha> manifest list (and :latest on master).
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blot
  # True for push builds and PRs from a branch of this repo; false for PRs
  # from a fork, whose GITHUB_TOKEN is read-only and cannot write to GHCR.
  # Fork PRs still build the images and run the health checks locally
  # (push: false, load: true) - they just skip the registry push, the
  # registry cache export, and the manifest jobs.
  PUSH_IMAGES: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

# Superseded PR pushes are cancelled. Each master push gets its own group: a
# shared one would drop a queued master run, and deploys need its image.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so template "Latest" timestamps can be computed
          # below. Blobless: `git log -- <path>` needs commits and trees, not
          # file contents, and the history's blobs are several GB.
          fetch-depth: 0
          filter: blob:none

      # The image is built without .git, so record each template's latest
      # commit time now for the docs site to read at runtime.
      - name: Record template commit times
        run: node app/documentation/build/latest-commits.js

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Per-arch registry cache. Keeps layers hot on each native runner.
      # Wrapped in a retry: base-image pulls occasionally fail with a Docker
      # Hub auth/network blip ("connection reset by peer" fetching an oauth
      # token) that has nothing to do with the build itself.
      - name: Build ${{ env.PUSH_IMAGES == 'true' && 'and push' || '(local only)' }} (${{ matrix.arch }})
        id: build
        uses: Wandalen/wretry.action@v3
        with:
          action: docker/build-push-action@v6
          attempt_limit: 2
          attempt_delay: 10000
          with: |
            context: .
            target: prod
            platforms: ${{ matrix.platform }}
            push: ${{ env.PUSH_IMAGES == 'true' }}
            load: ${{ env.PUSH_IMAGES != 'true' }}
            tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
            cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache-${{ matrix.arch }}
            cache-to: ${{ env.PUSH_IMAGES == 'true' && format('type=registry,ref={0}:cache-{1},mode=max', env.IMAGE_NAME, matrix.arch) || '' }}

      # PRs only. The e2e tests run the dev target, so this is the one check
      # that the prod target boots before merge. On master it would hold up
      # the manifest list deploy.yml waits for, and scripts/deploy health-checks
      # (and rolls back) the first container anyway.
      - name: Verify health check (${{ matrix.arch }})
        if: ${{ github.event_name == 'pull_request' }}
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker network create test_network

          redis_container_id=$(docker run -d --name test_redis --network test_network redis:6.2.12)

          timeout=30; interval=2; elapsed=0
          until docker exec "$redis_container_id" redis-cli ping | grep -q PONG; do
            if [ $elapsed -ge $timeout ]; then
              echo "Redis not ready in $timeout s"
              docker logs "$redis_container_id" || true
              exit 1
            fi
            sleep $interval; elapsed=$((elapsed+interval))
          done

          # The app refuses to start without a storage bucket. Nothing is
          # uploaded while it starts, so this one needn't exist.
          app_id=$(docker run -d --network test_network -e BLOT_REDIS_HOST=test_redis \
            -e BLOT_STORAGE_BUCKET=health-check -p 8080:8080 "$IMAGE")

          timeout=60; interval=5; elapsed=0
          until [ "$(docker inspect --format='{{json .State.Health.Status}}' "$app_id")" = '"healthy"' ]; do
            if [ $elapsed -ge $timeout ]; then
              echo "App health check failed"
              docker logs "$app_id" || true
              exit 1
            fi
            sleep $interval; elapsed=$((elapsed+interval))
          done

          docker rm -f "$app_id" "$redis_container_id"
          docker network rm test_network

      # Deploys look for ghcr.io/<owner>/blot:<sha> as a manifest list with an
      # arm64 entry (scripts/deploy verifyImageManifest, deploy.yml). Production
      # is arm64 only, so the list holds just the arm64 image.
      - name: Publish the manifest list
        if: ${{ env.PUSH_IMAGES == 'true' }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            "$IMAGE_NAME:${{ github.sha }}-arm64"
          if [ "${{ github.ref_name }}" = "master" ]; then
            docker buildx imagetools create \
              -t "$IMAGE_NAME:latest" \
              "$IMAGE_NAME:${{ github.sha }}"
          fi
