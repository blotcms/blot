# Builds the Node app image (the `prod` stage) on a pull request and pushes it
# as ghcr.io/<owner>/blot:prod-<sha>-arm64, for app-e2e. Master doesn't need it:
# app-e2e runs the unit image there, and ghcr.io/<owner>/blot:<sha>, the image
# deployed, is the unit image too, published by unit-image.yml, which also keeps
# the layer cache this reads (blot:cache-arm64) up to date.
#
# Production is arm64 (Graviton), so only arm64 is built, on one native runner.
name: build

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blot
  # True for PRs from a branch of this repo; false for PRs from a fork, whose
  # GITHUB_TOKEN is read-only and cannot write to GHCR.
  # Fork PRs still build the images (push: false, load: true) - they just skip
  # the registry push and the registry cache export.
  PUSH_IMAGES: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

# Superseded PR pushes are cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so template "Latest" timestamps can be computed
          # below. Blobless: `git log -- <path>` needs commits and trees, not
          # file contents, and the history's blobs are several GB.
          fetch-depth: 0
          filter: blob:none

      - id: versions
        uses: ./.github/actions/versions

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.NODE_VERSION }}

      # The image is built without .git, so record each template's latest
      # commit time now for the docs site to read at runtime.
      - name: Record template commit times
        run: node app/documentation/build/latest-commits.js

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Per-arch registry cache. Keeps layers hot on each native runner.
      # Wrapped in a retry: base-image pulls occasionally fail with a Docker
      # Hub auth/network blip ("connection reset by peer" fetching an oauth
      # token) that has nothing to do with the build itself.
      - name: Build ${{ env.PUSH_IMAGES == 'true' && 'and push' || '(local only)' }} (${{ matrix.arch }})
        id: build
        uses: Wandalen/wretry.action@v3
        with:
          action: docker/build-push-action@v6
          attempt_limit: 2
          attempt_delay: 10000
          with: |
            context: .
            file: config/docker/Dockerfile
            target: prod
            # JSON-encoded: wretry reads this block as YAML, and the value spans lines
            build-args: ${{ toJSON(steps.versions.outputs.build-args) }}
            platforms: ${{ matrix.platform }}
            push: ${{ env.PUSH_IMAGES == 'true' }}
            load: ${{ env.PUSH_IMAGES != 'true' }}
            tags: ${{ env.IMAGE_NAME }}:prod-${{ github.sha }}-${{ matrix.arch }}
            cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache-${{ matrix.arch }}
            cache-to: ${{ env.PUSH_IMAGES == 'true' && format('type=registry,ref={0}:cache-{1},mode=max', env.IMAGE_NAME, matrix.arch) || '' }}
