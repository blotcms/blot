name: host-setup

# Runs config/host/host/setup.sh in Amazon Linux 2023 containers (twice, to
# check it is idempotent) and in an Amazon Linux 2 one, where it must refuse.
# See config/host/tests/setup.sh. It needs Docker on the runner.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/host-setup.yml"
      - "config/host/bootstrap.sh"
      - "config/host/host/**"
      - "config/host/tests/setup.sh"
      - "scripts/deploy/setup-deploy-user.sh"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/host-setup.yml"
      - "config/host/bootstrap.sh"
      - "config/host/host/**"
      - "config/host/tests/setup.sh"
      - "scripts/deploy/setup-deploy-user.sh"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: setup.sh on Amazon Linux 2023 and 2
        run: config/host/tests/setup.sh
