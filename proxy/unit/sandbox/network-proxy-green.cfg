# nsjail config for green's proxy jail: pasta, with one port forwarded from the
# unit's loopback, which is the host's. The port is sandboxProxyPort in
# scripts/deploy/constants.js. The rest of the jail's flags are in ./jail.js.
name: "blot-sandbox-proxy"
mode: ONCE
user_net { enable: true tcp_ports: "127.0.0.1/18989:8888" }
