# The forward proxy in the unit's proxy jail (./proxy.js). The app points its
# fetches of user-supplied URLs here (BLOT_AIRLOCK_PROXY_URL), so they leave
# from a namespace behind ./egress.nft, which is the destination control: this
# proxy does no filtering of its own. For HTTPS it is an opaque tunnel.
#
# No User or Group: the jail is already its own uid. pasta forwards the unit's
# 127.0.0.1 port (./network-proxy-<unit>.cfg) to this listener. No ConnectPort:
# it is checked before the filter, and would refuse https://host:8443/photo.png.

Port 8888
Listen 127.0.0.1
Timeout 600
MaxClients 64
Allow 127.0.0.1
LogLevel Warning
DisableViaHeader Yes

# Requesting this host through the proxy returns tinyproxy's own stats page
# without any outbound traffic: the deploy's verify check uses it.
StatHost "tinyproxy.stats"
