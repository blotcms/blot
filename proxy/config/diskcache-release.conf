# A disk cache fill that error_page redirected here (an intercepted 500, or
# nginx's own 502 when Node is down) still holds its lock. The log_by_lua in
# http.conf is replaced, so ban:record() is called here too. Requests from
# other locations never set $diskcache_lock: don't warn about it.
uninitialized_variable_warn off;
log_by_lua_block {
  ban:record()
  diskcache:release()
}
