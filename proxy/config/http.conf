{{> cloudflare-real-ip.conf}}

# conn/cr/tls let us count TLS handshakes: cr=1 with tls=. is a full handshake, tls=r a resumed one.
# wl=1 marks a trusted peer (the macserver, a Bunny edge): fail2ban skips it. Keep ref= and ua= last: they hold attacker text.
# unit= (which proxy container answered, blue or green) is appended after them so
# nothing positional moves; it is always the last token, and a client can fake it
# only with a crafted Accept-Encoding, so nothing may trust it.
log_format access_log_format '[$time_local] $request_id $status $request_time $request_length:$bytes_sent $scheme://$host$request_uri  cache=$sent_http_blot_cache ip=$remote_addr st=$upstream_response_time lrs=$limit_req_status up=$upstream_addr conn=$connection cr=$connection_requests tls=$ssl_session_reused wl=$whitelist ref=$http_referer ua=$http_user_agent ae=$http_accept_encoding unit=${PROXY_UNIT}';

# Define whitelist
# I verified the whitelist works by adding limit=$limit to the log format
# then checking that requests from bunny were 'limit=' i.e. empty while
# other requests the limit variable was not, e.g. limit=\x22\xAE...
geo $whitelist {
    default 0;
    # mac server IP
    192.168.1.228 1;
    include /etc/openresty/cdn-ips.conf;
}

# Ban IPs that keep getting 444 (see ban.lua); inherited by every server. The
# handshake check, ssl_client_hello_by_lua, is in wildcard-ssl.conf (which
# auto-ssl.conf includes): nginx rejects it in a server without a TLS listener.
# rewrite_by_lua, not access_by_lua: a location with its own access_by_lua
# would replace one inherited from the server.
log_by_lua_block { ban:record() }
rewrite_by_lua_block { ban:request() }

map $whitelist $limit {
    0     $binary_remote_addr;
    1     "";
}

limit_conn_zone $limit zone=connlimit:10m;

limit_req_zone $limit zone=bots:10m rate=1r/s;

# This is for human traffic, but should catch out bots who are scraping too aggressively
limit_req_zone $limit zone=general:10m rate=6r/s;

# Preview traffic intentionally gets elevated rate limits (roughly 5x) to avoid
# human authors getting banned while preview pages fan out many asset requests.
limit_req_zone $limit zone=general_preview:10m rate=30r/s;

# This limits requests to a specific hostname, regardless of IP and prevents one site
# consuming too much of the wider server's resources

# Exclude cdn and site from host-specific rate limiting
map $host $host_limit_key {
    default $host;
    cdn.{{host}} "";
    {{host}} "";
}

limit_req_zone $host_limit_key zone=hostlimit:10m rate=10r/s;

# Same host-level protection model as hostlimit, but relaxed for preview hosts.
limit_req_zone $host_limit_key zone=hostlimit_preview:10m rate=50r/s;

{{#log_to_stdout}}
# Container-native logging: `docker logs` shows access + error lines.
error_log /dev/stderr info;
access_log /dev/stdout access_log_format;
{{/log_to_stdout}}
{{^log_to_stdout}}
error_log {{{log_directory}}}/error.log info;
access_log {{{log_directory}}}/access.log access_log_format;
{{/log_to_stdout}}

# Hide the nginx version in the server header
server_tokens off;

# Basic response hardening headers
add_header X-Content-Type-Options "nosniff" always;

# Drop slow clients more aggressively to reduce worker exhaustion risk
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
reset_timedout_connection on;

# Added to set the content-type charset header 
# for text files served by NGINX
charset utf-8;

{{> static-file.conf}}

{{#lua_package_path}}

# Required to resolve the luarocks module 'resty.auto-ssl'
# when running openresty on Github Actions for some reason
lua_package_path '{{{lua_package_path}}};;';

{{/lua_package_path}}

{{^lua_package_path}}
lua_package_path '{{{config_directory}}}/?.lua;;';
{{/lua_package_path}}

{{> init.conf}}

# The blog cache is diskcache.lua, under {{{cache_directory}}}: no
# proxy_cache_path, whose cache loader would delete its files as invalid.
# Locks, so one request per key fills it:
lua_shared_dict diskcache_locks 10m;
# entries waiting for their brotli copies:
lua_shared_dict diskcache_queue 10m;

# used by /clients to handle syncs (this can be computationally expensive)
# and by the cdn
upstream blot_node {
  # Use least connections algorithm to better distribute load
  least_conn;
  # Activates the cache for connections to upstream servers.
  keepalive 120;
  # nginx's default (1000) closes a busy connection after 1000 requests.
  keepalive_requests 10000;

  # max_fails=0 everywhere: a failed attempt never takes a container out of
  # rotation (with max_fails=1 one boot-time reset or slow request ejected it
  # for 10s, emptying the backup for the next container in a rolling deploy).
  # Each request still retries the backup on a connect failure, which over the
  # Unix sockets is immediate when a container is down, draining or booting.
  # Blue must be 'backup', not a low-weight peer: with least_conn a
  # weight=1 blue wins whenever it is idle and green has any request
  # in flight, sending sync work to the dashboard container.
  server ${PROXY_UPSTREAM_GREEN} weight=100 max_fails=0;           # blot-container-green, the sync/writes/webhooks server
  server ${PROXY_UPSTREAM_BLUE} backup max_fails=0;   # blot-container-blue FAILOVER server
}

upstream blot_blogs_node {
  # Use least connections algorithm to better distribute load
  least_conn;
  # Activates the cache for connections to upstream servers.
  keepalive 120;
  # nginx's default (1000) closes a busy connection after 1000 requests.
  keepalive_requests 10000;

  # max_fails=0: see blot_node
  # We bias traffic to one container slightly so if there is a memory
  # leak both containers do not go down close together
  server ${PROXY_UPSTREAM_YELLOW} weight=100 max_fails=0;           # blot-container-yellow
  server ${PROXY_UPSTREAM_BLUE} backup max_fails=0; # blot-container-blue FAILOVER server
}

# Per-blog dashboard requests: reads on blue, writes on green (see blot-site.conf)
map $request_method $dashboard_upstream {
  default blot_node;
  GET     blot_dashboard_node;
  HEAD    blot_dashboard_node;
  OPTIONS blot_dashboard_node;
}

upstream blot_dashboard_node {
  # Use least connections algorithm to better distribute load
  least_conn;
  # Activates the cache for connections to upstream servers.
  keepalive 120;
  # nginx's default (1000) closes a busy connection after 1000 requests.
  keepalive_requests 10000;

  # max_fails=0: see blot_node
  # We bias traffic to one container slightly so if there is a memory
  # leak both containers do not go down close together
  server ${PROXY_UPSTREAM_BLUE} weight=100 max_fails=0;           # blot-container-blue
  server ${PROXY_UPSTREAM_GREEN} backup max_fails=0;   # blot-container-green FAILOVER server
}

upstream blot_stats {
  server 127.0.0.1:19999;
}
