{{#development}}
# Local development only. In production Bunny fetches blog_* from the storage
# bucket itself and never asks this proxy (config/storage-bucket). Locally the
# bucket is MinIO, so this stands in for Bunny: a key the bucket has is served
# from it, and one it doesn't (403 or 404) falls through to Node, as Bunny's
# would. The bucket is the BLOT_STORAGE_BUCKET in
# scripts/development/docker-compose.yml; $request_uri is passed on untouched.
location ~ ^/blog_ {
    set $development_bucket minio:9000;
    proxy_pass http://$development_bucket/blot-storage-dev$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host minio:9000;
    proxy_set_header Connection "";
    proxy_intercept_errors on;
    error_page 403 404 = @cdn_node;

    # What a Bunny edge rule adds in production, as S3 doesn't
    add_header Access-Control-Allow-Origin "*" always;
}
{{/development}}
