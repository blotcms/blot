set $upstream_server blot_dashboard_node;

# error page for when node server is unavailable
location = /error-upstream-offline.html {
  root  {{{config_directory}}}/html;
  try_files /error-upstream-offline-site.html =404;
}

# used to monitor uptime by docker
location = /health {
  return 200;
}

# redirect for /cdn/XYZ to cdn.blot.im/XYZ
location ~ ^/cdn/(.*)$ {
  return 301 https://cdn.blot.im/$1;
}

# bypass cache, long timeout
# used to stream an SSE with the current sync status of a site
location ~ ^/sites/[^/]+/status$ {
  {{> reverse-proxy-sse.conf}}
}

# bypass cache
location = /stripe-webhook {
  {{> reverse-proxy.conf}}
}

# bypass cache
location = /paypal-webhook {
  {{> reverse-proxy.conf}}
}

# bypass cache
location = /redis-health {
  {{> reverse-proxy.conf}}
}

# Cap authentication form bodies. The standard 15s proxy_read_timeout is
# plenty for a Stripe/PayPal call during signup.
# ~* so a mixed-case path cannot skip this location for the 1000 MB /sites one
location ~* ^/sites/(log-in|sign-up|account/password)(/|$) {
  {{> reverse-proxy.conf}}
  client_max_body_size 4k;
}

location /sites {
  {{> reverse-proxy-huge.conf}}
}

# in order for scheduled entries triggered by resync/rebuild to work 
# properly these requests need to be passed to the master node
location ~ ^/sites/[^/]+/client/reset/rebuild {
  set $upstream_server blot_node;
  {{> reverse-proxy.conf}}
}

# Import status lives in per-container temp files (see dashboard/site/import),
# so every method under /import must reach the same container as the worker.
location ~ ^/sites/[^/]+/import(/|$) {
  set $upstream_server blot_node;
  {{> reverse-proxy-huge.conf}}
}

# The Dropbox OAuth callback is a GET that connects the client and runs the
# whole-folder initial upload, so it can't wait for the method map below.
# (Other clients set up via POST.)
location ~ ^/sites/[^/]+/client/dropbox/authenticate$ {
  set $upstream_server blot_node;
  {{> reverse-proxy-huge.conf}}
}

# Per-blog dashboard pages, including the bare /sites/<handle> settings form
# (GET/HEAD) render on blue. Writes (POST etc.) run on
# green, since they are where the expensive work happens: uploads, whole-blog
# rebuilds, resyncs, image processing, deletes. This keeps a long write from
# blocking the event loop that serves the same user's other tabs. Account routes
# (/sites/account, log-in, sign-up) are excluded and stay on blue.
# See $dashboard_upstream in http.conf.
location ~ ^/sites/(?!account(/|$)|log-in(/|$)|sign-up(/|$))[^/]+(/|$) {
  set $upstream_server $dashboard_upstream;
  {{> reverse-proxy-huge.conf}}
}

# bypass cache and allow large uploads / downloads with long timeout
# this is where the sync happens and we use the master server for this
# to keep the dashboard snappy
location /clients {
  set $upstream_server blot_node;
  {{> reverse-proxy-huge.conf}}
}

# bypass cache
location /dashboard {
  {{> reverse-proxy-huge.conf}}
}

# bypass cache for question endpoints with ID
# this is needed for the reply form to receive
# the correct csrf token
location ~ ^/questions/(\d+)$ {
  {{> reverse-proxy.conf}}
}

# bypass cache so csrf token works
location /questions/ask {
  {{> reverse-proxy.conf}}
}

# byoass cache so csrf token works
location /news/sign-up {
  {{> reverse-proxy.conf}}
}

# byoass cache so csrf token works
location /news/cancel {
  {{> reverse-proxy.conf}}
}

# bypass cache so csrf token works
location ~ ^/questions/[^/]+/edit$ {
  {{> reverse-proxy.conf}}
}

# bypass cache so csrf token works
location ~ ^/questions/[^/]+/new$ {
  {{> reverse-proxy.conf}}
}

# all other requests can be cached
location / {
  {{> reverse-proxy-cache.conf}}
}
