set $cache_key $scheme://$host$request_uri;
# the fill lock this request holds, see diskcache:release()
set $diskcache_lock "";

# Don't pass conditional or range headers to upstream: store whole,
# cacheable responses only, as proxy_cache did
proxy_set_header If-None-Match "";
proxy_set_header If-Modified-Since "";
proxy_set_header Range "";
proxy_set_header If-Range "";

proxy_connect_timeout 250ms;
proxy_send_timeout 10s;
proxy_read_timeout 15s;

{{> reverse-proxy-base.conf}}

access_by_lua_block { diskcache:fill() }
header_filter_by_lua_block { diskcache:header_filter() }
body_filter_by_lua_block { diskcache:body_filter() }
# replaces the log_by_lua inherited from http.conf, so ban:record() is called here
log_by_lua_block {
  ban:record()
  diskcache:log()
}
