# A cache miss in diskcache.lua (see reverse-proxy-cache.conf): ask Node and
# store the answer
location @diskcache_fill {
  {{> reverse-proxy-fill-base.conf}}
}

# A conditional GET or a HEAD that misses (diskcache:fill sends it here).
# When Node's validator matches, the client gets a 304 as proxy_cache sent
# it; a HEAD is asked of Node as a GET, as proxy_cache_convert_head did. nginx
# drops either body unless proxy_store is on: proxy_store keeps reading it
# into $diskcache_store, which diskcache:log publishes. Its own location so
# the other misses do not write their bodies twice.
location @diskcache_fill_conditional {
  set $diskcache_conditional 1;
  proxy_method GET;
  set $diskcache_store "";
  proxy_store $diskcache_store;
  # under the cache directory, so the stored file is renamed, not copied
  proxy_temp_path {{{cache_directory}}}/.proxy-temp;

  {{> reverse-proxy-fill-base.conf}}
}
