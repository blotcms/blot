# Serve the wildcard certificate from Redis when it is there (see
# wildcard_cert.lua), so a renewal needs no reload. The static ssl_certificate
# in wildcard-ssl.conf is the fallback. Included only in the wildcard server
# blocks: the default server and webhooks. use auto-ssl.conf's handler instead.
ssl_certificate_by_lua_block {
  wildcard_cert:serve()
}
