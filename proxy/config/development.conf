# Local development only (LOCAL_DEVELOPMENT=true, scripts/development/unit):
# production renders none of this. See development-server.conf and
# development-cdn.conf for the rest.

# Agentation (scripts/development/agentation) drops its maps here. The globs
# match nothing until it does, which nginx allows.
include /etc/openresty/development/http/*.conf;

# Worktree previews (scripts/development/preview.sh): a-local.blot ...
# e-local.blot (a-{{host}}, ...) and their subdomains go to that slot's sidecar container on the
# compose network. A variable proxy_pass resolves at request time (through
# Docker's DNS, the resolver in development), so the proxy starts fine with no
# sidecars running and answers 502 for a slot that is free. Sidecars are plain
# Node containers, so none of the cache or routing above applies to them.
server {
    listen 80;
    listen 443 ssl;
    server_name ~^(?:.+\.)?(?<slot>[a-e])-{{host}}$;

    {{> wildcard-ssl.conf}}

    {{> development-server.conf}}

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    error_page 500 502 503 504 /error-upstream-offline.html;

    location = /error-upstream-offline.html {
        internal;
        root {{{config_directory}}}/html;
        try_files /error-upstream-offline-site.html =404;
        add_header Cache-Control 'no-store' always;
    }

    location / {
        set $preview_upstream blot-node-$slot;
        proxy_pass http://$preview_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 100M;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        include /etc/openresty/development/proxy/*.conf;
    }
}
