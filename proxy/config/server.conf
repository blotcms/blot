{{> initial.conf}}

http {

    {{> http.conf}}

    # HTTP/3 is disabled until OpenResty ships the QUIC security fixes (TODO).
    # Alt-Svc: clear on the public servers expires clients' cached h3 routes.
    # Reject requests without a Host over the remaining HTTP/1 and HTTP/2.
    map $http_host $missing_host {
        default 0;
        ""      1;
    }

    # bots
    map $http_user_agent $bad_bot {
        default 0;
        # Scraper libraries and automation tools
        ~*(?i)(axios|wget|okhttp|jsdom|phantomjs|selenium|webdriver) 1;
        ~*(?i)(playwright|puppeteer|cypress|watir|mechanize) 1;
        # Allow http.rb because Mastodon/OpenGraph preview fetchers may use it.
        ~*(?i)(aoihttp|Faraday|Go-http-client|hackney|python-httpx|python-requests|Python-urllib) 1;
        
        # AI and specialized bots
        ~*(?i)(anthropic-ai|Timpibot|ClaudeBot|Claude-Web|^AIBOT|^BunnySlippers|^Cegbfeieh|^CheeseBot) 1;
        
        # Common crawlers and SEO tools
        ~*(?i)(SemrushBot|Semrush|AhrefsBot|MJ12bot|YandexBot|YandexImages) 1;
        ~*(?i)(MegaIndex\.ru|BLEXbot|BLEXBot|ZoominfoBot|YaK|VelenPublicWebCrawler) 1;
        ~*(?i)(SentiBot|Vagabondo|SEOkicks|SEOkicks-Robot|mtbot/1\.1\.0i|SeznamBot) 1;
        ~*(?i)(DotBot|Cliqzbot|coccocbot|SiteCheck-sitecrawl|MauiBot|GumGum) 1;
        ~*(?i)(Clickagy|AspiegelBot|Yandex|TkBot|CCBot|Qwantify|MBCrawler) 1;
        ~*(?i)(serpstatbot|AwarioSmartBot|Semantici|ScholarBot|proximic|MojeekBot) 1;
        ~*(?i)(GrapeshotCrawler|IAScrawler|linkdexbot|contxbot|PlurkBot|PaperLiBot) 1;
        ~*(?i)(BomboraBot|Leikibot|weborama-fetcher|NTENTbot|IbouBot|SeekportBot) 1;
        
        # Content and advertising bots
        ~*(?i)(admantx-usaspb|Eyeotabot|VoluumDSP-content-bot|SirdataBot|adbeat_bot) 1;
        ~*(?i)(TTD-Content|admantx|Nimbostratus-Bot|Mail\.RU_Bot|Quantcastboti) 1;
        ~*(?i)(Onespot-ScraperBot|Taboolabot|Baidu|Jobboerse|VoilaBot|Sogou) 1;
        
        # More scrapers and collectors
        ~*(?i)(Jyxobot|Exabot|ZGrab|Proximi|Sosospider|Accoona|aiHitBot|Genieo|Thinkbot) 1;
        ~*(?i)(BecomeBot|ConveraCrawler|NerdyBot|OutclicksBot|findlinks|JikeSpider) 1;
        ~*(?i)(Gigabot|CatchBot|Huaweisymantecspider|SiteSnagger|DataForSEO|Amazonbot) 1;
        ~*(?i)(TeleportPro|WebCopier|WebReaper|WebStripper|WebZIP|Xaldon_WebSpider|petalbot) 1;
        
        # Malicious bots and tools
        ~*(?i)(BackDoorBot|AITCSRoboti|Arachnophilia|BackRub|BlowFishi|perl) 1;
        ~*(?i)(CherryPicker|CyberSpyder|EmailCollector|Foobot|GetURL|httplib) 1;
        ~*(?i)(HTTrack|LinkScan|Openbot|Snooper|SuperBot|URLSpiderPro|MAZBot) 1;
        
        # Social media and content aggregators
        ~*(?i)(EchoboxBot|SerendeputyBot|LivelapBot|linkfluence) 1;
        ~*(?i)(TweetmemeBot|LinkisBot|CrowdTanglebot) 1;
        
        # Python and generic scraping
        ~*(?i)(python|Scrap) 1;
        
        # Empty or missing User-Agent
        ~*(^-$|^$) 1;
    }

    # blot subdomains (e.g. david.blot.im)
    server {
        listen 80;
        listen 443 ssl;
        add_header Alt-Svc clear always;
        
        {{^disable_http2}}
        http2 on;
        {{/disable_http2}}

        # match all subdomains of blot.im which do not start with preview-
        # e.g. blog-on-david.blot.im
        server_name "~^(?!preview-)[^.]+\.{{host}}$";
        
        {{> restrict-bot-uas.conf}}
        
        {{> wildcard-ssl.conf}}

        {{> wildcard-cert.conf}}

        {{> blot-blogs.conf}}
    }

    # preview subdomains (e.g. preview-of-blog-on-david.blot.im)
    # these skip the cache and are passed directly to node
    server {
        listen 80;
        listen 443 ssl;
        add_header Alt-Svc clear always;
        
        {{^disable_http2}}
        http2 on;
        {{/disable_http2}}

        server_name "~^preview-[^.]+\.{{host}}$";

        {{> restrict-bot-uas.conf}}

        {{> wildcard-ssl.conf}}

        {{> wildcard-cert.conf}}
        
        location / {
            set $upstream_server blot_blogs_node;
            {{> reverse-proxy-preview.conf}}
        }
    }

    # cdn subdomain (e.g. cdn.blot.im)
    # these skip the cache and are passed directly to node
    server {
        listen 80;
        listen 443 ssl;
        add_header Alt-Svc clear always;

        {{^disable_http2}}
        http2 on;
        {{/disable_http2}}

        server_name cdn.{{host}};

        {{> wildcard-ssl.conf}}

        {{> wildcard-cert.conf}}

        location = / {
            return 301 https://blot.im;
        }

        # The app's own static files (fonts, scripts, ...) are served from
        # disk; everything else, including every per-blog asset
        # (/blog_*, which live in the storage bucket), goes to node. The
        # headers are not inherited by the named location below.
        location / {
            root {{{global_static_files_dir}}};
            try_files $uri $uri/ @cdn_node;
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "public, max-age=31536000";
            expires 1y;
        }

        location @cdn_node {
            set $upstream_server blot_node;
            {{> reverse-proxy.conf}}
        }
    }

    # blot.im
    server {
        listen 443 ssl;
        add_header Alt-Svc clear always;
        
        {{^disable_http2}}
        http2 on;
        {{/disable_http2}}

        server_name {{host}}; 

        {{> restrict-bot-uas.conf}}
        
        {{> wildcard-ssl.conf}}

        {{> wildcard-cert.conf}}

        {{> blot-site.conf}}
    }

    # webhooks relay at webhooks.blot.im
    server {
        listen 443 ssl;
        add_header Alt-Svc clear always;
        {{^disable_http2}}
        http2 on;
        {{/disable_http2}}
        server_name webhooks.{{host}}; 

        {{> auto-ssl.conf}}

        location / {
            # the icloud relay needs to handle large file uploads
            client_max_body_size {{webhooks_client_max_body_size}};

            # Any Node process can serve the relay: incoming webhooks and
            # connected clients meet over Redis pub/sub (app/clients/webhooks.js)
            proxy_pass http://blot_node;

            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_connect_timeout 250ms;

            # SSE-specific configurations
            proxy_http_version 1.1;      # SSE requires HTTP/1.1
            proxy_set_header Connection '';  # Disable keep-alive
            proxy_buffering off;         # Disable response buffering
            proxy_cache off;             # Ensure no caching

            # generic
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;        
        }
    }

    # custom domains
    server {
        listen 80 default_server {{#reuseport}}reuseport{{/reuseport}};
        listen 443 ssl default_server {{#reuseport}}reuseport{{/reuseport}};
        add_header Alt-Svc clear always;
        {{^disable_http2}}
        http2 on;
        {{/disable_http2}}

        {{> restrict-bot-uas.conf}}
                
        if ($missing_host) {
            return 403;
        }

        {{> auto-ssl.conf}}
        {{> blot-blogs.conf}}
    }    

    # redirect blot.im over HTTP to HTTPS
    server {
        listen 80;
        server_name {{host}}; 
        return 301 https://$host$request_uri;
    }

    # Container-local readiness probe. The Dockerfile HEALTHCHECK and
    # proxy/deploy/blue-green.sh probe THIS Unix socket, which lives in the
    # container's own /run - never a reuseport TCP port, which the *other*
    # container in a blue/green overlap could answer, letting a not-yet-ready
    # replacement look healthy.
    server {
        listen unix:/run/openresty/health.sock;
        location = /health { return 200; }
        location / { return 404; }
    }

    # internal server for purging the cache
    server {
       listen 127.0.0.1:80 {{#reuseport}}reuseport{{/reuseport}};
        {{#openresty_instance_private_ip}}
        # needed by the node application running inside docker
        # which doesn't have access to the host network
        # this seems to cause errors for custom domains
        # and overrides the default server
        listen {{openresty_instance_private_ip}}:8077 {{#reuseport}}reuseport{{/reuseport}};
        {{/openresty_instance_private_ip}}

        # If BLOT_PURGE_TOKEN is set, /purge requires it in the
        # X-Blot-Purge-Token header. Unset means open, as before.
        access_by_lua_block {
            local token = os.getenv("BLOT_PURGE_TOKEN")

            if token == nil or token == "" then
                return
            end

            -- compare without returning early on the first differing byte
            local given = ngx.var.http_x_blot_purge_token
            local diff = 1

            if type(given) == "string" and #given == #token then
                diff = 0
                for i = 1, #token do
                    diff = bit.bor(diff, bit.bxor(given:byte(i), token:byte(i)))
                end
            end

            if diff ~= 0 then
                return ngx.exit(ngx.HTTP_FORBIDDEN)
            end
        }

        location = /purge {
            content_by_lua_block {
                diskcache:purge()
            }
        }

        # otherwise, return 404
        location / {
            return 404;
        }
    }
}
