set $cache_key $scheme://$host$request_uri;

# ignore requests destined for the cache which are POST, PUT, DELETE, etc.
limit_except GET HEAD {
    deny all;
}

# The disk cache (diskcache.lua). A hit is served from this location by the
# static module (sendfile), with the headers diskcache:access() set, and
# brotli_static sends the stored .br copy when there is one; anything else
# goes to @diskcache_fill (reverse-proxy-fill.conf), which asks Node and
# stores the answer.
root {{{cache_directory}}};
set $diskcache_path "/.none";
# "1" only in @diskcache_fill_conditional; read by every fill (diskcache.lua)
set $diskcache_conditional "";
brotli_static on;
# diskcache:access() sends Node's ETag; the file's would change every fill
etag off;
# a body's type is the one Node sent, set by diskcache:access(), or none if
# Node sent none: never one guessed from the file name
default_type "";

# open_file_cache is inherited from static-file.conf: about 1.5us a hit
# faster (proxy/bench), and safe, since a body never changes once written
# (its name includes the fill id) and .meta is read with io.open, outside it.
# Not for misses, though: a worker that cached "no .br" would compress on the
# fly for up to open_file_cache_valid after the copy is made (proxy/bench)
open_file_cache_errors off;

{{> reverse-proxy-limit-default.conf}}
limit_conn           connlimit 20;
limit_conn_status    503;
error_page 429 /error-upstream-offline.html;

add_header 'Blot-Server' '{{server_label}}' always;

access_by_lua_block { diskcache:access() }
header_filter_by_lua_block { diskcache.hit_header_filter() }
try_files $diskcache_path @diskcache_fill;
