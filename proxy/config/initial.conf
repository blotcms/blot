user	  {{user}} {{user}};  ## Default: nobody

# Brotli filter and static modules, built as dynamic modules in proxy/Dockerfile.
# Dynamic modules must be loaded in the main context, before http. The static
# module serves the .br copies diskcache.lua makes of cached bodies.
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

env CURL_CA_BUNDLE;
env SSL_CERT_FILE;

worker_processes auto;

# After a quit or reload, an old worker is killed once this long has passed even
# if it still has connections (a long download, an idle keep-alive, a stuck
# upstream). Without it a worker can outlive its container's `docker stop
# --time 30` (PROXY_DRAIN_TIMEOUT, proxy/deploy/common.sh) and be SIGKILLed
# with the rest, and with two proxies running a stuck drain holds up a deploy.
# Well inside the 30s, so the drain ends cleanly.
worker_shutdown_timeout 10s;

# nginx clears the environment of worker processes except for the variables
# named here. The /purge auth in server.conf reads BLOT_PURGE_TOKEN. Tests set
# PROXY_AUTO_SSL_CACHE_TTL to shorten auto-ssl's certificate cache (init.conf).
env BLOT_PURGE_TOKEN;
env PROXY_AUTO_SSL_CACHE_TTL;
# The ACME hook secret shared by every instance (init.conf), read when the
# master loads the config.
env PROXY_ACME_HOOK_SECRET;

# Defines the scheduling priority for worker processes like it is done by the nice command:
# a negative number means higher priority. Allowed range normally varies from -20 to 20.
worker_priority -20;

# Sets the limit of the maximum number of open files (RLIMIT_NOFILE)
# for worker processes. Each proxied connection holds about two fds (client +
# upstream), so worker_connections 10000 below can need about 20000; this is
# 2x that plus headroom, well under the container's --ulimit nofile (65536,
# proxy/deploy/common.sh). The master runs as root, so it can raise this even
# on bare metal.
worker_rlimit_nofile 20480;

events {
    worker_connections 10000;
    multi_accept on;
}