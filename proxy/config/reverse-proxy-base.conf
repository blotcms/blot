proxy_pass http://$upstream_server;

# required for keepalive per the docs
# per the docs: https://nginx.org/en/docs/http/ngx_http_upstream_module.html#keepalive
proxy_http_version 1.1;
proxy_set_header Connection "";

# custom headers
add_header 'Blot-Server' '{{server_label}}' always;
add_header 'Blot-Cache' $upstream_cache_status always;
add_header 'Blot-Upstream' $upstream_addr always;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Upgrade $http_upgrade;

# We let nginx handle the compression
proxy_set_header Accept-Encoding "";

# For larger responses (blog posts, content-heavy pages)
# Configured for 2MB total buffer size
proxy_buffers 32 64k;        # 2MB total (32 * 64k = 2048k)
proxy_buffer_size 64k;

proxy_redirect off;

proxy_intercept_errors on;
# 503 is deliberately not intercepted: Node answers 503 when Redis is
# unreachable, with its own "temporarily unavailable" page, Retry-After and
# no-store, which is more accurate than the offline page. (Connection-limit
# rejections below are also 503 and get nginx's plain page.)
error_page 500 502 504 429 /error-upstream-offline.html;

# Retry the backup upstream when the connection to the primary fails (a
# container that is down, draining or booting: over the Unix sockets that is an
# immediate refusal) or it sends an invalid header. Nothing was sent, so POSTs
# are retried too; without 'non_idempotent' nginx never retries one once the
# request went out. 500/502/504 are not retried: Node never sends 502/504, and
# retrying a 500 just repeats an app error on blue. http_503 is not a failover
# condition either: a Redis outage makes every Node answer 503.
proxy_next_upstream error invalid_header;
proxy_next_upstream_tries 2; # any less than this and it seems that proxy_next_upstream doesn't work
proxy_next_upstream_timeout 800ms;

# We'll handle a maximum of 20 open connections per IP
# CDN ips are whitelisted
limit_conn           connlimit 20;
limit_conn_status    503;
