# Abort the handshake of a banned IP before a certificate is chosen (ban.lua)
ssl_client_hello_by_lua_block { ban:handshake() }

# Check with the SSL evaluator tool
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_buffer_size 4k;
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

# A resumed handshake sends ~250 bytes to the client; a full one ~5 KB of
# certificates, which is most of the proxy's internet egress. Scanners and
# crawlers reconnect constantly, so keep sessions a day.
# One megabyte can store about 4000 sessions, so 100m = 400,000 sessions, which
# is 100 MB of the host's memory at most, used as sessions arrive.
# Tickets stay off: they would let a resumed session outlive the cache's
# lifetime and need a key shared between workers and containers to rotate.
ssl_session_cache shared:SSL:100m;
ssl_session_timeout 24h;
ssl_session_tickets off;

# LetsEncrypt no longer supports stapling:
# https://letsencrypt.org/2024/12/05/ending-ocsp
ssl_stapling off;

# The SSL certificate we use is generated by https://github.com/kshcherban/acme-nginx
# for the "*.blot.im" and "blot.im" domains. This allows us to do an infinite
# number of subdomains for previewing templates. The paths to these files are
# hardcoded in the source for kshcherban/acme-nginx. I wrote more about this
# process in notes/wildcard-ssl
ssl_certificate {{{ssl_certificate}}};
ssl_certificate_key {{{ssl_certificate_key}}};
