name: blot-proxy-e2e

# Brings up the proxy container in front of a real Blot app container so
# proxy/e2e/run.js can drive requests through it. See
# .github/workflows/app-e2e.yml.
#
# Everything runs on the host network so the proxy's upstream addresses
# (127.0.0.1:8088-8090, set on the proxy below) resolve with no extra plumbing. Meant for a
# CI runner, not a shared machine (it binds :80 and :443).

services:
  redis:
    image: redis:6.2.12-alpine
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    # The production image build.yml pushes for this commit, run as deployed:
    # its own source, user, NODE_ENV and CMD. BLOT_APP_IMAGE is required.
    image: ${BLOT_APP_IMAGE:?set BLOT_APP_IMAGE to the app image to test}
    network_mode: host
    environment:
      BLOT_HOST: ${BLOT_HOST:-localhost}
      BLOT_REDIS_HOST: "127.0.0.1"
      BLOT_PORT: "8081"
      # Generated assets live only in the storage bucket; CI points these at
      # the MinIO started by .github/actions/start-minio.
      BLOT_STORAGE_BUCKET: ${BLOT_STORAGE_BUCKET}
      BLOT_STORAGE_ENDPOINT: ${BLOT_STORAGE_ENDPOINT}
      BLOT_STORAGE_REGION: ${BLOT_STORAGE_REGION}
      BLOT_AWS_KEY: ${BLOT_AWS_KEY}
      BLOT_AWS_SECRET: ${BLOT_AWS_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    # The app routes by Host: an unknown host is treated as a blog and /health
    # 404s. Probe as the site host instead.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: localhost", "http://127.0.0.1:8081/health"]
      interval: 3s
      timeout: 5s
      retries: 90
      start_period: 60s

  # The proxy's upstreams are set on the proxy below (unit mode): 8088-8090 here.
  # Point all four ports (8088-8091) at the single app instance on :8081.
  upstream-mux:
    image: alpine/socat
    network_mode: host
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for p in 8088 8089 8090 8091; do
          socat TCP-LISTEN:$$p,fork,reuseaddr TCP:127.0.0.1:8081 &
        done; wait
    # Ready once all four upstream ports accept connections, so the proxy
    # never starts ahead of them.
    healthcheck:
      test:
        - CMD-SHELL
        - for p in 8088 8089 8090 8091; do nc -z 127.0.0.1 $$p || exit 1; done
      interval: 1s
      timeout: 3s
      retries: 30
    depends_on:
      app:
        condition: service_healthy

  proxy:
    image: ${BLOT_PROXY_IMAGE:-blot-proxy:e2e}
    network_mode: host
    environment:
      BLOT_HOST: ${BLOT_HOST:-localhost}
      # Unit mode: worker on 8089, main (blogs, dashboard) on 8090, the
      # backup for both on 8088.
      PROXY_UNIT_MAIN: "127.0.0.1:8090"
      PROXY_UNIT_WORKER: "127.0.0.1:8089"
      PROXY_PEER_MAIN: "127.0.0.1:8088"
      PROXY_PEER_WORKER: "127.0.0.1:8088"
    # Persistent volumes for the proxy cache and the lua-resty-auto-ssl /
    # dehydrated working files, so recreating the container does not
    # cold-start the cache or lose issuance state. entrypoint.sh chowns both
    # to ec2-user on boot (they mount root-owned).
    volumes:
      - proxy-cache:/var/cache/openresty
      - auto-ssl:/etc/resty-auto-ssl
    depends_on:
      app:
        condition: service_healthy
      upstream-mux:
        condition: service_healthy

volumes:
  proxy-cache:
  auto-ssl:
