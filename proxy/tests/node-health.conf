user {{user}} {{group}};

events {
    worker_connections 1000;
}

http {
    error_log {{{data_directory}}}/error.log info;
    access_log {{{data_directory}}}/access.log;

    lua_shared_dict node_health 64k;
    lua_package_path "{{{lua_directory}}}/?.lua;;";

    # This unit's node-a is the stub on node.port, the other unit's on the
    # next port. Probed five times a second, so the specs are quick.
    init_by_lua_block {
        node_health = (require "node_health").new({
            dict = ngx.shared.node_health,
            local_main = "127.0.0.1:{{node.port}}",
            peer_main = "127.0.0.1:{{node.peerPort}}",
            interval = 0.2,
            timeout = 200,
        })
    }

    init_worker_by_lua_block {
        node_health:start()
    }

    upstream blot_blogs_node {
        server 127.0.0.1:{{node.port}} max_fails=0;
        server 127.0.0.1:{{node.peerPort}} backup max_fails=0;
    }

    upstream blot_blogs_node_peer {
        server 127.0.0.1:{{node.peerPort}} max_fails=0;
        server 127.0.0.1:{{node.port}} backup max_fails=0;
    }

    server {
        listen {{openresty.port}} default_server;

        location = /health {
            return 200;
        }

        location / {
            set_by_lua_block $upstream_server {
                return node_health:pick("blot_blogs_node", "blot_blogs_node_peer")
            }
            proxy_pass http://$upstream_server;
        }
    }
}
