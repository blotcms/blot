user {{user}} {{group}};

events {
    worker_connections 1000;
}

http {
    error_log {{{data_directory}}}/error.log info;
    access_log {{{data_directory}}}/access.log;

    lua_shared_dict banned_ips 1m;
    lua_shared_dict cacher_dictionary 300k;
    lua_package_path "{{{lua_directory}}}/?.lua;;";

    # the harness (util/setup.js) waits for the cacher to start
    proxy_cache_path {{{cache_directory}}} levels=1:2 keys_zone=PROXY_CACHE:10m inactive=1y max_size=10g use_temp_path=off;

    init_by_lua_block {
        ban = require "ban"
        cacher = (require "cacher").new()
        cacher:set("cache_directory", "{{{cache_directory}}}")
        cacher:set("shared_dictionary", ngx.shared.cacher_dictionary)
    }

    init_worker_by_lua_block {
        cacher:start(ngx)
    }

    # The tests are all on loopback, so let X-Real-IP stand in for the client
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    geo $whitelist {
        default 0;
        203.0.113.50 1;
    }

    log_by_lua_block { ban:record() }
    rewrite_by_lua_block { ban:request() }

    server {
        listen {{openresty.port}} default_server;

        location = /health {
            return 200;
        }

        location = /scan {
            return 444;
        }

        location / {
            proxy_pass http://127.0.0.1:{{node.port}};
        }
    }
}
