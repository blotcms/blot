user {{user}} {{group}};

events {
    worker_connections 1000;
}

# The git smart HTTP locations of blot-site.conf, taking their settings from the
# production partial (reverse-proxy-huge-base.conf, which includes the base
# proxy settings): /clients/git/end/ for pushes and clones, and /clients for the
# test-only read route served from the store (shadow mode,
# app/clients/git/shadow/README), which falls under it.
http {
    error_log {{{data_directory}}}/error.log info;
    access_log {{{data_directory}}}/access.log;

    # The zones the partials refer to (http.conf has the production ones)
    limit_conn_zone $binary_remote_addr zone=connlimit:1m;
    limit_req_zone $binary_remote_addr zone=general:1m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=hostlimit:1m rate=100r/s;

    server {
        listen {{openresty.port}} default_server;

        location = /health {
            return 200;
        }

        location /clients/git/end/ {
            set $upstream_server 127.0.0.1:{{node.port}};
            {{> reverse-proxy-huge-base.conf}}
            client_body_timeout 60s;
            client_max_body_size 2000M;
        }

        location /clients {
            set $upstream_server 127.0.0.1:{{node.port}};
            {{> reverse-proxy-huge-base.conf}}
            client_max_body_size 1000M;
        }
    }
}
