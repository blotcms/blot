# Number of worker processes is set to the same as the number of CPUs.
# More is not useful?
worker_processes  1;

# Sets the limit of the maximum number of open files (RLIMIT_NOFILE) 
# for worker processes
worker_rlimit_nofile 10000;

events {
    worker_connections 10000;
    multi_accept on;
}

http {

    # Keep the development default for dynamic responses, but do not override
    # an explicit caching policy returned by the upstream Node app.
    map $upstream_http_cache_control $development_cache_control {
        ""      "no-cache";
        default "";
    }

    # Hide the nginx version in the server header
    server_tokens off;

    # Added to set the content-type charset header 
    # for text files served by NGINX
    charset utf-8;

    upstream blot_node {
        # Via toxiproxy so local requests pick up production-like latency
        # (see scripts/development/enable-toxiproxy-latency.sh). If the proxy
        # isn't configured (BLOT_USE_TOXIPROXY=false) connections are refused
        # and nginx falls through to node-app directly.
        server  toxiproxy:8081;
        server  node-app:8080 backup;
        keepalive 64;
    }

    # The simulated S3 (MinIO) holding the storage bucket
    upstream blot_storage_bucket {
        server minio:9000;
        keepalive 16;
    }

    # redirect all http requests to https
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }
    
    # Worktree previews (scripts/development/preview.sh): a-local.blot …
    # e-local.blot and their subdomains go to that slot's sidecar container.
    # A variable proxy_pass resolves at request time, so nginx starts fine with
    # no sidecars running (502 for a slot that is free).
    server {
        listen 443 ssl;
        server_name ~^(?:.+\.)?(?<slot>[a-e])-local\.blot$;

        ssl_certificate /etc/ssl/certs/wildcard.crt;
        ssl_certificate_key /etc/ssl/private/wildcard.key;

        resolver 127.0.0.11 valid=5s;
        error_page 500 502 503 504 /502.html;

        location = /502.html {
            internal;
            root /usr/share/nginx/html;
            default_type text/html;
            add_header Cache-Control 'no-store' always;
        }

        location / {
            set $preview_upstream blot-node-$slot;
            proxy_pass http://$preview_upstream:8080;
            proxy_http_version 1.1;
            client_max_body_size 100M;
            add_header 'Cache-Control' $development_cache_control always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }

    # The CDN host (cdn.local.blot). Blog assets (/blog_*) are fetched from the
    # storage bucket the way Bunny will fetch them from S3 in production, once
    # the CDN's origin has been pointed at the bucket (config/storage-bucket).
    # A key the bucket doesn't have (403 or 404: nothing has been backfilled
    # yet, or the file is only on disk) falls through to the app, which serves
    # it from disk as before. Everything else on this host (/template, /folder,
    # fonts, ...) goes to the app. Worktree preview slots (cdn.a-local.blot,
    # ...) are matched by the slot server above.
    server {
        listen 443 ssl;
        server_name ~^cdn\.;

        ssl_certificate /etc/ssl/certs/wildcard.crt;
        ssl_certificate_key /etc/ssl/private/wildcard.key;

        error_page 500 502 503 504 /502.html;

        location = /502.html {
            internal;
            root /usr/share/nginx/html;
            default_type text/html;
            add_header Cache-Control 'no-store' always;
        }

        location ~ ^/blog_ {
            # The bucket's name is the BLOT_STORAGE_BUCKET given to node-app
            # in docker-compose.yml. $request_uri is passed on untouched.
            proxy_pass http://blot_storage_bucket/blot-storage-dev$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header Connection "";
            proxy_intercept_errors on;
            error_page 403 404 = @cdn_app;

            # What the app's CORS middleware sent for these paths; in
            # production a Bunny edge rule adds it, as S3 doesn't.
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Cache-Control' $development_cache_control always;
        }

        location / {
            proxy_pass http://blot_node;
            proxy_http_version 1.1;
            add_header 'Cache-Control' $development_cache_control always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location @cdn_app {
            proxy_pass http://blot_node;
            proxy_http_version 1.1;
            add_header 'Cache-Control' $development_cache_control always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }

    server {
        listen 443 ssl default_server;

        ssl_certificate /etc/ssl/certs/wildcard.crt;
        ssl_certificate_key /etc/ssl/private/wildcard.key;

        error_page 500 502 503 504 /502.html;

        location = /502.html {
            internal;
            root /usr/share/nginx/html;
            default_type text/html;
            add_header Cache-Control 'no-store' always;
        }
        
        location / {
            proxy_pass http://blot_node;
            proxy_http_version 1.1;
            client_max_body_size 100M;
            add_header 'Cache-Control' $development_cache_control always;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

    }    
}
