# One preview sidecar for a git worktree. Driven by preview.sh, which sets
# SLOT, WORKTREE_ROOT and MAIN_ROOT. See worktrees.md.
name: blot-${SLOT}
services:
  node:
    image: blot
    container_name: blot-node-${SLOT}
    cpus: 0.25
    mem_limit: 768m
    labels:
      blot.worktree: ${WORKTREE_ROOT}
    env_file:
      - ${MAIN_ROOT}/.env
    environment:
      - BLOT_HOST=${SLOT}-local.blot
      # Talk to Redis directly (no toxiproxy latency) and to the shared airlock
      - BLOT_REDIS_HOST=redis
      # Not blot-container-green, so this sidecar is not master
      - CONTAINER_NAME=blot-container-${SLOT}
      # Slots build and watch SITE templates from this worktree's
      # app/templates/source. Templates live in the shared dev Redis, so
      # this overwrites what the main stack (and other slots) built.
      - BLOT_BUILD_TEMPLATES=true
      - BLOT_AIRLOCK_BROWSER_URL=http://airlock:9222
      - BLOT_AIRLOCK_PROXY_URL=http://airlock:8888
    networks:
      - default
    volumes:
      - ${MAIN_ROOT}/data:/usr/src/app/data
      - ${MAIN_ROOT}/.git:/usr/src/app/.git
      - ${WORKTREE_ROOT}/app:/usr/src/app/app
      - ${WORKTREE_ROOT}/tests:/usr/src/app/tests
      - ${WORKTREE_ROOT}/scripts:/usr/src/app/scripts
      - ${WORKTREE_ROOT}/config:/usr/src/app/config
    command: npx --node-options="--max-old-space-size=500 --trace-deprecation" nodemon /usr/src/app/app/index.js --watch /usr/src/app/app -e js,html,css --ignore /usr/src/app/app/documentation/data --ignore /usr/src/app/app/documentation/output --ignore /usr/src/app/app/views --ignore /usr/src/app/app/views-built  --ignore /usr/src/app/app/clients/*/views --ignore /usr/src/app/app/templates/folders --ignore /usr/src/app/app/templates/source

networks:
  default:
    name: blot_default
    external: true
