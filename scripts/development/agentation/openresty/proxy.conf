# Included in each proxied or cached location of the local proxy
# (proxy/config/development-proxy.conf). sub_filter can only rewrite an
# uncompressed body: with no Accept-Encoding the cached location serves its
# plain copy rather than the brotli one, and nothing is compressed on the way
# out. Node is already asked for an uncompressed one.
more_clear_input_headers Accept-Encoding;
sub_filter_once on;
sub_filter '</body>' '$agentation_script</body>';
