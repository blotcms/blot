location = /__agentation/toolbar.js {
    if ($agentation_enabled = 0) { return 404; }
    alias /srv/agentation/toolbar.js;
    default_type application/javascript;
    add_header Cache-Control 'no-store' always;
}

location ^~ /__agentation/api/ {
    if ($agentation_enabled = 0) { return 404; }
    # Browser traffic must come from this exact origin. Only then remove Origin
    # for the internal hop; the HTTP service rejects all direct browser origins.
    set $agentation_origin $http_origin;
    if ($http_origin = "") { set $agentation_origin "$scheme://$http_host"; }
    if ($agentation_origin != "$scheme://$http_host") { return 403; }
    if ($http_sec_fetch_site = cross-site) { return 403; }
    proxy_set_header Origin "";
    proxy_set_header Host agentation:8477;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_pass http://agentation:8477/;
}
