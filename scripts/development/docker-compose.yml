name: blot
services:
  node-app:
    image: blot
    # even though the os.cpu stats don't reflect this, it does seem capable
    # of throttling the performance of the node.js service, somehow! 
    # useful to simulate real-life server resources
    cpus: 0.75
    build:
      context: ../../
      dockerfile: Dockerfile
      target: dev   # This line specifies which stage to build
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      airlock:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      - BLOT_HOST=${BLOT_HOST}
      - BLOT_REDIS_HOST=${BLOT_REDIS_HOST:-toxiproxy}
      - CONTAINER_NAME=blot-container-green
      - DEBUG=${DEBUG:-}
      # Route bookmark screenshots and remote-image downloads through the
      # egress-filtered airlock container. Comment these two out to have the
      # app hit the network directly (no SSRF protection).
      - BLOT_AIRLOCK_BROWSER_URL=http://airlock:9222
      - BLOT_AIRLOCK_PROXY_URL=http://airlock:8888
    volumes:
      - ../../data:/usr/src/app/data
      - ../../.git:/usr/src/app/.git
      - ../../app:/usr/src/app/app
      - ../../tests:/usr/src/app/tests
      - ../../notes:/usr/src/app/notes
      - ../../scripts:/usr/src/app/scripts
      - ../../TODO:/usr/src/app/TODO
      - ../../config:/usr/src/app/config
    command: npx --node-options="--max-old-space-size=750 --trace-deprecation" nodemon /usr/src/app/app/index.js --watch /usr/src/app/app -e js,html,css --ignore /usr/src/app/app/documentation/data --ignore /usr/src/app/app/documentation/output --ignore /usr/src/app/app/views --ignore /usr/src/app/app/views-built  --ignore /usr/src/app/app/clients/*/views --ignore /usr/src/app/app/templates/folders --ignore /usr/src/app/app/templates/source

  redis:
    image: "redis:6.2.12-alpine"
    ports:
      - "6379:6379" # Expose Redis port 6379 to host so we can run scripts if needed
    volumes:
      - "../../data/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 15s

  toxiproxy:
    build:
      context: ./toxiproxy
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    ports:
      - "8474:8474"
    expose:
      - "26379"

  # Single egress boundary for fetching untrusted, user-supplied URLs
  # (bookmark screenshots, remote images in posts). See config/airlock.
  airlock:
    build:
      context: ../../config/airlock
      dockerfile: Dockerfile
    # entrypoint.sh exits non-zero (fail closed) if any of its services go
    # down, relying on the restart policy to bring it back - matches
    # --restart unless-stopped in the production docker run (see README.md).
    restart: unless-stopped
    # Needed so the entrypoint can install the nftables egress filter.
    cap_add:
      - NET_ADMIN
    expose:
      - "9222"
      - "8888"

  nginx:
    build:
      context: ../../config/openresty
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../config/openresty/development_server.conf:/etc/nginx/nginx.conf:ro
      - ../../config/openresty/init.sh:/etc/nginx/init.sh:ro
      - ../../data/ssl:/etc/ssl:ro
    depends_on:
      - node-app
    command: /bin/sh -c "sh /etc/nginx/init.sh"
