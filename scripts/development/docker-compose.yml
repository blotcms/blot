# The versions come from config/versions.env: start.sh and the other scripts that
# run this file export it first (set -a; . config/versions.env; set +a).
name: blot
services:
  node-app:
    image: blot
    # even though the os.cpu stats don't reflect this, it does seem capable
    # of throttling the performance of the node.js service, somehow!
    # useful to simulate real-life server resources
    cpus: 0.75
    # Matches production's site-server profile (BLUE/GREEN in
    # scripts/deploy/constants.js) by default. Override both to simulate the
    # blog-server profile (YELLOW) instead:
    #   BLOT_CONTAINER_MEMORY=1878m BLOT_MAX_OLD_SPACE_SIZE=1500 npm start
    mem_limit: ${BLOT_CONTAINER_MEMORY:-1365m}
    build:
      context: ../../
      dockerfile: Dockerfile
      target: dev   # This line specifies which stage to build
      args:
        NODE_BASE: ${NODE_BASE:?run via scripts/development/start.sh, or export config/versions.env first}
        PANDOC_VERSION: ${PANDOC_VERSION:?}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    env_file:
      - ../../.env
    environment:
      - BLOT_HOST=${BLOT_HOST}
      - BLOT_REDIS_HOST=${BLOT_REDIS_HOST:-redis}
      - CONTAINER_NAME=blot-container-green
      - DEBUG=${DEBUG:-}
      # Survives nodemon restarts, so each one recompiles only what changed
      - NODE_COMPILE_CACHE=/tmp/node-compile-cache
      # Generated assets live only in this simulated S3 (MinIO, below), as in
      # production; the app won't start without a bucket. The credentials are
      # MinIO's development root user, set below.
      - BLOT_STORAGE_BUCKET=blot-storage-dev
      - BLOT_STORAGE_ENDPOINT=http://minio:9000
      - BLOT_AWS_KEY=blot-dev
      - BLOT_AWS_SECRET=blot-dev-secret
    volumes:
      - ../../data:/usr/src/app/data
      - ../../.git:/usr/src/app/.git
      - ../../app:/usr/src/app/app
      - ../../tests:/usr/src/app/tests
      - ../../notes:/usr/src/app/notes
      - ../../scripts:/usr/src/app/scripts
      - ../../TODO:/usr/src/app/TODO
      - ../../config:/usr/src/app/config
    command: npx --node-options="--max-old-space-size=${BLOT_MAX_OLD_SPACE_SIZE:-750} --trace-deprecation --require /usr/src/app/scripts/development/fake-dropbox-errors.js --require /usr/src/app/scripts/development/fake-google-drive-errors.js" nodemon /usr/src/app/app/index.js --watch /usr/src/app/app -e js,html,css --ignore /usr/src/app/app/documentation/data --ignore /usr/src/app/app/documentation/output --ignore /usr/src/app/app/views --ignore /usr/src/app/app/views-built  --ignore /usr/src/app/app/clients/*/views --ignore /usr/src/app/app/templates/folders --ignore /usr/src/app/app/templates/source --ignore "**/tests/**"

  redis:
    image: "redis:${REDIS_VERSION:?}-alpine"
    ports:
      - "6379:6379" # Expose Redis port 6379 to host so we can run scripts if needed
    volumes:
      - "../../data/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 15s

  # A simulated S3 for the generated assets (config.storage). MinIO no longer
  # publishes images itself; this is a pinned build of the upstream release.
  # The console is at http://localhost:9001 (blot-dev / blot-dev-secret).
  minio:
    image: ${MINIO_IMAGE:?}
    # the image's own user can't write to the bind mount
    user: root
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=blot-dev
      - MINIO_ROOT_PASSWORD=blot-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "../../data/minio:/data"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 15s

  # One-shot: creates the bucket and allows anonymous downloads of blog_*
  # keys, as the production bucket does (see minio/init.sh)
  minio-init:
    image: amazon/aws-cli:2.37.12
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=blot-dev
      - AWS_SECRET_ACCESS_KEY=blot-dev-secret
      - AWS_DEFAULT_REGION=us-west-2
      - AWS_ENDPOINT_URL=http://minio:9000
      - BLOT_STORAGE_BUCKET=blot-storage-dev
    volumes:
      - ./minio:/minio:ro
    entrypoint: ["/bin/sh", "/minio/init.sh"]
    restart: "no"

  toxiproxy:
    build:
      context: ./toxiproxy
      dockerfile: Dockerfile
      args:
        TOXIPROXY_VERSION: ${TOXIPROXY_VERSION:?}
    depends_on:
      redis:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    ports:
      - "8474:8474"
    expose:
      - "26379"
      - "8081"

  nginx:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/development_server.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/init.sh:/etc/nginx/init.sh:ro
      - ../../data/ssl:/etc/ssl:ro
    depends_on:
      - node-app
      - toxiproxy
      # the cdn host proxies /blog_* to it
      - minio
    command: /bin/sh -c "sh /etc/nginx/init.sh"
