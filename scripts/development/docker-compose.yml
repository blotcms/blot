name: blot
services:
  node-app:
    image: blot
    # even though the os.cpu stats don't reflect this, it does seem capable
    # of throttling the performance of the node.js service, somehow!
    # useful to simulate real-life server resources
    cpus: 0.75
    # Matches production's site-server profile (BLUE/GREEN in
    # scripts/deploy/constants.js) by default. Override both to simulate the
    # blog-server profile (YELLOW) instead:
    #   BLOT_CONTAINER_MEMORY=1878m BLOT_MAX_OLD_SPACE_SIZE=1500 npm start
    mem_limit: ${BLOT_CONTAINER_MEMORY:-1365m}
    build:
      context: ../../
      dockerfile: Dockerfile
      target: dev   # This line specifies which stage to build
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      airlock:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - ../../.env
    environment:
      - BLOT_HOST=${BLOT_HOST}
      - BLOT_REDIS_HOST=${BLOT_REDIS_HOST:-redis}
      - CONTAINER_NAME=blot-container-green
      - DEBUG=${DEBUG:-}
      # Route bookmark screenshots and remote-image downloads through the
      # egress-filtered airlock container. Comment these two out to have the
      # app hit the network directly (no SSRF protection).
      - BLOT_AIRLOCK_BROWSER_URL=http://airlock:9222
      - BLOT_AIRLOCK_PROXY_URL=http://airlock:8888
      # Generated assets live only in this simulated S3 (MinIO, below), as in
      # production; the app won't start without a bucket. The credentials are
      # MinIO's development root user, set below.
      - BLOT_ASSETS_BUCKET=blot-assets-dev
      - BLOT_ASSETS_ENDPOINT=http://minio:9000
      - BLOT_AWS_KEY=blot-dev
      - BLOT_AWS_SECRET=blot-dev-secret
    volumes:
      - ../../data:/usr/src/app/data
      - ../../.git:/usr/src/app/.git
      - ../../app:/usr/src/app/app
      - ../../tests:/usr/src/app/tests
      - ../../notes:/usr/src/app/notes
      - ../../scripts:/usr/src/app/scripts
      - ../../TODO:/usr/src/app/TODO
      - ../../config:/usr/src/app/config
    command: npx --node-options="--max-old-space-size=${BLOT_MAX_OLD_SPACE_SIZE:-750} --trace-deprecation --require /usr/src/app/scripts/development/fake-dropbox-errors.js --require /usr/src/app/scripts/development/fake-google-drive-errors.js" nodemon /usr/src/app/app/index.js --watch /usr/src/app/app -e js,html,css --ignore /usr/src/app/app/documentation/data --ignore /usr/src/app/app/documentation/output --ignore /usr/src/app/app/views --ignore /usr/src/app/app/views-built  --ignore /usr/src/app/app/clients/*/views --ignore /usr/src/app/app/templates/folders --ignore /usr/src/app/app/templates/source

  redis:
    image: "redis:6.2.12-alpine"
    ports:
      - "6379:6379" # Expose Redis port 6379 to host so we can run scripts if needed
    volumes:
      - "../../data/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 15s

  # A simulated S3 for the generated assets (config.assets). MinIO no longer
  # publishes images itself; this is a pinned build of the upstream release.
  # The console is at http://localhost:9001 (blot-dev / blot-dev-secret).
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
    # the image's own user can't write to the bind mount
    user: root
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=blot-dev
      - MINIO_ROOT_PASSWORD=blot-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "../../data/minio:/data"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 15s

  # One-shot: creates the bucket and allows anonymous downloads of blog_*
  # keys, as the production bucket does (see minio/init.sh)
  minio-init:
    image: amazon/aws-cli:2.37.12
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=blot-dev
      - AWS_SECRET_ACCESS_KEY=blot-dev-secret
      - AWS_DEFAULT_REGION=us-west-2
      - AWS_ENDPOINT_URL=http://minio:9000
      - BLOT_ASSETS_BUCKET=blot-assets-dev
    volumes:
      - ./minio:/minio:ro
    entrypoint: ["/bin/sh", "/minio/init.sh"]
    restart: "no"

  toxiproxy:
    build:
      context: ./toxiproxy
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    ports:
      - "8474:8474"
    expose:
      - "26379"
      - "8081"

  # Single egress boundary for fetching untrusted, user-supplied URLs
  # (bookmark screenshots, remote images in posts). See config/airlock.
  airlock:
    build:
      context: ../../config/airlock
      dockerfile: Dockerfile
    # entrypoint.sh exits non-zero (fail closed) if any of its services go
    # down, relying on the restart policy to bring it back - matches
    # --restart unless-stopped in the production docker run (see README.md).
    restart: unless-stopped
    # Needed so the entrypoint can install the nftables egress filter.
    cap_add:
      - NET_ADMIN
    expose:
      - "9222"
      - "8888"

  nginx:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/development_server.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/init.sh:/etc/nginx/init.sh:ro
      - ../../data/ssl:/etc/ssl:ro
    depends_on:
      - node-app
      - toxiproxy
      # the cdn host proxies /blog_* to it
      - minio
    command: /bin/sh -c "sh /etc/nginx/init.sh"
