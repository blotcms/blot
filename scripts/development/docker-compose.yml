# The versions come from config/versions.env: start.sh and the other scripts that
# run this file export it first (set -a; . config/versions.env; set +a).
name: blot
services:
  # A unit, as production runs blot-blue and blot-green: OpenResty with the
  # production proxy config on :80 and :443, node-a (under nodemon) and the
  # node-b it forks, built from the bind-mounted source by unit/start.sh. One
  # unit only, so the other unit's sockets, the upstreams' backups, are absent.
  node-app:
    image: blot
    # even though the os.cpu stats don't reflect this, it does seem capable
    # of throttling the performance of the node.js service, somehow!
    # useful to simulate real-life server resources
    cpus: 0.75
    # Matches production's site-server profile (BLUE/GREEN in
    # scripts/deploy/constants.js) by default. Override both to simulate the
    # blog-server profile (YELLOW) instead:
    #   BLOT_CONTAINER_MEMORY=1878m BLOT_MAX_OLD_SPACE_SIZE=1500 npm start
    mem_limit: ${BLOT_CONTAINER_MEMORY:-1365m}
    build:
      context: ../../
      dockerfile: config/docker/Dockerfile
      target: dev-unit
      args:
        NODE_BASE: ${NODE_BASE:?run via scripts/development/start.sh, or export config/versions.env first}
        PANDOC_VERSION: ${PANDOC_VERSION:?}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    env_file:
      - ../../.env
    environment:
      - BLOT_HOST=${BLOT_HOST}
      - BLOT_REDIS_HOST=${BLOT_REDIS_HOST:-redis}
      - BLOT_UNIT=blue
      # A unit's node-a serves on its socket only; this keeps :8080 for
      # toxiproxy (below) and for scripts that call Node directly
      - BLOT_PORT=8080
      # The proxy's purge listener, as in production, so Node empties its
      # disk cache when a blog or the site changes
      - BLOT_REVERSE_PROXY_URLS=http://127.0.0.1:80
      - DEBUG=${DEBUG:-}
      # Survives nodemon restarts, so each one recompiles only what changed
      - NODE_COMPILE_CACHE=/tmp/node-compile-cache
      # unit/node.sh gives Node this heap
      - BLOT_MAX_OLD_SPACE_SIZE=${BLOT_MAX_OLD_SPACE_SIZE:-750}
      # Generated assets live only in this simulated S3 (MinIO, below), as in
      # production; the app won't start without a bucket. The credentials are
      # MinIO's development root user, set below.
      - BLOT_STORAGE_BUCKET=blot-storage-dev
      - BLOT_STORAGE_ENDPOINT=http://minio:9000
      - BLOT_AWS_KEY=blot-dev
      - BLOT_AWS_SECRET=blot-dev-secret
      # The proxy (proxy/README.md, "Runtime settings"). Docker's DNS, for
      # the redis, minio and preview sidecar names.
      - PROXY_REDIS_HOST=redis
      - PROXY_RESOLVER=127.0.0.11 ipv6=off
      - PROXY_FETCH_CDN_IPS=false
      # Blogs and the dashboard go through toxiproxy for production-like
      # latency (enable-toxiproxy-latency.sh). The upstreams' backup, normally
      # the other unit, is node-a's own socket, so with toxiproxy refusing
      # connections (BLOT_USE_TOXIPROXY=false) they go straight to Node.
      - PROXY_UNIT_MAIN=toxiproxy:8081
      - PROXY_PEER_MAIN=unix:/run/blot/blue-a.sock
    volumes:
      - ../../data:/usr/src/app/data
      - ../../.git:/usr/src/app/.git
      - ../../app:/usr/src/app/app
      - ../../tests:/usr/src/app/tests
      - ../../notes:/usr/src/app/notes
      - ../../scripts:/usr/src/app/scripts
      - ../../TODO:/usr/src/app/TODO
      - ../../config:/usr/src/app/config
      - ../../proxy:/usr/src/app/proxy
      # The mkcert certificate from setup-certs.sh, where the proxy looks for
      # production's wildcard certificate
      - ../../data/ssl/certs/wildcard.crt:/etc/ssl/private/letsencrypt-domain.pem:ro
      - ../../data/ssl/private/wildcard.key:/etc/ssl/private/letsencrypt-domain.key:ro
      # Filled by agentation/run.sh; see proxy/config/development.conf
      - ./agentation/generated/openresty:/etc/openresty/development:ro
      - ./agentation/generated/dist:/srv/agentation:ro
    healthcheck:
      test: ["CMD", "sh", "/usr/src/app/proxy/unit/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      start_interval: 2s
      retries: 3

  redis:
    image: "redis:${REDIS_VERSION:?}-alpine"
    ports:
      - "6379:6379" # Expose Redis port 6379 to host so we can run scripts if needed
    volumes:
      - "../../data/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 15s

  # A simulated S3 for the generated assets (config.storage). MinIO no longer
  # publishes images itself; this is a pinned build of the upstream release.
  # The console is at http://localhost:9001 (blot-dev / blot-dev-secret).
  minio:
    image: ${MINIO_IMAGE:?}
    # the image's own user can't write to the bind mount
    user: root
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=blot-dev
      - MINIO_ROOT_PASSWORD=blot-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "../../data/minio:/data"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 15s

  # One-shot: creates the bucket and allows anonymous downloads of blog_*
  # keys, as the production bucket does (see minio/init.sh)
  minio-init:
    image: amazon/aws-cli:2.37.12
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=blot-dev
      - AWS_SECRET_ACCESS_KEY=blot-dev-secret
      - AWS_DEFAULT_REGION=us-west-2
      - AWS_ENDPOINT_URL=http://minio:9000
      - BLOT_STORAGE_BUCKET=blot-storage-dev
    volumes:
      - ./minio:/minio:ro
    entrypoint: ["/bin/sh", "/minio/init.sh"]
    restart: "no"

  toxiproxy:
    build:
      context: ./toxiproxy
      dockerfile: Dockerfile
      args:
        TOXIPROXY_VERSION: ${TOXIPROXY_VERSION:?}
    depends_on:
      redis:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    ports:
      - "8474:8474"
    expose:
      - "26379"
      - "8081"
