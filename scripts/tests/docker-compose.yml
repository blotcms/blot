name: blot-tests
services:

  test-redis:
    image: "redis:alpine"
    command: sh -c "rm -f /data/dump.rdb && redis-server"
      
  test-postgres:
    image: "postgres:${POSTGRES_VERSION:?export config/versions.env first}-alpine"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=blot_test

  tests:
    build:
      context: ../../
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_BASE: ${NODE_BASE:?export config/versions.env first}
        PANDOC_VERSION: ${PANDOC_VERSION:?}
    depends_on:
      - test-redis
      - test-postgres
    env_file:
      - test.env
    environment:
      - TEST_PATH=${TEST_PATH}
      - TEST_SEED=${TEST_SEED}
      - BLOT_REDIS_HOST=test-redis
      - BLOT_POSTGRES_URL=postgres://postgres@test-postgres:5432/blot_test
      - BLOT_HOST=localhost
    volumes:
      - ../../app:/usr/src/app/app
      - ../../tests:/usr/src/app/tests
      - ../../config:/usr/src/app/config
    command: >
      sh -c "rm -rf /usr/src/app/data && mkdir /usr/src/app/data && node -v && npm -v && nyc --include $TEST_PATH node tests $TEST_PATH $TEST_SEED"