<a class="global-sync is-{{globalSync.state}} {{globalSync.progressClass}}" href="{{{globalSync.url}}}" title="{{globalSync.title}}" data-state="{{globalSync.state}}" data-sync-status-url="{{{dashboardBase}}}/status" data-sync-summary-url="{{{dashboardBase}}}/sync-status" style="{{globalSync.progressStyle}}">
  <span class="global-sync__text" aria-live="polite"><span class="global-sync__label">{{globalSync.text}}</span><span class="global-sync__count">{{globalSync.count}}</span></span>
  <span class="global-sync__icon" aria-hidden="true"></span>
</a>
