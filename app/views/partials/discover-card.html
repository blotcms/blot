<li class="discover-card">
  <a href="{{{url}}}" target="_blank" rel="noopener">
    {{#photos.length}}
    <span class="discover-photos discover-photos-{{photos.length}}">
      {{#photos}}
      <img
        src="{{{src}}}"
        width="{{width}}"
        height="{{height}}"
        alt=""
        loading="lazy"
        decoding="async"
      />
      {{/photos}}
    </span>
    {{/photos.length}}
    {{^photos.length}}
    <span class="discover-excerpt">{{excerpt}}</span>
    {{/photos.length}}
    <span class="discover-title">{{title}}</span>
    <span class="discover-site">{{site.label}}</span>
  </a>
</li>
