<div class="documentation-layout">
  <aside class="documentation-sidebar">
    <!-- The section's title, in the type of the wide pages' titles
         (css/blot.css, .wide-page h1), above its links -->
    <a class="documentation-title" href="/how">Documentation</a>
    <nav aria-label="Documentation">
      {{> links}}
    </nav>
    {{#show-toc-or-on-this-page}}
    <nav id="toc-wrapper" aria-labelledby="documentation-toc-heading">
      <h2 id="documentation-toc-heading">On this page</h2>
      <div id="toc"></div>
    </nav>
    {{/show-toc-or-on-this-page}}
  </aside>

  <main id="main" tabindex="-1" class="documentation-article main-section-content {{#show-toc-or-on-this-page}}js-toc-content{{/show-toc-or-on-this-page}}">
    {{> body}}
  </main>

  {{> footer}}
</div>
