<!-- Above the hairline, on the left gutter: the dashboard's breadcrumb
     trail (css/trail.css, from documentation/selected.js), on every page,
     /how's being "Documentation" alone. The row has a fixed height, so the
     hairline sits at the same height on every page. -->
<div class="documentation-top">
  {{#breadcrumbs.length}}
  <nav class="trail documentation-trail" aria-label="Breadcrumb">
    <ol>
      {{#breadcrumbs}}
      {{^last}}<li><a href="{{{url}}}">{{label}}</a></li>{{/last}}
      {{#last}}<li aria-current="page"><span class="truncate">{{label}}</span></li>{{/last}}
      {{/breadcrumbs}}
    </ol>
  </nav>
  {{/breadcrumbs.length}}
</div>

<div class="documentation-layout">
  <aside class="documentation-sidebar">
    <nav aria-label="Documentation">
      {{> links}}
    </nav>
    {{#show-toc-or-on-this-page}}
    <nav id="toc-wrapper" aria-labelledby="documentation-toc-heading">
      <h2 id="documentation-toc-heading">On this page</h2>
      <div id="toc"></div>
    </nav>
    {{/show-toc-or-on-this-page}}
  </aside>

  <main id="main" tabindex="-1" class="documentation-article main-section-content {{#show-toc-or-on-this-page}}js-toc-content{{/show-toc-or-on-this-page}}">
    {{> body}}
  </main>

  {{> footer}}
</div>
