<aside class="{{siteDashboardSidebarClass}}" aria-label="Site dashboard" data-dashboard-sidebar>
  {{> sidebar-site}}

  <nav class="dashboard-sidebar__nav dashboard-sidebar__nav--desktop" aria-label="Site navigation">
{{> site-dashboard-nav-links}}
  </nav>

  <!-- Phones: the site block above (with the section name) and a Menu
       disclosure replace the sidebar -->
  <details class="dashboard-sidebar__menu" data-dismissable>
    <summary>Menu</summary>
    <nav class="dashboard-sidebar__menu-panel" aria-label="Site menu">
{{> site-dashboard-nav-links}}
    </nav>
  </details>
  {{> dashboard-sidebar-resize-handle}}
</aside>
