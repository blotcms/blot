<h1>Fonts</h1>

<p>You can pick any of these fonts using the web template editor on your dashboard. If you are comfortable editing the source code of your template, you can install any font you like.</p>

<style type="text/css">
    #font-list {max-width: 700px;}

    #font-list > div {
    border-top: 1px solid var(--border-color);}
    
    /* The specimen is a mask over a block of the text color, so the font's
       name follows the theme, which an <img> of the SVG would not */
    #font-list .font-specimen {
        height: 3em;
        background: var(--text-color);
        -webkit-mask: var(--specimen) left center / contain no-repeat;
        mask: var(--specimen) left center / contain no-repeat;
    }
</style>
<br><br>
<div id="font-list">
{{#fonts}}
{{#specimenURL}}
<div style="margin-bottom:1em;padding-bottom:1em">
    <div style="max-width: 600px;overflow: hidden;"><div class="font-specimen" role="img" aria-label="{{name}}" style="--specimen: url('{{{specimenURL}}}'); width: calc(3em * {{specimenWidth}} / {{specimenHeight}})"></div></div>
    <div style="margin-top:-0.5em; var(--small-font-size);color:var(--light-text-color)">{{name}}</div> 
</div>
{{/specimenURL}}
    {{/fonts}}
</div>
