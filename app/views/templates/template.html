{{#template}}
{{> preview-header}}

<div class="template-folder-wrapper">
    <a href="{{#cdn}}{{{zip}}}{{/cdn}}" target="_blank" class="template-button">
        <span class="icon-download"></span>&thinsp;
        Download folder
    </a>

    <pre class="folder folder-preview" title="{{name}}"><code>{{folder_preview}}</code></pre>
</div>

{{#README}}
<div class="template-readme">
{{{README}}}
</div>
{{/README}}

{{/template}}
