<h1>Discover</h1>

{{#discover}}
<div class="discover">
  <div class="discover-main">
    {{^posts.length}}
    <p>Nothing here yet.</p>
    {{/posts.length}}

    <ul class="discover-grid" id="discover-grid">
      {{#posts}}{{> discover-card}}{{/posts}}
    </ul>

    {{#next}}
    <a class="discover-more" id="discover-more" href="{{{next}}}">More posts</a>
    {{/next}}
  </div>

  {{#sites.length}}
  <aside class="discover-sidebar">
    <h2>Sites</h2>
    <ul id="featured" class="clients">
      {{#sites}}
      <li>
        <a target="_blank" rel="noopener" href="{{{link}}}">
          <img
            class="pic"
            src="{{#cdn}}{{{image}}}{{/cdn}}"
            alt="{{name}}"
            width="{{discover.image_size}}"
            height="{{discover.image_size}}"
          />
          <span style="flex-grow: 1;">
            <span class="color-on-hover" style="color:var(--accent-color)">{{name}}</span>
            <span style="font-size: var(--small-font-size);color:var(--medium-text-color);display:block">{{bio}}</span>
          </span>
        </a>
      </li>
      {{/sites}}
    </ul>
  </aside>
  {{/sites.length}}
</div>
{{/discover}}
