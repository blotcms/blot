
{{> message}}

<div class="dashboard-form-panel">
    <div class="dashboard-form-panel__body">
<header class="page-header">
  <div class="page-header__text">
    <h1 class="page-header__title">Title</h1>
  </div>
</header>
<form class="dashboard-form" method="POST">
    <div>
    <input type="hidden" name="_csrf" value="{{csrftoken}}" />
    <label for="site-title">Title</label>
    <input type="text" id="site-title" name="title" value="{{blog.title}}" autofocus placeholder="Title" />

    <div class="buttons" data-on-change>
        <button type="submit">
            Save title
        </button>
        <a href="{{{base}}}/settings/title" data-cancel>Cancel</a>
    </div>
    </div>
</form>
</div>
</div>
