<header class="site-dashboard-header">
  <div class="site-dashboard-identity">
    <div class="site-dashboard-title-row">
      <a class="site-dashboard-title" href="{{{dashboardBase}}}/settings/title">
        {{#blog.title}}{{blog.title}}{{/blog.title}}
        {{^blog.title}}Add a title{{/blog.title}}
      </a>
      {{#blog.title}}<a class="site-dashboard-edit" href="{{{dashboardBase}}}/settings/title">Edit</a>{{/blog.title}}
    </div>
    <div class="site-dashboard-domain-row">
      <span class="template-live-dot" aria-hidden="true"></span>
      <span class="site-dashboard-domain">{{blog.pretty.url}}</span>
      <a class="site-dashboard-edit" href="{{{dashboardBase}}}/settings/domain/custom">Edit</a>
    </div>
  </div>

  {{^isFilesView}}{{^isPostsView}}{{^isRecentView}}
  <nav class="site-dashboard-links" aria-label="Site actions">
    <a target="_blank" href="https://{{{blog.pretty.url}}}" class="panel-link visit-site">Visit site</a>
    <a href="{{{dashboardBase}}}/settings" class="panel-link">Settings</a>
    <a href="{{{dashboardBase}}}/template/{{template.slug}}" class="panel-link">Edit template</a>
  </nav>
  {{/isRecentView}}{{/isPostsView}}{{/isFilesView}}
</header>
