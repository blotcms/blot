<header class="site-dashboard-header">
  <div class="site-dashboard-identity">
    <div class="site-dashboard-title-row">
      <a class="site-dashboard-title" href="{{{dashboardBase}}}/settings/title">
        {{#blog.title}}{{blog.title}}{{/blog.title}}
        {{^blog.title}}Add a title{{/blog.title}}
      </a>
      {{#blog.title}}<a class="site-dashboard-edit" href="{{{dashboardBase}}}/settings/title">Edit</a>{{/blog.title}}
    </div>
    <div class="site-dashboard-domain-row">
      <svg class="site-dashboard-domain-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12"><path d="m8.533.133 5.25 1.68A1.75 1.75 0 0 1 15 3.48V7c0 1.566-.32 3.182-1.303 4.682-.983 1.498-2.585 2.813-5.032 3.855a1.697 1.697 0 0 1-1.33 0c-2.447-1.042-4.049-2.357-5.032-3.855C1.32 10.182 1 8.566 1 7V3.48a1.75 1.75 0 0 1 1.217-1.667l5.25-1.68a1.748 1.748 0 0 1 1.066 0Zm-.61 1.429.001.001-5.25 1.68a.251.251 0 0 0-.174.237V7c0 1.36.275 2.666 1.057 3.859.784 1.194 2.121 2.342 4.366 3.298a.196.196 0 0 0 .154 0c2.245-.957 3.582-2.103 4.366-3.297C13.225 9.666 13.5 8.358 13.5 7V3.48a.25.25 0 0 0-.174-.238l-5.25-1.68a.25.25 0 0 0-.153 0ZM9.5 6.5c0 .536-.286 1.032-.75 1.3v2.45a.75.75 0 0 1-1.5 0V7.8A1.5 1.5 0 1 1 9.5 6.5Z"></path></svg>
      <span class="site-dashboard-domain">{{blog.pretty.url}}</span>
      <a class="site-dashboard-edit" href="{{{dashboardBase}}}/settings/domain/custom">Edit</a>
    </div>
    {{#blog.client}}
    <div class="site-dashboard-sync-row">
      <div class="status-link site-dashboard-status" data-sync-source="{{client.display_name}}">
        {{> sync-status}}
      </div>
      <a href="{{{dashboardBase}}}/settings/folder" class="site-dashboard-sync-edit">Edit</a>
    </div>
    {{/blog.client}}
  </div>

  <nav class="site-dashboard-links" aria-label="Site actions">
    <a href="{{{dashboardBase}}}/settings" class="panel-link">Settings</a>
    <a href="{{{dashboardBase}}}/template/{{template.slug}}" class="panel-link">
      Edit template
    </a>
    <a target="_blank" href="https://{{{blog.pretty.url}}}" class="panel-link visit-site">
      <span>Visit site</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"><path d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l2.97-2.97H3.75a.75.75 0 0 1 0-1.5h7.44L8.22 4.03a.75.75 0 0 1 0-1.06Z"></path></svg>
    </a>
  </nav>
</header>
