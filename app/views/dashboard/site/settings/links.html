{{/categories.Links}}


</form>
<br>
<form method='post' class="dashboard-form" enctype='multipart/form-data' style="max-width: 540px;padding:0;margin:0">

    <input type="hidden" name="_csrf" value="{{csrftoken}}" />


    <h2>Link format</h2>
    
{{#permalinkFormats}}
<label class="format" style="border-bottom: 1px solid #eeeeec;line-height:inherit;margin:0;text-transform:none;font-size:16px;letter-spacing:0;padding:9px 0 9px 10px">
  <input style="margin:5px 10px 20px 0;float:left" type="radio" name="format" value="{{value}}" {{checked}}>
  
  <b style="font-weight:500;display:block;cursor: pointer;color:var(--text-color)">{{name}}</b>


  {{^custom}}<span style="background:none;font-size:14px;color:rgb(153, 153, 153)">{{example}}</span>{{/custom}}

  {{#custom}}
  <div style="margin: 4px 20px 4px 24px">
    <input type="text" style="margin:0" name="custom" value="{{blog.permalink.custom}}"/>
  </div>

  <div class="buttons" style="display: none;padding:0 24px">
	  <button type="submit">
		Save changes
  	</button>
	  <a href="{{{base}}}">Cancel</a>
  </div>
  {{/custom}}
  
  <div class="clear"></div>
</label>
{{/permalinkFormats}}

<noscript>

<div class="buttons">
	<button type="submit">
		Save changes
	</button>
	<a href="{{{base}}}">Cancel</a>
</div>
</noscript>

</form>
