{{> message}}
{{> settings-tabs}}

<!-- The site's addresses: the link format of its posts, and redirects -->
<div class="dashboard-form-panel settings-page">
  <div class="dashboard-form-panel__body">
    <form method="post" class="dashboard-form settings-section" action="{{{dashboardBase}}}/settings/urls" enctype="multipart/form-data">
      <input type="hidden" name="_csrf" value="{{csrftoken}}">
      <h2>Post links</h2>
      <p class="setting-note">Choose the URL format Blot uses for your posts.</p>
      {{#permalinkFormats}}
      <label class="format">
        <input type="radio" name="format" value="{{value}}" {{checked}}>
        <b>{{name}}</b>
        {{^custom}}<span class="format-example">{{example}}</span>{{/custom}}
        {{#custom}}
        <div class="format-custom" style="{{customStyle}}">
          <input type="text" name="custom" value="{{blog.permalink.custom}}">
        </div>
        <div class="buttons" style="{{customStyle}}">
          <button type="submit">Save changes</button>
          <a href="{{{base}}}/settings/urls">Cancel</a>
        </div>
        {{/custom}}
        <div class="clear"></div>
      </label>
      {{/permalinkFormats}}
      <noscript>
        <style>.format-custom { display: block !important; }</style>
        <div class="buttons">
          <button type="submit">Save changes</button>
          <a href="{{{base}}}/settings/urls">Cancel</a>
        </div>
      </noscript>
    </form>

    <h2 id="redirect-rows-heading">Redirects</h2>
    <form method="post" aria-labelledby="redirect-rows-heading" class="dashboard-form settings-section" action="{{{base}}}" enctype="multipart/form-data">
      <input type="hidden" name="_csrf" value="{{csrftoken}}">
      {{> redirect-fields}}
    </form>
  </div>
</div>
