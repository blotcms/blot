{{> form-header}}

<header class="page-header">
  <div class="page-header__text">
    <h1 class="page-header__title">Bulk editor</h1>
    <p class="page-header__subtitle">One redirect per line: the old path, a space, then the new path, e.g. <code>/old-post /new-post</code></p>
  </div>
</header>

<input type="hidden" name="redirect" value="{{{base}}}/settings/redirects" />
<input type="hidden" name="has_redirects" value="true" />

<label for="bulk_redirects">Redirects</label>
<textarea
id="bulk_redirects"
class="redirects-bulk"
name="redirects"
placeholder="/old-post /new-post"
>{{#redirects}}{{ from }} {{ to }}&#10;{{/redirects}}</textarea
>

<p class="redirects-bulk-note">Saving replaces all of your redirects with the lines above, so a redirect you delete here is removed from your site.</p>

{{> form-footer}}
