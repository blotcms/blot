<div class="line plugins" >
    <span class="center">
      {{#plugins}}
      <div class="plugin {{checked}}">
        <label class="setting-check">
          <span>
            <input name='plugins.{{id}}.enabled' type='hidden' value='off' >
            <input name='plugins.{{id}}.enabled' type="checkbox" {{checked}}/>
            &nbsp;
          </span>
          <span class="setting-check__text">{{{description}}}</span>
        </label>
        <div class="pluginOptions">
          {{{formHTML}}}
          {{#needsSaveButton}}
          <div class="buttons">
            <button type="submit">Save changes</button>
            <a href="">Cancel</a>
          </div>
          {{/needsSaveButton}}
        </div>
      </div>
      {{/plugins}}
    </span>
  </div>
