{{> settings-form-header}}

<header class="page-header">
  <div class="page-header__text">
    <h1 class="page-header__title">Flags</h1>
    <p class="page-header__subtitle">Toggle experimental features for this site.</p>
  </div>
</header>

<input type="hidden" name="redirect" value="{{{base}}}/settings/flags" />

{{#flags}}
<div class="flag-row">
  <label class="setting-check">
    <input type="checkbox" name="flags.{{key}}" {{#value}}checked{{/value}} />
    <span>{{label}}</span>
  </label>
  <div class="setting-help-text">
    <code>{{key}}</code>
    {{#defaultValue}}(default: on){{/defaultValue}}
    {{^defaultValue}}(default: off){{/defaultValue}}
  </div>
</div>
{{/flags}}

<div class="buttons">
  <button type="submit">Save flags</button>
  <a href="{{{base}}}/settings">Cancel</a>
</div>

{{> settings-form-footer}}
