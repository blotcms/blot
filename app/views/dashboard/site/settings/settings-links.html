{{> message}}
{{> settings-tabs}}

<div class="dashboard-form-panel settings-page">
  <div class="dashboard-form-panel__body">
    <form method="post" class="dashboard-form settings-section" action="{{{dashboardBase}}}/settings/links" enctype="multipart/form-data">
      <input type="hidden" name="_csrf" value="{{csrftoken}}">
      <h2>Post links</h2>
      <p class="setting-note">Choose the URL format Blot uses for your posts. Changes save as soon as you make them.</p>
      {{#permalinkFormats}}
      <label class="format">
        <input type="radio" name="format" value="{{value}}" {{checked}}>
        <b>{{name}}</b>
        {{^custom}}<span class="format-example">{{example}}</span>{{/custom}}
        {{#custom}}
        <div class="format-custom" style="{{customStyle}}">
          <input type="text" name="custom" value="{{blog.permalink.custom}}">
        </div>
        <div class="buttons" style="{{customStyle}}">
          <button type="submit">Save changes</button>
          <a href="{{{base}}}/settings/links">Cancel</a>
        </div>
        {{/custom}}
        <div class="clear"></div>
      </label>
      {{/permalinkFormats}}
      <noscript>
        <style>.format-custom { display: block !important; }</style>
        <div class="buttons">
          <button type="submit">Save changes</button>
          <a href="{{{base}}}/settings/links">Cancel</a>
        </div>
      </noscript>
    </form>

    <form method="post" class="dashboard-form settings-section" action="{{{base}}}" enctype="multipart/form-data">
      <input type="hidden" name="_csrf" value="{{csrftoken}}">
      <input type="hidden" name="redirect" value="{{{base}}}/settings/links">
      <h2>Link features</h2>
      <p class="setting-note">Changes save as soon as you make them.</p>
      {{#categories.Links}}{{> plugin-row}}{{/categories.Links}}
    </form>
  </div>
</div>
