<span class="sync-status {{syncStatusClass}}" data-sync-status-url="{{{dashboardBase}}}/status"{{#blog.healthIssue}} data-health="{{code}}"{{/blog.healthIssue}}>
    <span class="sync-status-icon" aria-hidden="true">
        <span class="status-synced">
            <span class="icon-small-check sync-status-check"></span>
        </span>
        <span class="status-health">
            <span class="icon-small-alert"></span>
        </span>
        <span class="status-error">
            <span class="icon-small-alert sync-status-alert"></span>
        </span>
        <span class="status-syncing">
            <span class="loading"></span>
        </span>
    </span>
    <span class="sync-status-body">
        <span class="sync-status-text" aria-live="polite">{{#blog.healthIssue}}{{label}}{{/blog.healthIssue}}{{^blog.healthIssue}}{{blog.status.message}}{{/blog.healthIssue}}</span>
        <span class="sync-status-progress">
            <span class="sync-status-progress-bar"></span>
        </span>
        <span class="sync-status-progress-label"></span>
    </span>
</span>
