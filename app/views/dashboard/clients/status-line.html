
<style type="text/css">

.label {flex-basis:30%}

@media (max-width: 600px) {
  .label {flex-basis:100%}
}
</style>


<!-- The page is the folder's settings for its client; the breadcrumbs say
     Folder, so screen readers get the heading -->
<h1 class="visually-hidden">{{client.display_name}} folder settings</h1>

<a class="line" href="{{{dashboardBase}}}/sync/switch">
  <span class="label">Syncs with</span>
  <span class="center">
    <span><img class="client-icon" alt="" width="16" height="16" src="{{#cdn}}/images/sync/{{blog.client}}.svg{{/cdn}}" />
    {{client.display_name}}
    </span>
      <span class="link">Change sync method</span>

  </span>
</a>
