<!-- The start of the folder box's top row: "Folder", like the summary
     card's labels above, then where it syncs from, a pill as wide as
     there's room for with a chevron at its end. The pill opens the sync
     settings under the row (/sync/<client>, the site's page with them open)
     and closes them again. With no folder yet, a button to connect one. -->
<span class="folder-source__label" aria-hidden="true">Folder</span>
{{#blog.client}}
{{#isSyncTab}}<a class="folder-source is-open" href="{{{dashboardBase}}}" aria-current="page">{{/isSyncTab}}{{^isSyncTab}}<a class="folder-source" href="{{{dashboardBase}}}/sync/{{blog.client}}">{{/isSyncTab}}
  <span class="visually-hidden">Folder: </span>
  <span class="folder-source__value"><img class="client-icon" alt="" width="14" height="14" src="{{#cdn}}/images/sync/{{blog.client}}.svg{{/cdn}}"> {{client.display_name}}</span>
  {{#isSyncTab}}<span class="visually-hidden">, hide sync settings</span>{{/isSyncTab}}{{^isSyncTab}}<span class="visually-hidden">, show sync settings</span>{{/isSyncTab}}
  <span class="folder-source__chevron" aria-hidden="true"><svg viewBox="0 0 16 16" width="12" height="12"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg></span>
</a>
{{/blog.client}}
{{^blog.client}}
<a class="btn btn-primary btn-sm folder-source--connect" href="{{{dashboardBase}}}/sync">Sync this folder</a>
{{/blog.client}}
