<!-- The start of the folder box's top row: "Folder", like the summary
     card's labels above, then where it syncs from, a pill as wide as
     there's room for, linking to the sync settings (/sync/<client>) with a
     chevron at its end. With no folder yet, a button to connect one. -->
<span class="folder-source__label" aria-hidden="true">Folder</span>
{{#blog.client}}
<a class="folder-source" href="{{{dashboardBase}}}/sync/{{blog.client}}">
  <span class="visually-hidden">Folder: </span>
  <span class="folder-source__value"><img class="client-icon" alt="" width="14" height="14" src="{{#cdn}}/images/sync/{{blog.client}}.svg{{/cdn}}"> {{client.display_name}}</span>
  <span class="visually-hidden">, sync settings</span>
  <span class="folder-source__chevron" aria-hidden="true"><svg viewBox="0 0 16 16" width="12" height="12"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg></span>
</a>
{{/blog.client}}
{{^blog.client}}
<a class="btn btn-primary btn-sm folder-source--connect" href="{{{dashboardBase}}}/sync">Sync this folder</a>
{{/blog.client}}
