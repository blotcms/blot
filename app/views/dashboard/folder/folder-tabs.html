<!-- The folder box's top edge, two tabs: the client's (its sync settings,
     at /sync/<client>) and the files (the filters and search). Each is its
     own page, so they are links with aria-current, not ARIA tabs. -->
<div class="folder-tabs">
  {{#blog.client}}
  {{#isSyncTab}}<a class="folder-tab folder-tab--sync is-selected" href="{{{dashboardBase}}}/sync/{{blog.client}}" aria-current="page">{{/isSyncTab}}{{^isSyncTab}}<a class="folder-tab folder-tab--sync" href="{{{dashboardBase}}}/sync/{{blog.client}}">{{/isSyncTab}}
    <img class="client-icon" alt="" width="16" height="16" src="{{#cdn}}/images/sync/{{blog.client}}.svg{{/cdn}}">
    <span class="folder-tab__name">{{client.display_name}}</span><span class="visually-hidden"> sync settings</span>
  </a>
  {{/blog.client}}
  {{^blog.client}}
  <!-- No folder yet: the button to connect one, in the tab's place -->
  <div class="folder-tab folder-tab--sync folder-tab--connect">
    <a class="btn btn-primary btn-sm" href="{{{dashboardBase}}}/sync">Sync this folder</a>
  </div>
  {{/blog.client}}
  {{#isSyncTab}}<div class="folder-tab folder-tab--files folder-toolbar">{{/isSyncTab}}{{^isSyncTab}}<div class="folder-tab folder-tab--files folder-toolbar is-selected">{{/isSyncTab}}
    {{> folder-filters}}
    {{> site-dashboard-views}}
  </div>
</div>
