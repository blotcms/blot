
<div class="dashboard-form-panel">
  <header class="page-header">
    <div class="page-header__text">
      <h1 class="page-header__title">Import from Are.na</h1>
    </div>
  </header>

  <a class="import-info" href="/how/configure/import/arena">
    <img class="import-info__logo" src="/images/configure/are.na.svg" alt="">
    <div class="import-info__body">
      <p class="import-info__title">How do I export from Are.na?</p>
      <p class="import-info__text">Paste a public channel URL. Blot turns the channel into Markdown and images.</p>
    </div>
    <span class="import-info__action">View guide</span>
  </a>

  <form method="POST">
    <input type="hidden" name="_csrf" value="{{csrftoken}}" />

    <label for="arena-channel">Are.na channel URL</label><br>
    <input
      type="url"
      id="arena-channel"
      name="channel"
      placeholder="https://www.are.na/username/channel-name"
      autocomplete="url"
      style="width:100%;box-sizing:border-box;max-width:600px;"
      required
    />
    <div class="buttons">
      <button type="submit">Start import</button>
      <a href="{{{importBase}}}">Cancel</a>
    </div>
  </form>

</div>
