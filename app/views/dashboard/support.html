<section class="dashboard-support" aria-labelledby="dashboard-support-title">
  <header class="page-header">
    <div class="page-header__text"><h1 class="page-header__title" id="dashboard-support-title">Support</h1></div>
  </header>
  <div class="dashboard-support__options">
    <div class="dashboard-support__option dashboard-support__option--email">
      <span class="dashboard-support__option-title">Email us</span>
      <span class="dashboard-support__option-description">Contact us directly if you need a hand with your account or site.</span>
      <div class="dashboard-support__email-actions">
        <a class="dashboard-support__email-link" href="mailto:support@blot.im">support@blot.im</a>
        <button type="button" class="copy" data-copy="support@blot.im"><span class="icon-copy" aria-hidden="true"></span> Copy</button>
      </div>
    </div>

    <a class="dashboard-support__option" href="/how">
      <span class="dashboard-support__option-title">Documentation</span>
      <span class="dashboard-support__option-description">Guides to setting up, publishing, and customizing your site.</span>
      <span class="dashboard-support__option-action">Browse documentation <span aria-hidden="true">→</span></span>
    </a>

    <a class="dashboard-support__option" href="/questions">
      <span class="dashboard-support__option-title">Questions</span>
      <span class="dashboard-support__option-description">Search answers from the Blot community or ask a question.</span>
      <span class="dashboard-support__option-action">Visit Questions <span aria-hidden="true">→</span></span>
    </a>
  </div>
</section>
