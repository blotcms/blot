<header class="page-header"><div class="page-header__text"><h1 class="page-header__title">{{title}}</h1></div></header>
<a href="" class="mess error" style="display:none">
         {{text}}
         <span class="link">Dismiss</span>
        </a>




<form id="payment-form" data-stripe-key="{{stripe_key}}" method="POST" style="max-width: 500px" id="payment-form">

  <p class="payment-intro">Would you like to pay <span class="price-highlight">{{price}} per {{interval}}</span> to activate your subscription? If you have any questions please <a href="/support">contact support</a>.</p>

  <input type="hidden" name="_csrf" value="{{csrftoken}}">

  <br>

  <div class="clear"></div>


  {{> card-form}}

  <div class="buttons">
    <button type="submit">Subscribe</button>
    <a href="/">Cancel</a>
  </div>


</form>
