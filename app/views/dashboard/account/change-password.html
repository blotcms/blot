<header class="page-header"><div class="page-header__text"><h1 class="page-header__title">{{title}}</h1></div></header>
<form method="post" class="dashboard-form">

  <input type="hidden" name="_csrf" value="{{csrftoken}}">

  {{> message}}
  
  
  <label>Enter your current password:
    <input type="password" name="password" autocomplete="current-password" maxlength="{{maxPasswordLength}}" autofocus />
  </label>

  <label>New password:
    <input type="password" name="newPasswordA" autocomplete="new-password" maxlength="{{maxPasswordLength}}"/>
  </label>

  <label>Confirm new password:
    <input type="password" name="newPasswordB" autocomplete="new-password" maxlength="{{maxPasswordLength}}"/>
  </label>


  <div class="buttons">
    <button type="submit">Save new password</button>
    <a href="/sites">Cancel</a>
  </div>
  <br><br>
</form>
