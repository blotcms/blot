<div class="favicon-cropper favicon-cropper--image" hidden data-cropper>
  <div class="favicon-cropper__image">
    <div class="favicon-cropper__viewport">
      <img alt="Image crop preview" data-crop-image />
      <div class="favicon-cropper__selection" role="group" tabindex="0" aria-label="Image crop area" data-crop-selection></div>
    </div>
    <div class="favicon-cropper__handles" data-crop-handles aria-hidden="true">
      <span class="favicon-cropper__handle favicon-cropper__handle--nw" data-crop-handle="nw"></span>
      <span class="favicon-cropper__handle favicon-cropper__handle--ne" data-crop-handle="ne"></span>
      <span class="favicon-cropper__handle favicon-cropper__handle--sw" data-crop-handle="sw"></span>
      <span class="favicon-cropper__handle favicon-cropper__handle--se" data-crop-handle="se"></span>
      <span class="favicon-cropper__handle favicon-cropper__handle--n" data-crop-edge="n"></span>
      <span class="favicon-cropper__handle favicon-cropper__handle--e" data-crop-edge="e"></span>
      <span class="favicon-cropper__handle favicon-cropper__handle--s" data-crop-edge="s"></span>
      <span class="favicon-cropper__handle favicon-cropper__handle--w" data-crop-edge="w"></span>
    </div>
  </div>
</div>
