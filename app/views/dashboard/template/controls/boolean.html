<form method="post" class="boolean" id="{{key}}">
  <input type="hidden" name="_csrf" value="{{csrftoken}}" />
  <label class="bool">
    <span class="boolean-label">{{label}}:</span>
    <input type="hidden" value="off" name="locals.{{key}}" />
    <input
      type="checkbox"
      class="boolean-switch-input"
      name="locals.{{key}}"
      {{#value}}checked{{/value}}
    />
    <span class="boolean-switch" aria-hidden="true"></span>
  </label>
</form>
