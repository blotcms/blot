<div class="file-drop" data-file-drop>
  <input class="file-drop__input" type="file" id="{{fileDrop.id}}" name="{{fileDrop.name}}" accept="{{fileDrop.accept}}" {{fileDrop.inputAttribute}} aria-label="{{fileDrop.ariaLabel}}" />
  <label class="file-drop__empty" data-file-drop-empty for="{{fileDrop.id}}">
    <svg class="file-drop__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M7 18a4.5 4.5 0 0 1 .3-9 5.5 5.5 0 0 1 10.7 1.5A3.5 3.5 0 0 1 17.5 18H7z" stroke-linejoin="round"/>
      <path d="M12 15V9M9.5 11.5 12 9l2.5 2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="file-drop__title">{{fileDrop.title}}</span>
    <span class="file-drop__action">Drag and drop an image, or <span class="file-drop__choose">choose a file</span>.</span>
  </label>
  <div class="file-drop__selected" data-file-drop-selected hidden>
    <span class="file-drop__selected-label">{{fileDrop.selectedLabel}}</span>
    <div class="file-drop__chip">
      <svg class="file-drop__file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
      </svg>
      <span class="file-drop__name" data-file-drop-name></span>
      <button type="button" class="file-drop__clear" data-file-drop-clear aria-label="Remove selected {{fileDrop.noun}}">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>
