<form
  method="post"
  id="font_picker_{{key}}"
  class="template-font-control font-row"
  data-font-picker-form
  data-font-picker-key="{{key}}"
>
  <input type="hidden" name="_csrf" value="{{csrftoken}}" />
  <input
    type="hidden"
    name="locals.{{key}}.id"
    value="{{{value.id}}}"
    data-font-picker-value
  >

  <span class="font-row-label">{{label}}</span>

  <button
    type="button"
    class="font-picker-trigger"
    data-font-picker-trigger
    aria-haspopup="listbox"
    aria-expanded="false"
    aria-controls="template-font-picker"
  >
    <span data-font-picker-label>
      {{#value}}
      {{#name}}
        {{#svg}}
          {{{svg}}}
        {{/svg}}
        {{^svg}}
          <span style="font-family: {{stack}};">{{name}}</span>
        {{/svg}}
      {{/name}}
      {{^name}}Select a font{{/name}}
      {{/value}}
    </span>
  </button>

  <div class="font-size-stepper">
    <button type="button" class="font-size-step" data-font-size-step="-1" aria-label="Decrease font size">&minus;</button>
    <input
      type="number"
      class="font-size-value"
      id="locals.{{key}}.font_size"
      name="locals.{{key}}.font_size"
      value="{{font_size}}"
      min="9"
      max="96"
      inputmode="numeric"
    >
    <button type="button" class="font-size-step" data-font-size-step="1" aria-label="Increase font size">+</button>
  </div>
</form>
