<form
  method="post"
  id="font_picker_{{key}}"
  class="template-font-control font-row"
  data-font-picker-form
  data-font-picker-key="{{key}}"
>
  <input type="hidden" name="_csrf" value="{{csrftoken}}" />
  <input
    type="hidden"
    name="locals.{{key}}.id"
    value="{{{value.id}}}"
    data-font-picker-value
  >

  {{^singleFontInput}}<span class="template-setting-label font-row-label" id="font_label_{{key}}">{{label}}:</span>{{/singleFontInput}}

  <button
    type="button"
    class="font-picker-trigger"
    data-font-picker-trigger
    aria-haspopup="listbox"
    aria-expanded="false"
    aria-controls="template-font-picker"
    aria-describedby="font_label_{{key}}"
  >
    <span data-font-picker-label>
      {{#value}}
      {{#name}}
        {{#specimenURL}}
          <img class="font-specimen" src="{{{specimenURL}}}" width="{{specimenWidth}}" height="{{specimenHeight}}" alt="{{name}}" loading="lazy" decoding="async">
        {{/specimenURL}}
        {{^specimenURL}}
          <span style="font-family: {{stack}};">{{name}}</span>
        {{/specimenURL}}
      {{/name}}
      {{^name}}Select a font{{/name}}
      {{/value}}
    </span>
  </button>

  <input
    type="number"
    class="number-stepper__input"
    data-number-stepper
    data-number-stepper-label="font size"
    id="locals.{{key}}.font_size"
    aria-label="{{label}} font size"
    name="locals.{{key}}.font_size"
    value="{{font_size}}"
    min="9"
    max="96"
    step="1"
    inputmode="numeric"
  >
</form>
