<div class="settings-group">
  <h2 class="template-heading">Favicon</h2>
  <div class="favicon-form__body">
    <p class="favicon-form__help">Your favicon appears in the browser toolbar next to your site's title.</p>
    {{#favicon}}
    <div class="favicon-current">
      <div class="favicon-current__tab" role="img" aria-label="Site tab preview: {{siteTitle}}">
        <img class="favicon-current__preview" width="32" height="32" src="{{{png32}}}" alt="" />
        <span class="favicon-current__title">{{siteTitle}}</span>
      </div>
      <form method="post" action="{{{base}}}/favicon" class="dashboard-form favicon-current__actions">
        <input type="hidden" name="_csrf" value="{{csrftoken}}" />
        <input type="hidden" name="redirect" value="{{{base}}}/images/profile_image" />
        <div class="buttons">
          <button type="submit" class="red" name="remove" value="1">Delete favicon</button>
          <a href="{{{base}}}/images/profile_image">Cancel</a>
        </div>
      </form>
    </div>
    <hr class="photo-upload-divider" />
    {{/favicon}}

    <form method="post" action="{{{base}}}/favicon" enctype="multipart/form-data" class="dashboard-form favicon-form" data-favicon-form>
      <input type="hidden" name="_csrf" value="{{csrftoken}}" />
      <input type="hidden" name="redirect" value="{{{base}}}/images/profile_image" />
      <input type="hidden" name="crop_x" value="" data-favicon-crop-x />
      <input type="hidden" name="crop_y" value="" data-favicon-crop-y />
      <input type="hidden" name="crop_size" value="" data-favicon-crop-size />

      {{#faviconFileDrop}}{{> file-drop-field}}{{/faviconFileDrop}}

      <p class="favicon-form__help" role="alert" hidden data-favicon-load-error>The selected image could not be previewed. Please choose another image.</p>
      {{> favicon-crop-ui}}

      <div class="buttons photo-upload-actions" data-file-drop-actions hidden>
        <button type="submit">Save favicon</button>
        <a href="{{{base}}}/images/profile_image">Cancel</a>
      </div>
    </form>
  </div>
</div>
