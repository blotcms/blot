<fieldset class="photo-cropper__shape" aria-label="Photo shape">
  {{#image.maskOptions}}
  {{#organic}}
  <div class="photo-cropper__shape-organic">
    <label class="photo-cropper__shape-organic-choice">
      <input type="radio" name="photo_shape" value="{{value}}" {{#selected}}checked{{/selected}} data-photo-shape data-organic-mask-input aria-label="Organic mask" title="Organic mask" />
      <span data-organic-mask-icon>{{{icon}}}</span>
    </label>
    <button type="button" class="photo-cropper__shape-organic-refresh" data-organic-mask-refresh aria-label="Try another organic shape" title="Try another organic shape">
      <svg class="octicon octicon-sync" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"></path></svg>
    </button>
    <span hidden>
      {{#variants}}
      <template data-organic-mask-icon-template="{{value}}" data-organic-mask-label="{{label}}" data-organic-mask-name="{{name}}" data-organic-mask-clip="{{clip}}">{{{icon}}}</template>
      {{/variants}}
    </span>
  </div>
  {{/organic}}
  {{^organic}}
  <label>
    <input type="radio" name="photo_shape" value="{{value}}" {{#selected}}checked{{/selected}} data-photo-shape aria-label="{{label}}" title="{{label}}" />
    {{{icon}}}
  </label>
  {{/organic}}
  {{/image.maskOptions}}
</fieldset>
