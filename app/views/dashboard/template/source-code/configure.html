<div class="source-code-layout">
  <div class="source-code-sidebar">
    {{> source-code-sidebar}}
  </div>
  <div class="editor-container">
    {{> source-code-header}}
    <textarea
      id="source"
      class="source-code-textarea"
      aria-label="Source code"
      rows="{{view.rows}}"
      wrap="soft"
      spellcheck="false"
      data-mode="{{view.editorMode}}"
      name="content"
    >{{view.content}}</textarea>
  </div>
</div>
{{> source-code-footer}}
