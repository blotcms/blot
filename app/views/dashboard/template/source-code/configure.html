<div class="source-code-layout">
  <div class="source-code-sidebar">
    {{> source-code-sidebar}}
  </div>
  <div class="editor-container">
    {{> source-code-header}}
    <div id="editor"></div>
    <textarea
      id="source"
      style="display:none"
      data-mode="{{view.editorMode}}"
      name="content"
    >{{view.content}}</textarea>
  </div>
</div>
{{> source-code-footer}}
