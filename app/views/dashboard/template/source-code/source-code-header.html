<div
	class="source-code-header"
>
        <div class="source-code-header__links">
				{{^view.isPackageJSON}}
                <a class="smallLink {{selected.edit}}" href="{{{base}}}/source-code/{{view.name}}/edit">Edit</a>
                {{#view.previewUrl}}
                <a class="smallLink {{selected.preview}}" href="{{{base}}}/source-code/{{view.name}}/preview">Preview</a>
                <a class="smallLink {{selected.output}}" href="{{{base}}}/source-code/{{view.name}}/output">Output</a>
                <a class="smallLink {{selected.json}}" href="{{{base}}}/source-code/{{view.name}}/json">JSON</a>
                {{/view.previewUrl}}
                <a class="smallLink {{selected.config}}" href="{{{base}}}/source-code/{{view.name}}/configure">Config</a>
                <a class="smallLink {{selected.rename}}" href="{{{base}}}/source-code/{{view.name}}/rename">Rename</a>
                <a class="smallLink {{selected.fileDelete}}" href="{{{base}}}/source-code/{{view.name}}/delete">Delete</a>
                {{/view.isPackageJSON}}
        </div>

		<div class="source-code-header__spacer"></div>
		{{#view.formAction}}
        <form
                class="save source-code-header__save"
                action="{{{view.formAction}}}"
        >
                <input type="hidden" name="content" value="{{view.content}}" />
                <input type="hidden" name="_csrf" value="{{csrftoken}}" />
                <button
                        id="save"
			class="button disabled small"
			type="submit"
			value="Save"
			disabled
		>Save changes
		</button>
	</form>
		{{/view.formAction}}


</div>

<div class="error" style="display: none;">
</div>
