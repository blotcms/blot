<div class="source-code-layout">
  <div class="source-code-sidebar">
	  {{> source-code-sidebar}}
  </div>
  <div class="editor-container">
    {{> source-code-header}}
    
    {{#view}}
    <textarea
      id="source"
      class="source-code-textarea"
      aria-label="Source code"
      rows="{{rows}}"
      wrap="soft"
      spellcheck="false"
      data-mode="{{editorMode}}"
      name="content"
    >{{content}}</textarea>
    {{/view}}
    
  </div>
</div>
{{> source-code-footer}}
