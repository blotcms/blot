<div class="source-code-layout">
  <div class="source-code-sidebar">
	  {{> source-code-sidebar}}
  </div>
  <div class="editor-container">
    {{> source-code-header}}
    
    {{#view}}
    <div id="editor"></div>
    <textarea
      id="source"
      style="display:none"
      data-mode="{{editorMode}}"
      name="content"
    >{{content}}</textarea>
    {{/view}}
    
  </div>
</div>
{{> source-code-footer}}
