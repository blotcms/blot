<div class="source-code-layout">
  <div class="source-code-sidebar">
    {{> source-code-sidebar}}
  </div>
  <div class="editor-container source-code-preview-container">
    {{> source-code-header}}
    <iframe
      class="source-code-preview-frame"
      src="{{view.activePreviewUrl}}"
      title="{{view.name}} {{view.previewMode}}"
    ></iframe>
  </div>
</div>
