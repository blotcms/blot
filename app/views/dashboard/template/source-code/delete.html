<div style="display:flex;min-height:80vh;gap:2em">
	  {{> source-code-sidebar}}
    <div class="editor-container">
      {{> source-code-header}}

        <form method="post" action="{{{base}}}/source-code/{{view.name}}/delete"  method="post" class="dashboard-form" style="padding:2rem">
          <input type="hidden" name="_csrf" value="{{csrftoken}}" />
          <p>Do you want to delete {{view.name}}? This file will be permanently deleted and cannot be recovered.</p>
          <div class="buttons">
            <button type="submit" class="red">
              Delete file
            </button>
            <a href="{{{base}}}/source-code/{{view.name}}/edit">Cancel</a>
          </div>
        </form>
      </div>
    </div>
</div>
{{> source-code-footer}}
