{{> message}}


<div class="template-editor-layout">
    <div class="template-editor-controls">
            {{> template-sub-navigation}}

            {{> template-editor-sidebar}}
    </div>
    <div class="template-editor-preview">
               
        <div class="iframe-container {{previewContainerClass}}" data-origin="{{{previewOrigin}}}">
            <div class="iframe-scroll">
                <iframe id="full_size_preview"
                          class="{{previewIframeClass}}"
                          title="Preview of your site"
                          width="{{previewWidth}}"
                          height="{{previewHeight}}"
                          scrolling="no"
                        src="{{preview}}"
                        ></iframe>
            </div>
            <div class="iframe-loading" data-iframe-loading aria-hidden="true">
                <span class="iframe-loading-dot"></span>
                <span class="iframe-loading-dot"></span>
                <span class="iframe-loading-dot"></span>
            </div>
        </div>
        
         <div class="segmented-control" style="width:200px;margin:12px 0;font-size: 12px;" data-view-toggle>
                    <button type="button" class="template-button {{previewDesktopSelected}}" data-view="desktop" aria-pressed="{{previewDesktopPressed}}">Desktop</button>
                    <button type="button" class="template-button {{previewMobileSelected}}" data-view="mobile" aria-pressed="{{previewMobilePressed}}">Mobile</button>
                </div>
    </div>
</div>

{{#fontPickerOptions.length}}
<div
  id="template-font-picker"
  class="template-font-picker"
  data-template-font-picker
  hidden
>
  <div class="template-font-picker__filters" data-font-picker-filters>
    <button
      type="button"
      class="template-font-picker__filter is-active"
      data-font-picker-filter="all"
    >
      All
    </button>
    <button
      type="button"
      class="template-font-picker__filter"
      data-font-picker-filter="sans"
    >
      Sans
    </button>
    <button
      type="button"
      class="template-font-picker__filter"
      data-font-picker-filter="serif"
    >
      Serif
    </button>
    <button
      type="button"
      class="template-font-picker__filter"
      data-font-picker-filter="mono"
    >
      Mono
    </button>
    <button
      type="button"
      class="template-font-picker__filter"
      data-font-picker-filter="other"
    >
      Other
    </button>
<button
      type="button"
      class="template-font-picker__filter"
      data-font-picker-filter="system"
    >
      System
    </button>    
  </div>
  <div
    class="template-font-picker__options"
    data-font-picker-options
    role="group"
    aria-label="Available fonts"
  >
    {{#fontPickerOptions}}
    <button
      type="button"
      class="template-font-picker__option"
      data-font-option-id="{{{id}}}"
      data-font-stack="{{stack}}"
      data-font-tags="{{tagsString}}"
      aria-pressed="false"
    >
      {{#specimenURL}}
        <img class="font-specimen" src="{{{specimenURL}}}" width="{{specimenWidth}}" height="{{specimenHeight}}" alt="{{name}}" loading="lazy" decoding="async">
      {{/specimenURL}}
      {{^specimenURL}}
        <span style="font-family: {{stack}};">{{name}}</span>
      {{/specimenURL}}
    </button>
    {{/fontPickerOptions}}
  </div>
</div>
{{/fontPickerOptions.length}}
