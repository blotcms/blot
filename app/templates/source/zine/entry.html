<!DOCTYPE html>
<html>
  {{> head}}
  <body>
    {{> header}}
    <div class="container">

      {{#entry}}





        {{{html}}}

        <p><span class="small">
          {{#date}}Published on
          {{date}}
          {{/date}}

          {{#show_tags}}
          {{#tags.length}}
            {{#tags}}
            – <a class="light" href="/tagged/{{slug}}">{{name}}</a>
            {{/tags}}
          {{/tags.length}}
          {{/show_tags}}
        </span>
        </p>
        <br>
        {{> pluginHTML}}

      {{/entry}}
    </div>
    {{> footer}}
  </body>
</html>
