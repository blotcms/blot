<!DOCTYPE html>
<html>
  {{> head}}
  <body>

    <div class="page-layout">
    {{> sidebar}}

    <div class="content-column">
    <h1>Archives</h1>

      <form action="/search">
        <input placeholder="Search..." value="{{#query}}{{query}}{{/query}}" name="q" id="search" type="text" />&nbsp; <input type="submit" value="Go"/>
      </form>

      <br>

    <div class="entry">

      {{#archives}}
        {{#months}}
          {{#entries}}
          <a href="{{{url}}}" title="{{title}}">{{title}}</a>{{#date}} <span class="light">{{date}}</span>{{/date}}<br>
          {{/entries}}
        {{/months}}
      {{/archives}}

    </div>

    {{> footer}}
    </div>
    </div>
  </body>
</html>
