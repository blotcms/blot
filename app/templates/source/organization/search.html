<!DOCTYPE html>
<html dir="auto">
  {{> head}}
  <body class="index-page">
    {{> header}}
    <main id="main">
      {{> masthead}}
      <form class="search" role="search">
        <label for="q">Search</label>
        <input type="search" id="q" name="q" value="{{query}}" placeholder="Search everything">
        <button type="submit">Go</button>
      </form>
      {{#query}}
      {{#entries.length}}
      <div class="rows">
        {{#entries}}{{> post-row}}{{/entries}}
      </div>
      {{/entries.length}}
      {{^entries.length}}
      <p class="empty">Nothing matches “{{query}}”.</p>
      {{/entries.length}}
      {{/query}}
    </main>
    {{> footer}}
  </body>
</html>
