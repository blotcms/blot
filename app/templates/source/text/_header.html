<div class="header-wrapper">
  <div class="container">
<input type="checkbox" name="hidden-toggle" id="hidden-toggle">
<header>
  <a href="/" class="site-title">{{#profile_image.thumbnails.square}}<img width="{{width}}" height="{{height}}" src="{{{url}}}" alt="" class="site-logo">{{/profile_image.thumbnails.square}}{{title}}</a>
  <label id="toggle" for="hidden-toggle">
    <span class="hamburger-box">
          <span class="hamburger-inner"></span>
    </span>
  </label>


  <nav>
    {{#menu}}
    <a href="{{{url}}}" class="{{active}}">{{label}}</a>
    {{/menu}}
  </nav>
</header>
</div>
</div>
