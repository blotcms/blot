<ul class="archive-list archive-months">
  {{#months}}
  <li>
    <details data-archive-id="{{year}}/{{month}}"{{#first}} open{{/first}}>
      <summary><span class="archive-label">{{month}}</span></summary>
      <ul class="archive-list archive-posts">
        {{#entries}}
        <li><a href="{{{url}}}">{{title}}</a></li>
        {{/entries}}
      </ul>
    </details>
  </li>
  {{/months}}
</ul>
