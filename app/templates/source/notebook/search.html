<!DOCTYPE html>
<html>
  {{> head}}
  <body>
    <div class="wrapper">
      {{> header}}

      <div class="content-wrapper">
        <main class="main" id="main">
          <div class="page-body">
          <h1 class="page-title">Search</h1>

          <form class="search-form">
            <input placeholder="Search for an entry..." value="{{#query}}{{query}}{{/query}}" name="q" id="search" type="search" aria-label="Search" />
            <input type="submit" value="Go" />
          </form>

          <ul class="full-archive">
          {{#query}}
            {{^entries}}
            <li class="no-results">Sorry, no results for &ldquo;{{query}}&rdquo;</li>
            {{/entries}}
          {{/query}}

          {{#entries}}
            <li><a href="{{{url}}}"><span class="archive-title">{{title}}</span>{{^hide_dates}} <span class="light">{{date}}</span>{{/hide_dates}}</a></li>
          {{/entries}}
          </ul>
          </div>
          {{> feed-links}}
        </main>

        {{> sidebar}}
        <div class="clear"></div>
      </div>

      {{> footer}}
    </div>

    <script type="text/javascript">
      // Ready to type into, unless there's already a query or the keyboard
      // would cover the page on a phone
      (function () {
        var input = document.getElementById("search");
        if (input && !input.value && window.matchMedia && window.matchMedia("(pointer: fine)").matches) input.focus();
      })();
    </script>
  </body>
</html>
