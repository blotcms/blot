{{#posts}}
<li data-path="{{{path}}}"><a class="{{active}}" href="{{{url}}}">{{title}}</a></li>
{{/posts}}
{{#pagination.next}}
<span data-next="{{.}}"></span>
{{/pagination.next}}
{{! How many pages there are, so navigation-js.js can fetch the rest at once }}
{{#pagination}}<span data-pages="{{total}}"></span>{{/pagination}}
