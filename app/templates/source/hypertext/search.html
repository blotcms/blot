<!DOCTYPE html>
<html lang="{{lang}}">
{{> head}}
<body>
    {{> navigation}}
    <main id="main" tabindex="-1">
        <h1>Search</h1>
        {{> search-form}}

        {{#query}}
        <div class="archives-grid">
        {{#entries}}
        <div class="archive-item">
           <a href="{{{url}}}" class="archive-title">{{title}}</a>
           {{^hide_dates}}{{#date}}<span class="archive-date">{{#formatDate}}{{date_display}}{{/formatDate}}</span>{{/date}}{{/hide_dates}}
         </div>
        {{/entries}}
        </div>
        {{^entries.length}}<p class="empty-state">No posts match &ldquo;{{query}}&rdquo;.</p>{{/entries.length}}
        {{/query}}

    </main>
    {{> footer}}
</body>
</html>
