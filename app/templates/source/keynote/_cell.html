{{#thumbnail.large.url}}
<a class="cell collection-entry" href="{{{url}}}" data-html="{{html}}" data-title="{{title}}"{{^hide_dates}} data-date="{{date}}"{{/hide_dates}} style="--w: {{thumbnail.large.width}}; --h: {{thumbnail.large.height}}" data-preview="{{{thumbnail.large.url}}}" data-width="{{thumbnail.large.width}}" data-height="{{thumbnail.large.height}}">
  <span class="cell-image"><img loading="lazy" src="{{{thumbnail.small.url}}}" srcset="{{{thumbnail.small.url}}} {{thumbnail.small.width}}w, {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w, {{{thumbnail.large.url}}} {{thumbnail.large.width}}w" sizes="(min-width: 800px) 280px, 44vw" width="{{thumbnail.large.width}}" height="{{thumbnail.large.height}}" alt="" decoding="async" draggable="false"></span>
  <span class="cell-title">{{title}}</span>
  <template class="entry-details">{{> details}}</template>
</a>
{{/thumbnail.large.url}}
{{^thumbnail.large.url}}
<a class="cell card collection-entry" href="{{{url}}}">
  <span class="card-title">{{title}}</span>
  {{#summary}}<span class="card-summary">{{summary}}</span>{{/summary}}
  {{^hide_dates}}{{#date}}<span class="card-date">{{date}}</span>{{/date}}{{/hide_dates}}
</a>
{{/thumbnail.large.url}}
