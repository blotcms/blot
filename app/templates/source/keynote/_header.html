<div id="header">

  <input type="checkbox" id="nav-toggle" class="nav-toggle visually-hidden" aria-label="Menu">
  <label for="nav-toggle" class="nav-toggle-button" aria-hidden="true"><svg class="nav-toggle-more" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16"><path d="M8 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM1.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm13 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path></svg><svg class="nav-toggle-close" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24"><path d="M5.72 5.72a.75.75 0 0 1 1.06 0L12 10.94l5.22-5.22a.749.749 0 0 1 1.275.326.75.75 0 0 1-.215.734L13.06 12l5.22 5.22a.749.749 0 0 1-.326 1.275.75.75 0 0 1-.734-.215L12 13.06l-5.22 5.22a.75.75 0 0 1-1.042-.018.75.75 0 0 1-.018-1.042L10.94 12 5.72 6.78a.75.75 0 0 1 0-1.06Z"></path></svg></label>

  <nav class="nav" aria-label="Main">
    {{#menu}}
    <a href="{{{url}}}" class="{{active}}">{{label}}</a>
    {{/menu}}
  </nav>

  <a id="title" href="/" title="The homepage of {{title}}">{{#profile_image.thumbnails.small}}<img width="{{width}}" height="{{height}}" class="avatar" src="{{{url}}}" srcset="{{{url}}} {{width}}w{{#profile_image.thumbnails.medium}}, {{{url}}} {{width}}w{{/profile_image.thumbnails.medium}}{{#profile_image.thumbnails.large}}, {{{url}}} {{width}}w{{/profile_image.thumbnails.large}}" sizes="36px" alt="">{{/profile_image.thumbnails.small}}{{^profile_image.thumbnails.small.url}}{{#avatar}}<img class="avatar" src="{{{avatar}}}" alt="">{{/avatar}}{{/profile_image.thumbnails.small.url}}{{title}}</a>

</div>
