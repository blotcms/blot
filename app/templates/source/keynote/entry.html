<!DOCTYPE html>
<html lang="{{lang}}" data-scheme="{{#light_or_dark}}{{background_color}}{{/light_or_dark}}">
  {{> head}}
  <body data-view="entry">

    {{> header}}

    <main class="rail-viewport" aria-label="Images" data-page="{{pagination.current}}" data-total="{{pagination.total}}">
      <div class="rail-layer">
        <ul class="rail" aria-label="Image rail">
          {{#posts}}
          {{> slide}}
          {{/posts}}
        </ul>
      </div>
    </main>

    {{#entry}}
    <ul class="current-entry" hidden>
      {{> slide}}
    </ul>

    <article class="contents">
      {{> post}}

      <nav class="entry-nav" aria-label="Posts">
        {{^page}}<a class="entry-next" rel="prev" {{#next}}href="{{{url}}}"{{/next}}>&larr; Newer</a>{{/page}}
        <a class="entry-close" href="/">Back</a>
        {{^page}}<a class="entry-previous" rel="next" {{#previous}}href="{{{url}}}"{{/previous}}>Older &rarr;</a>{{/page}}
      </nav>

      {{> pluginHTML}}
    </article>
    {{/entry}}

    {{> lightbox}}
    {{> footer}}
  </body>
</html>
