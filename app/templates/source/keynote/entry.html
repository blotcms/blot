<!DOCTYPE html>
<html>
  {{> head}}
  <body data-view="entry">

    {{> header}}

    <main class="rail-viewport" aria-label="Images">
      <div class="rail-layer">
        <ul class="rail" aria-label="Image rail">
          {{#posts}}
          {{> slide}}
          {{/posts}}
        </ul>
      </div>
      <p class="rail-empty">There are no images to show yet.</p>
    </main>

    {{#entry}}
    <ul class="current-entry" hidden>
      {{> slide}}
    </ul>

    <div class="contents">
      {{> post}}

      {{> pluginHTML}}
    </div>
    {{/entry}}

    {{> lightbox}}
    {{> footer}}
  </body>
</html>
