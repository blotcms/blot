<div class="list-toolbar">
  {{#all_tags.length}}
  <nav class="tag-navigation" aria-label="Browse posts by tag">
    <ul>
      <li><a href="/archives" class="{{^tag}}active{{/tag}}">All</a></li>
      {{#all_tags}}
      <li><a href="/tagged/{{slug}}" class="{{active}}">{{name}}</a></li>
      {{/all_tags}}
      <li class="tag-toggle-item" hidden><button class="tag-toggle" type="button" aria-expanded="false" aria-label="All tags"><svg class="tag-toggle-more" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16"><path d="M8 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM1.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm13 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path></svg><svg class="tag-toggle-close" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24"><path d="M5.72 5.72a.75.75 0 0 1 1.06 0L12 10.94l5.22-5.22a.749.749 0 0 1 1.275.326.75.75 0 0 1-.215.734L13.06 12l5.22 5.22a.749.749 0 0 1-.326 1.275.75.75 0 0 1-.734-.215L12 13.06l-5.22 5.22a.75.75 0 0 1-1.042-.018.75.75 0 0 1-.018-1.042L10.94 12 5.72 6.78a.75.75 0 0 1 0-1.06Z"></path></svg></button></li>
    </ul>
  </nav>
  {{/all_tags.length}}
  {{> searchbar}}
</div>
