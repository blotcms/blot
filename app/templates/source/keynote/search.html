<!DOCTYPE html>
<html lang="{{lang}}">
  {{> head}}
  <body data-view="search">

    <div class="container">

      {{> header}}

      {{> tag_filters}}

      <div class="list" data-grid>
        {{#entries}}
        {{> cell}}
        {{/entries}}
      </div>

      {{#query}}
      {{^entries}}
      <p class="no-results">Sorry, no results for “{{query}}”</p>
      {{/entries}}
      {{/query}}

    </div>

    {{> lightbox}}
    {{> footer}}
  </body>
</html>
