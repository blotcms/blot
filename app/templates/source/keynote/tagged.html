<!DOCTYPE html>
<html lang="{{lang}}" data-scheme="{{#light_or_dark}}{{background_color}}{{/light_or_dark}}">
  {{> head}}
  <body data-view="tagged">

    <div class="container">

      {{> header}}

      <main id="main">

      <h1 class="visually-hidden">Posts tagged “{{tag}}”</h1>

      {{> tag_filters}}

      <div class="list" data-grid data-page="{{pagination.current}}" data-page-size="{{pagination.page_size}}" data-entries="{{pagination.total_entries}}">
        {{#entries}}
        {{> cell}}
        {{/entries}}
      </div>

      {{#pagination}}
      <nav class="pagination" aria-label="Pages">
        {{#previous}}<a class="collection-previous" href="/tagged/{{slug}}/page/{{previous}}">&larr; Previous</a>{{/previous}}
        {{#next}}<a class="more collection-next" rel="next" href="/tagged/{{slug}}/page/{{next}}">Next &rarr;</a>{{/next}}
      </nav>
      {{/pagination}}

      <p class="list-total"><span aria-hidden="true">{{total}}/{{total}}</span><span class="visually-hidden">{{total}} of {{total}}</span></p>

      <p class="visually-hidden list-status" aria-live="polite"></p>
      </main>

    </div>

    {{> lightbox}}
    {{> footer}}
  </body>
</html>
