<!DOCTYPE html>
<html>
  {{> head}}
  <body data-view="tagged">

    <div class="container">

      {{> header}}

      <h1 class="visually-hidden">Posts tagged “{{tag}}”</h1>

      <div class="list" data-grid>
        {{#entries}}
        {{> cell}}
        {{/entries}}
      </div>

      {{#pagination}}
      <div class="pagination">
        {{#previous}}<a href="/tagged/{{slug}}/page/{{previous}}">&larr; Previous</a>{{/previous}}
        Page {{current}} of {{total}}
        {{#next}}<a class="more" rel="next" href="/tagged/{{slug}}/page/{{next}}">Next &rarr;</a>{{/next}}
      </div>
      {{/pagination}}

    </div>

    {{> lightbox}}
    {{> footer}}
  </body>
</html>
