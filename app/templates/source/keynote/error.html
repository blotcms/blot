<!DOCTYPE html>
<html lang="{{lang}}" data-scheme="{{#light_or_dark}}{{background_color}}{{/light_or_dark}}">
  {{> head}}
  <body data-view="error">

    <div class="container">

      {{> header}}

      <main class="contents" id="main">
        <h1>{{error.title}}</h1>

        <p>Something has gone wrong. {{error.message}}</p>

        <p><a href="/">Go to the homepage</a> or <a href="/archives">see all posts</a>.</p>
      </main>

    </div>
    {{> footer}}
  </body>
</html>
