<!DOCTYPE html>
<html lang="{{lang}}" data-scheme="{{#light_or_dark}}{{background_color}}{{/light_or_dark}}">
  {{> head}}
  <body data-view="home">
    {{> header}}
    <main class="rail-viewport" id="main" data-page="{{pagination.current}}" data-total="{{pagination.total}}" data-entries="{{#pagination}}{{total_entries}}{{/pagination}}{{^pagination}}{{total_posts}}{{/pagination}}">
      <h1 class="visually-hidden">{{title}}</h1>
      <div class="rail-layer">
        <ul class="rail" aria-label="Image rail">
          {{#posts}}
          {{> slide}}
          {{/posts}}
        </ul>
      </div>
      <p class="rail-empty">There are no images to show yet. <a href="/archives">See all posts</a></p>
    </main>

    {{> rail_pagination}}

    {{> lightbox}}
    {{> footer}}
  </body>
</html>
