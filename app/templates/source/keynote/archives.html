<!DOCTYPE html>
<html>
  {{> head}}
  <body data-view="archives">

    <div class="container">

      {{> header}}

      <h1 class="visually-hidden">Archives</h1>

      {{> searchbar}}

      <div class="list" data-grid>
        {{#posts}}
        {{> cell}}
        {{/posts}}
      </div>

      {{#pagination}}
      <div class="pagination">
        {{#previous}}<a href="/archives?page={{previous}}">&larr; Previous</a>{{/previous}}
        Page {{current}} of {{total}}
        {{#next}}<a class="more" rel="next" href="/archives?page={{next}}">Next &rarr;</a>{{/next}}
      </div>
      {{/pagination}}

    </div>

    {{> lightbox}}
    {{> footer}}
  </body>
</html>
