<!DOCTYPE html>
<html lang="{{lang}}" data-scheme="{{#light_or_dark}}{{background_color}}{{/light_or_dark}}">
  {{> head}}
  <body data-view="archives">

    <div class="container">

      {{> header}}

      <main id="main">

      <h1 class="visually-hidden">Archives</h1>

      {{> tag_filters}}

      <div class="list" data-grid data-page="{{pagination.current}}" data-page-size="{{pagination.page_size}}" data-entries="{{pagination.total_entries}}">
        {{#posts}}
        {{> cell}}
        {{/posts}}
      </div>

      {{#pagination}}
      <nav class="pagination" aria-label="Pages">
        {{#previous}}<a class="collection-previous" href="/archives?page={{previous}}">&larr; Previous</a>{{/previous}}
        <span class="page-count">Page {{current}} of {{total}}</span>
        {{#next}}<a class="more collection-next" rel="next" href="/archives?page={{next}}">Next &rarr;</a>{{/next}}
      </nav>
      {{/pagination}}

      <p class="list-total" data-count="{{total_posts}}">{{total_posts}} items</p>

      <p class="visually-hidden list-status" aria-live="polite"></p>
      </main>

    </div>

    {{> lightbox}}
    {{> footer}}
  </body>
</html>
