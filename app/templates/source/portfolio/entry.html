{{> header}}

<div class="entry align-{{navigation_alignment}}">
  
  <div class="nav">
    <a class="entry-close" href="/" onclick="return closeEntry()">
      <svg viewBox="0 0 36 36">
        <line x1="10" y1="10" x2="26" y2="26"></line>
        <line x1="26" y1="10" x2="10" y2="26"></line>
      </svg>
    </a>
    {{#show_adjacent_posts}}
    {{^entry.page}}
    <div>
      <a class="entry-next" {{#entry.next}}href="{{entry.next.url}}"{{/entry.next}}>
        <svg viewBox="0 0 36 36">
          <line x1="18" y1="18" x2="26" y2="10"></line>
          <line x1="18" y1="18" x2="26" y2="26"></line>
        </svg>
      </a>
    </div>
    <a>&nbsp;</a>
    {{/entry.page}}
    {{/show_adjacent_posts}}
  </div>    
  
  <div class="contents">
  {{#entry}}
    {{{html}}}
    {{> pluginHTML}}
  
  {{/entry}}
  </div>

  <div class="nav">
    <a class="entry-close" href="/" onclick="return closeEntry()">
      <svg viewBox="0 0 36 36">
        <line x1="10" y1="10" x2="26" y2="26"></line>
        <line x1="26" y1="10" x2="10" y2="26"></line>
      </svg>
    </a>
    {{#show_adjacent_posts}}
    {{^entry.page}}
    <div>
      <a class="entry-previous" {{#entry.previous}}href="{{entry.previous.url}}"{{/entry.previous}} >
        <svg viewBox="0 0 36 36">
          <line x1="10" y1="10" x2="18" y2="18"></line>
          <line x1="10" y1="26" x2="18" y2="18"></line>
        </svg>
      </a>
    </div>
    <a>&nbsp;</a>
    {{/entry.page}}
    {{/show_adjacent_posts}}
  </div>  
</div>

{{> footer}}
