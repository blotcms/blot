<div class="posts">
  {{#entries}}

  <!-- These posts have photos -->
  {{#thumbnail.large.url}}
  <a class="post photo collection-entry" href="{{{url}}}" style="
    max-width:{{thumbnail.large.width}}px;
    max-height:{{thumbnail.large.height}}px;
    width:calc({{thumbnail.large.width}}px*{{thumbnail_size}}/{{thumbnail.large.height}});
    flex-grow:calc({{thumbnail.large.width}}*{{thumbnail_size}}/{{thumbnail.large.height}})">
    <i style="padding-bottom:{{thumbnail.large.ratio}}"></i>
    <img
      src="{{{thumbnail.large.url}}}"
      srcset="
        {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
        {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
        {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
      "
      sizes="calc({{thumbnail.large.width}}px * {{thumbnail_size}} / {{thumbnail.large.height}})"
      width="{{thumbnail.large.width}}"
      height="{{thumbnail.large.height}}"
      alt="{{title}}"
      class="pre-loaded"
      onload="this.className+=' loaded';" />
    <noscript>  
    <img
      src="{{{thumbnail.large.url}}}"
      srcset="
        {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
        {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
        {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
      "
      sizes="calc({{thumbnail.large.width}}px * {{thumbnail_size}} / {{thumbnail.large.height}})"
      width="{{thumbnail.large.width}}"
      height="{{thumbnail.large.height}}"
      alt="{{title}}">
    </noscript>
    {{#show_title}}
    <span class="title">{{title}}</span>
    {{/show_title}}
  </a>
  {{/thumbnail.large.url}}

  <!-- These posts do not have photos -->
  {{^thumbnail.large.url}}
  <a class="post text collection-entry" href="{{{url}}}" style="flex-grow:{{thumbnail_size}}">
    <span class="title">{{title}}</span>
    {{#date}}<span class="date">{{date}}</span>{{/date}}
  </a>
  {{/thumbnail.large.url}}
  
  {{/entries}}
</div>
