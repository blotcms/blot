{{> header}}

<style type="text/css">
  form {
    padding: {{spacing}}rem;
    {{#show_search}}display: block;{{/show_search}}
    {{^show_search}}display: none;{{/show_search}}
  }

  input{
    line-height: {{font.line_height}};
    font-size: {{font.font_size}}px;
  }

  input[name="q"] {
    width: 300px;
  }
</style>
<form action="/search">
  <input type="text" name="q" placeholder="Search the archives">
  <input type="submit" value="Search">
</form>

<div class="archives">
  {{#archives}}
  {{#months}}
  {{#entries}}
  <a class="collection-entry" href="{{{url}}}">
    <span class="thumbnail">
    {{#thumbnail.small.url}}
        <img
          loading="lazy"
          src="{{{thumbnail.small.url}}}"
          srcset="
            {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
            {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
            {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
          "
          sizes="80px"
          width="{{thumbnail.small.width}}"
          height="{{thumbnail.small.height}}"
          alt="{{title}}"
          class="pre-loaded"
          onload="this.className+=' loaded';" />
      <noscript>  
      <img
        loading="lazy"
        src="{{{thumbnail.small.url}}}"
        srcset="
          {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
          {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
          {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
        "
        sizes="80px"
        width="{{thumbnail.small.width}}"
        height="{{thumbnail.small.height}}"
        alt="{{title}}">
      </noscript>
    {{/thumbnail.small.url}}
    </span>
    <span><span class="title">{{title}}</span>{{#date}}<span class="date">{{date}}</span>{{/date}}</span>
  </a>
  {{/entries}}
  {{/months}}
  {{/archives}}
</div>

{{> footer}}
