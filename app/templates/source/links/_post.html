<a href="{{{url}}}" class="post collection-entry {{#thumbnail.medium}}zoomable{{/thumbnail.medium}} {{^thumbnail.medium}}no-thumbnail{{/thumbnail.medium}}">
  <span class="thumbnail">
    <span class="container">
      {{#thumbnail.medium}}
      <img
        src="{{{url}}}"
        srcset="
          {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
          {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
          {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
        "
        sizes="(max-width: 500px) 100vw, (max-width: 900px) calc(100vw / min(2, {{columns}})), (max-width: 1200px) calc(100vw / min(3, {{columns}})), calc(100vw / {{columns}})"
        class="fadeMe"
        onload="this.className+=' fadeIn';" />
      <noscript>  
      <img
        src="{{{url}}}"
        srcset="
          {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
          {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
          {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
        "
        sizes="(max-width: 500px) 100vw, (max-width: 900px) calc(100vw / min(2, {{columns}})), (max-width: 1200px) calc(100vw / min(3, {{columns}})), calc(100vw / {{columns}})" />
      </noscript>
      {{/thumbnail.medium}}
      {{^thumbnail.medium}}
      <span style="width:100%">
        <span style="display:block;margin:0.65em 1.3rem;box-sizing:border-box;overflow:hidden;color:var(--medium-text-color);
  font-size:24px">
        {{title}}
      </span>
      {{#date}}<span style="font-size:13px;display:block;">Added <span date-from-now="{{dateStamp}}" >{{date}}</span></span>{{/date}}
    </span>
      {{/thumbnail.medium}}
    </span>
  </span>
  {{#thumbnail.medium}}
  <span style="display:block;box-sizing:border-box;padding:0 2rem;width:100%;white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;">{{title}}</span>
  {{#date}}<span class="date">Added       <span date-from-now="{{dateStamp}}">{{date}}</span>
  </span>{{/date}}
  {{/thumbnail.medium}}
</a>
