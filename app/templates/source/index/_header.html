<header class="site-header">
  <a href="/" id="logo">
    {{#profile_image.thumbnails.square}}
    <img width="{{width}}" height="{{height}}" src="{{{url}}}" alt="{{title}}"/><br>
    {{/profile_image.thumbnails.square}}
    {{^profile_image.thumbnails.square.url}}
    {{#avatar}}
    <img src="{{{avatar_url}}}" class="{{#roundAvatar}}rounded{{/roundAvatar}}" alt="{{title}}"/><br>
    {{/avatar}}
    {{/profile_image.thumbnails.square.url}}
    {{#show_title}}{{title}}{{/show_title}}
  </a>
  <nav class="site-nav">
    {{#menu}}
    <a class="menu" href="{{{url}}}" title="{{label}}">{{label}}</a>
    {{/menu}}
  </nav>
</header>
<hr class="full">
