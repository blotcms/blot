<header class="site-header">
  <a href="/" id="logo">
    {{#profile_image.thumbnails.small}}
    <img width="{{width}}" height="{{height}}" src="{{{url}}}" srcset="{{{url}}} {{width}}w{{#profile_image.thumbnails.medium}}, {{{url}}} {{width}}w{{/profile_image.thumbnails.medium}}{{#profile_image.thumbnails.large}}, {{{url}}} {{width}}w{{/profile_image.thumbnails.large}}" sizes="128px" alt="{{title}}"/><br>
    {{/profile_image.thumbnails.small}}
    {{^profile_image.thumbnails.small.url}}
    {{#avatar}}
    <img src="{{{avatar_url}}}" class="{{#roundAvatar}}rounded{{/roundAvatar}}" alt="{{title}}"/><br>
    {{/avatar}}
    {{/profile_image.thumbnails.small.url}}
    {{#show_title}}{{title}}{{/show_title}}
  </a>
  <nav class="site-nav">
    {{#menu}}
    <a class="menu" href="{{{url}}}" title="{{label}}">{{label}}</a>
    {{/menu}}
  </nav>
</header>
<hr class="full">
