<!DOCTYPE html>
<html>
  {{> head}}
  <body>
    {{> header}}

    <form action='/search'>
      <input name="q" type="text" placeholder="Enter a search term..." value="{{#query}}{{query}}{{/query}}" autofocus/>
      <input type="submit" value="Search">
    </form>

    <br>

    {{#query}}
    {{^entries}}
    <p>Sorry, nothing found for “{{query}}”</p>
    {{/entries}}
    {{/query}}

    {{#entries}}
    {{> post_row}}
    {{/entries}}

    {{> footer}}
  </body>
</html>
