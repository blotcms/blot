<!DOCTYPE html>
<html dir="auto">
  {{> head}}
  <body>
    {{> header}}
    <main>
      <h1>Search</h1>

      <form role="search">
        <label for="q">Search for</label>
        <input type="search" id="q" name="q" value="{{query}}">
        <button type="submit">Search</button>
      </form>

      {{#query}}
      {{#entries.length}}
      <ul>
        {{#entries}}{{> entry-item}}{{/entries}}
      </ul>
      {{/entries.length}}
      {{^entries.length}}
      <p>Nothing matches “{{query}}”.</p>
      {{/entries.length}}
      {{/query}}
    </main>
    {{> footer}}
  </body>
</html>
