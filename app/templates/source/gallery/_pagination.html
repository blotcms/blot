{{! Links to the next and previous pages for readers without script; with script, script.js hides them and loads later pages as the list scrolls. }}
{{#entries.pagination}}
<nav class="pagination" aria-label="Pagination" data-pagination data-base="{{#tag}}/tagged/{{slug}}{{/tag}}" data-current="{{current}}" data-total="{{total}}">
  {{#previous}}<a href="{{#tag}}/tagged/{{slug}}{{/tag}}/page/{{previous}}" rel="prev">← Previous</a>{{/previous}}
  {{#next}}<a href="{{#tag}}/tagged/{{slug}}{{/tag}}/page/{{next}}" rel="next">Next →</a>{{/next}}
</nav>
{{/entries.pagination}}
