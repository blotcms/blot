<li data-entry>
  <div class="item">
    <a href="{{{url}}}"{{#thumbnail.large.url}} data-html="{{html}}" data-title="{{title}}" data-preview="{{{thumbnail.large.url}}}" data-width="{{thumbnail.large.width}}" data-height="{{thumbnail.large.height}}"{{/thumbnail.large.url}}>
      {{#thumbnail.medium}}
      <img
        src="{{{url}}}"
        srcset="{{{thumbnail.small.url}}} {{thumbnail.small.width}}w, {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w, {{{thumbnail.large.url}}} {{thumbnail.large.width}}w"
        sizes="(min-width: 1200px) calc((100vw - 300px) / 6), (min-width: 800px) calc((100vw - 300px) / 3), 50vw"
        alt=""
        width="{{width}}"
        height="{{height}}"
        loading="lazy"
        decoding="async">
      {{/thumbnail.medium}}
      <div class="caption">
        <h2><span>{{title}}</span></h2>
        {{#tags.length}}<p class="tags">{{#tags}}<span>{{name}}</span>{{/tags}}</p>{{/tags.length}}
        {{^hide_dates}}<p class="detail">{{#formatDate}}{{date_display}}{{/formatDate}}</p>{{/hide_dates}}
      </div>
      {{#thumbnail.large.url}}<template class="entry-details">{{> details}}</template>{{/thumbnail.large.url}}
    </a>
  </div>
</li>
