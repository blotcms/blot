<header>

<a href="/" title="Home" class="site-title {{#is_active}}/{{/is_active}}">{{#profile_image.thumbnails.small}}<img width="{{width}}" height="{{height}}" src="{{{url}}}" data-profile-image srcset="{{{profile_image.srcset}}}" sizes="32px" alt="" class="site-logo">{{/profile_image.thumbnails.small}}<strong>{{title}}</strong></a>

{{#show_tags_in_navigation}}
<nav class="tags">
{{#all_tags}}
<a href="/tagged/{{slug}}" title="{{name}}" class="{{active}}">{{name}}</a>
{{/all_tags}}
</nav>
{{/show_tags_in_navigation}}

<nav class="menu">
{{#menu}}
<a href="{{{url}}}" title="{{label}}" class="{{active}}">{{label}}</a>
{{/menu}}
</nav>

</header>
