<div class="entry">

  <a class="full" href="{{{url}}}"></a>

  {{#thumbnail.small}}
  <span class="frame" style="width:min(100%, 100% * {{width}} / {{height}});height:min(100%, 100% * {{height}} / {{width}})">
    <img
      class="thumb pre-loaded"
      onload="this.classList.add('loaded')"
      onerror="this.classList.add('loaded')"
      loading="lazy"
      src="{{{url}}}"
      srcset="
        {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
        {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
        {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
      "
      sizes="{{thumbnail_size}}px"
      width="{{width}}"
      height="{{height}}" />
    <noscript>
      <img
        class="thumb"
        loading="lazy"
        src="{{{url}}}"
        srcset="
          {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
          {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
          {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
        "
        sizes="{{thumbnail_size}}px"
        width="{{width}}"
        height="{{height}}" />
    </noscript>
  </span>
  {{/thumbnail.small}}

  {{^thumbnail.small}}
  <div class="teaser">
    {{{titleTag}}}
    {{{teaser}}}
  </div>
  {{/thumbnail.small}}
</div>
