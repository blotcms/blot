{{> head}}

<div class="header">
  {{> profile}}
</div>

<div class="subheading-column fade-in">
  <h2>Archives</h2>
  {{^archives.length}}
  <p>No entries yet.</p>
  {{/archives.length}}
  {{#archives}}
  <h2>{{year}}</h2>

  {{#entries}}

  <p><a href="{{{url}}}">{{title}}</a></p>
  {{/entries}}
  {{/months}}
  {{/archives}}
</div>

{{> footer}}
