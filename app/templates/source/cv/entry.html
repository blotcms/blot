        {{> profile}}
    </div>

    {{#recent_entries.length}}
    <h2 class="section-nav">
        {{#menu}}<a href="{{{url}}}" class="{{#active}}selected{{/active}}">{{label}}</a>{{/menu}}
    </h2>
    {{/recent_entries.length}}

    {{^recent_entries.length}}

        {{#menu}}<a href="{{{url}}}" class="{{#active}}selected{{/active}}">{{label}}</a>{{/menu}}
    </h2>
    {{/recent_entries.length}}

    <div class="fade-in entry">
        {{{entry.html}}}
    </div>
</div>

{{> footer}}
