{{> header}}

{{#sticky_navigation}}
<div style="height: calc({{spacing}}rem + 1.4em)"></div>
{{/sticky_navigation}}

<style type="text/css">
  .archive-search {
    display: flex;
    align-items: center;
    margin: 2rem {{spacing}}rem {{spacing}}rem;
  }

  .archive-search form {
    display: flex;
    width: 100%;
    margin: 0;
    border-radius: 4px;
    transition: box-shadow ease-in-out 0.15s;
  }

  .archive-search form:focus-within {
    box-shadow: 0 0 0 2px rgba({{#rgb}}{{link_color}}{{/rgb}}, 0.25);
  }

  .archive-search input:focus {
    outline: none;
  }

  .archive-search input {
    display: block;
    box-sizing: border-box;
    padding: 0.25rem 0.5rem;
    border: 1px solid rgba({{#rgb}}{{text_color}}{{/rgb}}, 0.2);
    border-radius: 4px;
    background-color: {{background_color}};
    background-image: none;
    color: rgba({{#rgb}}{{text_color}}{{/rgb}}, 0.5);
    font-size: 1rem;
    line-height: 1.5;
    transition: border-color ease-in-out 0.15s, box-shadow ease-in-out 0.15s;
  }

  .archive-search input[type="text"] {
    min-width: 0;
    flex-grow: 1;
    flex-shrink: 1;
    box-shadow: inset 0 1px 1px rgba({{#rgb}}{{text_color}}{{/rgb}}, 0.075);
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }

  .archive-search input[type="submit"] {
    flex-grow: 1;
    flex-shrink: 1;
    max-width: 100px;
    font-weight: 500;
    text-align: center;
    border-left: none;
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
    color: rgba({{#rgb}}{{text_color}}{{/rgb}}, 0.8);
    cursor: pointer;
  }

  .archives {
    display: flex;
    flex-wrap: wrap;
  }

  .archives a {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 220px;
    padding: 1.3rem;
    color: inherit;
    font-size: 0.8rem;
    text-align: center;
    text-decoration: none;
  }

  .archives a .thumbnail {
    display: flex;
    align-items: center;
    width: 80px;
    height: 80px;
  }

  .archives a .thumbnail-empty {
    box-sizing: border-box;
    height: 80px;
    background: rgba({{#rgb}}{{text_color}}{{/rgb}}, 0.04);
  }

  .archives a .title {
    display: block;
    max-height: calc(1 * {{font.line_height}}em);
    overflow: hidden;
  }

  .archives a span.date {
    display: block;
    opacity: 0.5;
  }

  .archives a:hover {
    opacity: 0.8;
  }

  .archives a:active {
    opacity: 0.7;
  }

  .archives a img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
  }

  {{#hide_dates}}
  .archives .date {
    display: none;
  }
  {{/hide_dates}}
</style>

<div class="archive-search">
  <form action="/search">
    <input type="text" name="q" value="{{query}}" placeholder="Search the archives..." {{#query}}autofocus{{/query}}>
    <input type="submit" value="Search">
  </form>
</div>

<div class="archives">
  {{#entries}}
  <a class="collection-entry" href="{{{url}}}">
    <span class="thumbnail{{^thumbnail.small.url}} thumbnail-empty{{/thumbnail.small.url}}">
      {{#thumbnail.small.url}}
      <img
        loading="lazy"
        src="{{{thumbnail.small.url}}}"
        srcset="
          {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
          {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
          {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
        "
        sizes="80px"
        width="{{thumbnail.small.width}}"
        height="{{thumbnail.small.height}}"
        alt="{{title}}"
        class="pre-loaded"
        onload="this.className+=' loaded';" />
      <noscript>
        <img
          loading="lazy"
          src="{{{thumbnail.small.url}}}"
          srcset="
            {{{thumbnail.small.url}}} {{thumbnail.small.width}}w,
            {{{thumbnail.medium.url}}} {{thumbnail.medium.width}}w,
            {{{thumbnail.large.url}}} {{thumbnail.large.width}}w
          "
          sizes="80px"
          width="{{thumbnail.small.width}}"
          height="{{thumbnail.small.height}}"
          alt="{{title}}">
      </noscript>
      {{/thumbnail.small.url}}
    </span>
    <span>
      <span class="title">{{title}}</span>
      {{#date}}<span class="date">{{date}}</span>{{/date}}
    </span>
  </a>
  {{/entries}}
</div>

{{> footer}}
