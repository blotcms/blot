{{#account}}

<form method='post' class="dashboard-form" style="padding-top:0;margin-top:0">

  <p>Your site’s files are kept, and your iCloud Drive folder is left as it is. You can then switch to Dropbox, Git or another way of syncing.</p>

  <input type="hidden" name="_csrf" value="{{csrftoken}}">
  <div class="buttons">
    <button type="submit">Disconnect from iCloud</button>

    <a href="{{{base}}}">Cancel</a>
  </div>
</form>

{{/account}}
