{{#account}}

<form method='post' class="dashboard-form" style="padding-top:0;margin-top:0">

  <p>If you <b>disconnect from iCloud</b>, you can switch to another way of syncing, such as Dropbox or Git. Blot keeps your site’s files and copies them to the new folder. Your folder in iCloud Drive stays as it is.</p>

    <a href="{{{base}}}">Cancel</a>
  </div>
</form>
