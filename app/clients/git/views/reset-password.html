<form method="post" class="dashboard-form">
  <input type="hidden" name="_csrf" value="{{csrftoken}}">
  <p>Reset the password for your Git repository? The old password stops working, so you’ll need to enter the new one the next time you push or pull.</p>
  <div class="buttons">
    <button type="submit">Reset password</button>
    <a href="{{{base}}}">Cancel</a>
  </div>
</form>
