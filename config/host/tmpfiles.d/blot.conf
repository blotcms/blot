# /run is a tmpfs; recreate the directory for the app containers' Unix sockets
# at boot, owned by the app's uid (see SOCKET_DIRECTORY in scripts/deploy/constants.js)
d /run/blot 0755 1000 1000 -
# rsyslog's socket for the units' logs (rsyslog/blot-app-log.conf). Readable, so
# the deploy (not root) can see it is there
d /run/blot-log 0755 root root -
