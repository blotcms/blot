[Unit]
# Wants=/After= (not Requires=) because Requires= propagates an explicit
# stop or restart of mount-instance-store.service to docker.service too
# (systemd.unit(5)), which would take down every running container the
# moment someone ran `systemctl stop|restart mount-instance-store`. The
# ExecStartPre below checks the actual invariant we care about instead:
# is /var/instance-ssd really mounted, however it got that way.
Wants=mount-instance-store.service
After=mount-instance-store.service

[Service]
# /usr/bin/mountpoint ships in util-linux, standard on AL2/AL2023.
ExecStartPre=/usr/bin/mountpoint -q /var/instance-ssd
