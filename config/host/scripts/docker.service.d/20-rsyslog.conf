[Unit]
# The units log through rsyslog's socket (rsyslog/blot-app-log.conf), and
# Docker's syslog driver refuses to start a container while the socket is
# missing, so at boot docker starts after rsyslog. Wants=, not Requires=, for
# the reason in 10-instance-store.conf: restarting rsyslog must not take docker
# and every container with it.
Wants=rsyslog.service
After=rsyslog.service
