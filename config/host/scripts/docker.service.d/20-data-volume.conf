[Unit]
# Wants=/After= (not Requires=) for the same reason as 10-instance-store.conf:
# Requires= would take down docker.service, and every running container, the
# moment someone stopped or restarted mount-data-volume.service. The
# ExecStartPre below checks the invariant we care about instead: is
# /var/www/blot/data really a mount, however it got that way. Without it,
# docker would start containers against the empty directory on the root disk.
Wants=mount-data-volume.service
After=mount-data-volume.service

[Service]
# /usr/bin/mountpoint ships in util-linux, standard on AL2/AL2023.
ExecStartPre=/usr/bin/mountpoint -q /var/www/blot/data
