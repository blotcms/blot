[Unit]
# Wants=/After= (not Requires=) for the same reason as 10-instance-store.conf:
# Requires= would take down docker.service, and every running container, the
# moment someone stopped or restarted mount-data-volume.service. But a failed
# Wants= unit does not stop docker starting, and "is something mounted there"
# is not enough either (a wrong volume would pass), so the ExecStartPre runs
# the mount script itself: it is idempotent, mounting the configured volume if
# nothing is there and otherwise checking the device and its marker, and it
# exits non-zero, keeping docker down, on anything else. Without it, docker
# could start containers against the empty directory on the root disk.
Wants=mount-data-volume.service
After=mount-data-volume.service

[Service]
ExecStartPre=/home/ec2-user/scripts/mount-data-volume.sh
