[Service]
# Amazon Linux's weekly fstrim.timer runs fstrim.service, which trims only the
# filesystems listed in /etc/fstab. mount-instance-store.sh mounts the NVMe
# instance store outside fstab, so without this it is never trimmed after mkfs,
# while tmp pruning, the proxy's cache eviction and log rotation keep deleting
# from it. The root EBS volume does not support discard, so the stock run trims
# nothing at all. The fstab run is a oneshot, so this ExecStart runs after it.
# The mountpoint check keeps it from trimming the root filesystem (which would
# fail) when the instance store is not mounted.
ExecStart=/bin/sh -c 'if mountpoint -q /var/instance-ssd; then exec /usr/sbin/fstrim --verbose /var/instance-ssd; fi'
