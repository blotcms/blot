[Unit]
# jail.local reads /var/instance-ssd/logs/access.log, and fail2ban exits at
# startup if a logpath is missing, so it must not start before that disk is
# mounted. Wants=/After= (not Requires=) for the same reason as docker's drop-in:
# restarting the mount unit must not take fail2ban with it.
Wants=mount-instance-store.service
After=mount-instance-store.service
