# Installed by config/host/deploy.sh as /etc/rsyslog.d/blot-app-log.conf.
#
# The units' output (Node, the supervisor, the sandbox: everything on the
# container's stdout and stderr) reaches this socket through Docker's syslog
# log driver (proxy/deploy/common.sh, run_args), and is appended to app.log
# on the instance store, next to access.log. Unlike the json-file logs, which
# `docker rm` deletes with the container, it outlives deploys. Each line starts
# with rsyslog's receive time and the tag the deploy gives the container,
# <container>/<commit>, e.g.
#
#   2026-11-07T11:24:54.521837+00:00 blot-blue/ea164cd [07/Nov/2026:...] [blue/node-a] ...
#
# Its own ruleset, so none of it goes to /var/log/messages or the journal, and
# no rate limit: a busy minute must not drop lines. logrotate/app-log rotates
# it. Amazon Linux 2023's rsyslog.conf loads imuxsock already (with the system
# socket off), so this only adds an input; deploy.sh checks the config with
# rsyslogd -N1 before restarting rsyslog.

# Docker splits a line at 16K; rsyslog's default would cut one at 8K
global(maxMessageSize="64k")

template(name="BlotAppLog" type="string"
  string="%timegenerated:::date-rfc3339% %syslogtag:F,91:1%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# Owned by ec2-user, whom scripts/prod/read.sh connects as: rsyslog.service
# runs with UMask=0066, so whatever fileCreateMode says, the file is created
# 0600 and only its owner can read it
ruleset(name="blotAppLog") {
  action(type="omfile" file="/var/instance-ssd/logs/app.log" template="BlotAppLog"
    fileOwner="ec2-user" fileGroup="ec2-user" fileCreateMode="0644"
    asyncWriting="on" flushInterval="1" ioBufferSize="256k")
  stop
}

# /run/blot-log comes from tmpfiles.d/blot.conf. Any local user could write to
# the socket, but on this host every user that matters is in the docker group
# (root in all but name) anyway.
input(type="imuxsock" socket="/run/blot-log/app.sock" createPath="off"
  ruleset="blotAppLog" rateLimit.interval="0" useSysTimeStamp="on")
