[Definition]
failregex = ^.*? [a-f0-9]+ 444 .*?ip=<HOST>.*$
# Skip whitelisted peers (wl=1: Bunny edges and the macserver, from the proxy's geo $whitelist): their ip= is never the real client.
# Anchored on the server-written fields before ref=, so a spoofed Referer or User-Agent can't fake it. Lines without wl= still match failregex.
ignoreregex = ^[^=]*?\scache=\S* ip=\S+ st=\S+ lrs=\S* up=[^=]*? conn=\S+ cr=\S+ tls=\S+ wl=1 ref=
