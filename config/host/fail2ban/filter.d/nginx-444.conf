[Definition]
failregex = ^.*? [a-f0-9]+ 444 .*?ip=<HOST>.*$
# Skip whitelisted peers (wl=1: Bunny edges and the macserver, from the proxy geo $whitelist): their ip= is never the real client.
# Anchored on the token count to the real cache=, so a spoofed Referer or User-Agent cannot fake it. Lines without wl= still match failregex.
ignoreregex = ^(?:\S* ){1,10}cache=\S* ip=\S+ st=[^=]* lrs=\S* up=[^=]* conn=\S+ cr=\S+ tls=\S+ wl=1 ref=
