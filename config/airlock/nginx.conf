# Front for Chromium's DevTools endpoint.
#
# Alpine's Chromium binds --remote-debugging-port to 127.0.0.1 only (it
# ignores --remote-debugging-address), and its /json/* HTTP endpoints reject
# any request whose Host header is not an IP or "localhost" (anti DNS-rebind).
# So the Blot app cannot reach it as "http://airlock:9222" directly.
#
# nginx listens on all interfaces and forwards to Chromium with Host reset to
# localhost, and carries the WebSocket upgrade for the actual CDP traffic.
#
# puppeteer.connect({ browserURL }) does NOT rewrite the ws:// host it reads
# out of /json/version - it dials whatever that field says, verbatim. So the
# sub_filter rules below are load-bearing, not cosmetic: they rewrite
# Chromium's "ws://localhost:9221/..." into "ws://<host the client dialled>/..."
# before the response leaves this container. Without them puppeteer.connect
# would try to open a websocket to 127.0.0.1:9221 on the CALLER's machine and
# fail. (devtoolsFrontendUrl still carries localhost:9221 - sub_filter only
# matches the ws:// form above, and puppeteer never reads that field, so it's
# left as-is rather than adding a rule nothing exercises.)

worker_processes 1;
error_log stderr warn;
events { worker_connections 256; }

http {
    access_log off;

    # Writable temp paths for the unprivileged 'airlock' user.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 9222;

        location / {
            proxy_pass http://127.0.0.1:9221;
            proxy_set_header Host localhost:9221;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Chromium builds webSocketDebuggerUrl from the Host header it
            # sees - which we've forced to localhost:9221. Rewrite it in the
            # JSON response back to the address the client actually dialled
            # ($http_host = the Host header they sent, e.g. airlock:9222) so
            # puppeteer.connect({ browserURL }) dials a reachable ws:// URL.
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter "ws://localhost:9221/"  "ws://$http_host/";
            sub_filter "ws://127.0.0.1:9221/"  "ws://$http_host/";
        }
    }
}
