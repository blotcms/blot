# Airlock forward proxy.
#
# The Blot app points node-fetch at this proxy (BLOT_AIRLOCK_PROXY_URL) so
# that downloads of user-supplied URLs leave from inside this container's
# filtered network namespace. This proxy does NOT do destination filtering -
# that is enforced by egress.nft. Its only job is to be the egress point.
#
# For HTTPS the client sends CONNECT and the proxy opens an opaque TCP
# tunnel; it never sees the URL path and never terminates TLS.

User airlock
Group airlock

Port 8888
Listen 0.0.0.0
Timeout 600

# Client ACL: which source addresses may use the proxy. These are the
# private Docker networks the Blot app containers sit on - NOT a list of
# allowed destinations. Narrow to the specific bridge subnet in production
# if you want. With no Allow line tinyproxy would accept from anywhere.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 127.0.0.1

# Deliberately no ConnectPort restriction. tinyproxy's ConnectPort is a port
# allow-list checked before egress.nft ever sees the connection - e.g.
# limiting it to 443 would reject "https://host:8443/photo.png" with a 403
# even though egress.nft would happily let that connection through. Since
# egress.nft is the actual destination control (see its comment for why),
# and this container is reachable only from Blot's own app containers, an
# unrestricted CONNECT port doesn't add a real capability an attacker didn't
# already have via a public IP on port 443.

DisableViaHeader Yes

# Requesting this host through the proxy returns tinyproxy's own stats page
# without any outbound traffic - used by the container HEALTHCHECK.
StatHost "tinyproxy.stats"
