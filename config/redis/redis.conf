# Blot's Redis configuration (redis6 6.2.x on Amazon Linux 2023).
# Installed as /etc/redis6/redis6.conf by host/setup.sh. Settings that are not
# listed here keep their Redis defaults. Redis never rewrites this file:
# changes are made here, then applied with bootstrap.sh (CONFIG SET for what
# can change at runtime, a restart for the rest).
#
# The systemd unit passes --daemonize no --supervised systemd.

# --- Network ---------------------------------------------------------------

# Listen on every interface; the app host reaches us over the VPC. The
# security group is the only protection (no auth or TLS yet).
bind 0.0.0.0
protected-mode no
port 6379

# A Unix socket for clients on this host (the app containers bind-mount
# /run/blot). TCP stays on for replication and remote clients. The directory
# comes from /etc/tmpfiles.d/blot-redis.conf (host/setup.sh), since /run is a
# tmpfs and Redis exits at start if it cannot bind the socket. Mode 777: the
# containers run as uid 1000, which cannot join the redis6 group, and deploy
# runs redis-cli too; no wider than the unauthenticated loopback TCP port.
# A running Redis picks these up only at its next restart.
unixsocket /run/blot/redis/redis.sock
unixsocketperm 777

# Match net.core.somaxconn (4096 in /etc/sysctl.d/90-blot-redis.conf) so a
# burst of app reconnects is not dropped.
tcp-backlog 1024

# Never drop idle clients, but notice dead peers within a minute.
timeout 0
tcp-keepalive 60

maxclients 10000

# --- Files -----------------------------------------------------------------

pidfile /run/redis6/redis6.pid
logfile /var/log/redis6/redis6.log
dir /var/lib/redis6
dbfilename dump.rdb

# --- Persistence: RDB only -------------------------------------------------

# At most one save every 5 minutes. Each save forks and takes tens of seconds,
# and on a single vCPU it competes with Redis's main thread; the old
# "save 60 10000" made Redis save every 1-2 minutes.
# Backups (bin/backup.sh) copy this file, so it is also the recovery point.
save 3600 1
save 300 100

# Refuse writes if a save fails, rather than carry on unprotected.
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
rdb-save-incremental-fsync yes

# AOF stays off for now; revisit with the Redis upgrade.
appendonly no

# --- Memory ----------------------------------------------------------------

# maxmemory itself is set from the host's RAM in blot-memory.conf (below).
# noeviction: Blot stores real data, so error on writes at the limit
# instead of silently deleting keys.
maxmemory-policy noeviction

# Free big keys and flushed data in a background thread, so a large DEL or
# expiry does not stall every client.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
replica-lazy-flush yes

# Transparent huge pages cause fork latency spikes and extra copy-on-write.
# Redis turns them off for itself here; blot-disable-thp.service also sets the
# system-wide setting to "never" before Redis starts.
disable-thp yes
jemalloc-bg-thread yes

# --- Replication -----------------------------------------------------------

# A big backlog lets a replica that briefly disconnects resync partially
# instead of copying the whole dataset again.
repl-backlog-size 256mb

# A replica that falls behind during a full sync gets up to 1GB of buffered
# writes (512MB sustained for 120s) before it is disconnected.
client-output-buffer-limit replica 1gb 512mb 120

# Send the RDB via disk: the dump already exists, and diskless sync would fork
# a second time while a save may be running.
repl-diskless-sync no

# --- Diagnostics -----------------------------------------------------------

latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 1024

# --- Kill order ------------------------------------------------------------

# On a host shared with the app, Redis must outlast everything under memory
# pressure. The service runs at OOMScoreAdjust=-900 (host/setup.sh) and the
# BGSAVE child inherits it, so 1900 lifts the child to the 1000 ceiling (Redis
# clamps to the kernel's range). A kill then frees its copy-on-write memory
# and fails one save instead of taking Redis. 0 leaves the master and a replica
# at the service's -900. Harmless on the Redis-only host.
oom-score-adj relative
oom-score-adj-values 0 0 1900

# --- Host-specific ---------------------------------------------------------

# maxmemory, about 70% of RAM, written by host/setup.sh at bootstrap time.
# Keep this last so it wins over anything above.
include /etc/redis6/blot-memory.conf
