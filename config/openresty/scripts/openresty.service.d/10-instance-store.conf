[Unit]
# Same reasoning as docker.service.d/10-instance-store.conf: Wants=/After=
# plus a mountpoint check in ExecStartPre, not Requires=, so a manual stop
# or restart of mount-instance-store.service can't take bare-metal openresty
# (the rollback target) down with it. This is what used to be a bare
# Before=openresty.service on the mount unit itself, which only ordered the
# two units and did nothing if the mount actually failed.
Wants=mount-instance-store.service
After=mount-instance-store.service

[Service]
ExecStartPre=/usr/bin/mountpoint -q /var/instance-ssd
