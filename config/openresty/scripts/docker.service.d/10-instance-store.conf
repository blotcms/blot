[Unit]
# Without this, a proxy container started with --restart unless-stopped can
# come up (and bind-mount /var/instance-ssd) before mount-instance-store.service
# has mounted the real ephemeral disk over that path, leaving it serving from
# an empty directory with no cache and no purge index until someone notices.
#
# Requires= (not Wants=/BindsTo=) so Docker refuses to start at all if the
# mount fails: on this host Docker only runs the blot-proxy-{blue,green,yellow}
# containers (the Node app containers are deployed separately, to a different
# host, by scripts/deploy), so refusing to start Docker here does not also
# take down the Node app. A proxy that never starts is easier to notice and
# safer than one silently serving from an empty cache. BindsTo= was not used
# because it would also stop Docker if the mount unit were later stopped or
# failed while already running, which is not something we want at runtime.
Requires=mount-instance-store.service
After=mount-instance-store.service
