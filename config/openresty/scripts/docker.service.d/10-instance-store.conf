[Unit]
# Without this, a container started with --restart unless-stopped can come up
# (and bind-mount /var/instance-ssd) before mount-instance-store.service has
# mounted the real ephemeral disk over that path, leaving it serving from an
# empty directory with no cache and no purge index until someone notices.
#
# Requires= (not Wants=/BindsTo=) so Docker refuses to start at all if the
# mount fails: this host runs both the blot-proxy-* containers and the
# blot-container-* Node containers (they publish 127.0.0.1:8088-8090, which
# the proxy config points at, see proxy/deploy/common.sh), so a failed mount
# holds back everything on the host, not just the proxy. That's still the
# right trade-off: the proxy on this host fronts all traffic either way, and
# serving from an empty, unmounted cache directory (no warm cache, no purge
# index) is worse than the host refusing to come up and paging someone.
# BindsTo= was not used because it would also stop Docker if the mount unit
# were later stopped or failed while already running, which is not wanted
# at runtime.
Requires=mount-instance-store.service
After=mount-instance-store.service
