user	  {{user}} {{user}};  ## Default: nobody

worker_processes auto;

# nginx clears the environment of worker processes except for the variables
# named here. cacher:authorized() reads BLOT_PURGE_TOKEN.
env BLOT_PURGE_TOKEN;

# Defines the scheduling priority for worker processes like it is done by the nice command:
# a negative number means higher priority. Allowed range normally varies from -20 to 20.
worker_priority -20;

# Sets the limit of the maximum number of open files (RLIMIT_NOFILE)
# for worker processes. Each proxied connection holds about two fds (client +
# upstream), so worker_connections 10000 below can need about 20000; this is
# 2x that plus headroom, well under the container's --ulimit nofile (65536,
# proxy/deploy/common.sh). The master runs as root, so it can raise this even
# on bare metal.
worker_rlimit_nofile 20480;

events {
    worker_connections 10000;
    multi_accept on;
}