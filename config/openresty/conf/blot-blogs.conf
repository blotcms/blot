
set $upstream_server blot_blogs_node;
root /;


# Match urls which start with /draft/stream/
location /draft/stream/ {
  {{> reverse-proxy-sse.conf}}
}

# This is used to determine whether the server is handling
# requests, don't remove it unless you change monit.rc too!
location = /health {
  return 200;
}

# Block access to sensitive dot-files and directories
# We use 444 to trigger a faster ban in fail2ban
# than ordinary 403 responses. 444 should be used for
# requests that are clearly malicious, and 403 should
# be used for plausibly legitimate requests.
location ~* ^/\.(circleci|vscode|aws|aws_|idea|gradle)(/|$) {
  limit_req zone=bots;
  return 444;
}

# Backup files with a .bak extension leaking source/config — no legitimate use
location ~* \.bak$ {
  limit_req zone=bots;
  return 444;
}

# SSRF/LFI probes that relay through generic endpoint names (/fetch, /proxy,
# /load, /out, /webhook, /read, /admin, etc.) to reach cloud metadata
# services or local files, or attempt command injection via query params.
# Require both the relay-endpoint path AND the malicious payload, rather
# than matching the payload anywhere in $request_uri — Blot's own /search
# route accepts arbitrary query strings (e.g. a technical blog searching
# for "file://" or a metadata IP), so payload-only matching would 444
# legitimate searches.
if ($request_uri ~* "^/(fetch|proxy|load|out|webhook|read|redirect|url|request|run|sse|admin|debug|status|console|system|v1/graphql|health/readiness)\?.*(169\.254\.169\.254|metadata\.google\.internal|metadata\.azure\.com|file(%3a%2f%2f%2f|://)|GSCAN_CMDI)") {
  return 444;
}

# .env scanning (largest single source of scanner traffic — hundreds of
# variants like .env.bak, .env.local, .env.production, app/.env, @fs/.env).
# Match anywhere in the path rather than requiring it to be the whole
# filename, since scanners suffix/prefix .env in every way imaginable.
location ~* \.env {
  limit_req zone=bots;
  return 444;
}

# .git anywhere in the path (.git/, .gitignore, .gitlab-ci.yml, .git-credentials)
location ~* \.git {
  limit_req zone=bots;
  return 444;
}

# Vite/webpack dev-server introspection and path-traversal probes
# (/@fs/..., /proc/self/environ, /proc/self/cgroup, /proc/self/cmdline)
location ~* (^/@fs/|/proc/self/) {
  limit_req zone=bots;
  return 444;
}

# Cloud credential and key files scanners look for. Anchored to the actual
# filename (segment start + .json/.conf extension) rather than matching
# these words anywhere in the path, since a blog post slug like
# /how-to-create-a-service-account/ is not a credential file.
location ~* (^|/)([a-z-]*service[_-]?account[a-z-]*|firebase-adminsdk|firebase-key|firebase-config|firebase-credentials|firebase|gcp-credentials|gcp-key|gcp-sa|gcp-service|gc-service|google-credentials|google-key|google-services|application_default_credentials|amplifyconfiguration|awsconfiguration|azuredeploy|push_config|sa|key|keyfile)\.json$ {
  limit_req zone=bots;
  return 444;
}

location ~* (^|/)rclone\.conf$ {
  limit_req zone=bots;
  return 444;
}

# SSH keys, npm/S3 config, htpasswd, terraform state, docker internals
location ~* (\.ssh/|id_rsa|id_dsa|id_ecdsa|id_ed25519|\.npmrc|\.htpasswd|\.s3cfg|terraform\.tfstate|\.dockerenv|\.docker/config\.json|server\.key|host\.key) {
  limit_req zone=bots;
  return 444;
}

# AWS/Azure/Kubernetes CLI credential directories, anywhere in the path
# (e.g. /root/.aws/credentials, /home/ubuntu/.azure/accessTokens.json,
# /@fs/.../.aws/credentials) — no legitimate blog use
location ~* (\.aws/|\.azure/|\.kube/config) {
  limit_req zone=bots;
  return 444;
}

# GCloud CLI credential directory (not covered by the .aws/.azure/.kube
# rule above), plus bare AWS/GCP/Google credential filenames scanners try
# at the root. Anchored to the full filename so this doesn't catch content.
location ~* (^|/)\.gcloud/ {
  limit_req zone=bots;
  return 444;
}

location ~* (^|/)(aws[-_]credentials|aws\.json|gcp\.json|google\.json)$ {
  limit_req zone=bots;
  return 444;
}

# Generic credential/token/key JSON files
location ~* (^|/)(keys|tokens|api[-_]keys|\.auth)\.json$ {
  limit_req zone=bots;
  return 444;
}

# AI coding agent config/credential files (can contain API keys). Scanners
# have started probing for these alongside the older cloud credential dirs.
location ~* (^|/)(\.?mcp\.json$|\.codex/|\.continue/|\.windsurf/|\.anthropic/|\.openai/|\.hermes/|opencode/auth\.json$) {
  limit_req zone=bots;
  return 444;
}

# More AI coding agent/assistant config directories and filenames scanners
# probe for (Claude Desktop, Cursor, Codeium/Windsurf, generic ai/llm/mcp
# config names) — can contain API keys.
location ~* (^|/)claude_desktop_config\.json$ {
  limit_req zone=bots;
  return 444;
}

location ~* (^|/)\.(cursor|codeium)/ {
  limit_req zone=bots;
  return 444;
}

location ~* (^|/)(ai|ai_config|llm|llm_config|mcp_config)\.json$ {
  limit_req zone=bots;
  return 444;
}

# private-key/private_key as an actual filename (optionally with an
# extension like .pem/.key), not a substring of a blog post slug like
# /using-a-private-key-with-ssh/
location ~* (^|/)private[-_]key(\.[a-z0-9]+)?$ {
  limit_req zone=bots;
  return 444;
}

# Generic env-disclosure JS files (env.js, public/env.js, src/env.js)
location ~* (^|/)env\.js$ {
  limit_req zone=bots;
  return 444;
}

# .svn/.bzr version control directories
location ~* ^/\.(svn|bzr)/ {
  limit_req zone=bots;
  return 444;
}

# Scanners probing for Claude Code project settings (may contain API keys)
location ~* ^/\.claude/ {
  limit_req zone=bots;
  return 444;
}

# Spring Boot actuator endpoints
location ~* ^/actuator/ {
  limit_req zone=bots;
  return 444;
}

# phpinfo probes in all their forms (phpinfo, phpinfo.php.bak, phpinfo.php~,
# etc.). Anchored to a path segment start so a technical blog post slug like
# /understanding-phpinfo/ (where "phpinfo" isn't at the start of a segment)
# doesn't get caught.
location ~* (^|/)phpinfo {
  limit_req zone=bots;
  return 444;
}

# Kubernetes service account token path
location ~* /var/run/secrets/kubernetes\.io/ {
  limit_req zone=bots;
  return 444;
}

# Laravel Ignition debug/RCE probes (CVE-2021-3129)
location ~* ^/_ignition/ {
  limit_req zone=bots;
  return 444;
}

# GeoServer RCE probes (CVE-2022-24816 etc). Anchored with a trailing slash
# so this doesn't match legitimate blog post slugs that happen to start
# with "geoserver" (e.g. /geoserver-1-7-2-continues-improvements...).
location ~* ^/geoserver/ {
  limit_req zone=bots;
  return 444;
}

# Laravel/Symfony/Nuxt debug and introspection endpoints
location ~* ^/(telescope|_debugbar|_profiler)/ {
  limit_req zone=bots;
  return 444;
}

# Nuxt-style prerendered payload probes (/dashboard/_payload.json,
# /settings/_payload.json, etc.) — Blot doesn't serve Nuxt apps
location ~* ^/[^/]+/_payload\.json$ {
  limit_req zone=bots;
  return 444;
}

location = /storage/logs/laravel.log {
  limit_req zone=bots;
  return 444;
}

location = /trace.axd {
  limit_req zone=bots;
  return 444;
}

location = /web.config {
  limit_req zone=bots;
  return 444;
}

location = /Dockerfile {
  limit_req zone=bots;
  return 444;
}

location ~* ^/(app-config|ngsw)\.json$ {
  limit_req zone=bots;
  return 444;
}

location ~* ^/(constants|runtime|configuration|aws-exports)\.js$ {
  limit_req zone=bots;
  return 444;
}

# Web server / app status and metrics endpoints
location ~* ^/(server-status|server-info|nginx_status)$ {
  limit_req zone=bots;
  return 444;
}

location = /metrics {
  limit_req zone=bots;
  return 444;
}

# API spec / schema introspection probes
location ~* ^/(openapi|swagger)\.json$ {
  limit_req zone=bots;
  return 444;
}

location = /graphql {
  limit_req zone=bots;
  return 444;
}

# Java/Spring framework config files
location ~* (^|/)(application|bootstrap)\.(ya?ml|properties)$ {
  limit_req zone=bots;
  return 444;
}

location = /gradle.properties {
  limit_req zone=bots;
  return 444;
}

# CouchDB and Firebase hosting introspection
location = /_all_dbs {
  limit_req zone=bots;
  return 444;
}

location = /__/firebase/init.json {
  limit_req zone=bots;
  return 444;
}

# Path-traversal probes disguised as image/file proxy endpoints
# (e.g. /userfiles?path=../../../.env, /_image?href=/../../../.env)
location ~* ^/(userfiles|_image)$ {
  limit_req zone=bots;
  return 444;
}

location = /manage/env {
  limit_req zone=bots;
  return 444;
}

location ~* ^/\.streamlit/ {
  limit_req zone=bots;
  return 444;
}

location ~* ^/secrets\.(ya?ml|toml)$ {
  limit_req zone=bots;
  return 444;
}

# Shell rc files, CI/build manifests, and JS files scanners probe for
# environment variable / config disclosure — no legitimate blog use
location ~* ^/(\.bashrc|\.zshrc|\.appveyor\.yml|ansible\.cfg|babel\.config\.js|behat\.yml|bower\.json|Cakefile|serverless\.ya?ml|config\.toml|env\.old|__env\.js|environment\.js|runtime-config\.js|credentials\.js|aws-config\.js|Makefile|Jakefile|Rakefile|Guardfile|Procfile|Gemfile(\.lock)?|Pipfile(\.lock)?|host\.json|icecast\.xml|keycloak\.json|kibana\.yml|kustomization\.ya?ml|karma\.conf\.js|lighttpd\.conf|log4j\.properties|jsconfig\.json|jsapi_ticket\.json|\.htdeployment|healthz|debug-kit)$ {
  limit_req zone=bots;
  return 444;
}

location = /kanboard/data/db.sqlite {
  limit_req zone=bots;
  return 444;
}

location = /inc/data/database.sdb {
  limit_req zone=bots;
  return 444;
}

location = /MagicInfo/config.js {
  limit_req zone=bots;
  return 444;
}

location = /backup/ovh-backups.json {
  limit_req zone=bots;
  return 444;
}

location = /cacti/log/cacti.log {
  limit_req zone=bots;
  return 444;
}

location = /ci/phpci.yml {
  limit_req zone=bots;
  return 444;
}

# return 403 immediately for all requests to URLs ending in .php, .asp, .aspx, .jsp, .php5, .php7, .php8, .py, .local, .sql, .sh
location ~* \.(?:php[0-9]?|asp|aspx|jsp|py|local|sql|sh)$ {
  limit_req zone=bots;
  return 403 '403';
}

location = /sftp-config.json {
  limit_req zone=bots;
  return 403 '403';
}

location = /magento_version {
  limit_req zone=bots;
  return 403 '403';
}

# Block sensitive directory paths
location ~* /(admin|modules|config|backend|api|ftp|vendor|php|vendor_admin|file-manager|jquery.filer|filemanager|jquery.upload|jquery-file-upload|jq_fileupload|gallery-upload|cgi-bin|alfa_data|debug|aws|maven)/ {
  limit_req zone=bots;
  return 403 '403';
}

location = /alfa-rexhp1.p {
  limit_req zone=bots;
  return 403 '403';
}

location = /gebase.php69 {
  limit_req zone=bots;
  return 403 '403';
}

# Block sensitive JSON files (appsettings.json, appsettings.Production.json, etc.)
location ~* ^/(appsettings(\.[A-Za-z]+)?|secrets|credentials|karma\.conf)\.json$ {
  limit_req zone=bots;
  return 403 '403';
}

# Block applinks/1.0 paths
location ~ applinks/1\.0 {
  limit_req zone=bots;
  return 403 '403';
}

# return 403 immediately for all requests to URLs containing '/wp-admin/', '/wp-content/', '/wp-includes/' anywhere in their path
location ~* wp-(?:admin|content|includes|diambar|json|config) {
  limit_req zone=bots;
  return 444;
}

# WordPress REST API discovery probes (/wp/v2/*, /wp/wp/v2/*,
# /wordpress/wp/v2/*) — not caught by the wp- prefix rule above since
# these paths lack the "wp-" prefix. Anchored to the "v2" REST namespace
# rather than the bare /wp/ or /wordpress/ prefix, since blogs imported
# from WordPress (see app/dashboard/site/import/sources/wordpress/) can
# have real content living at those paths.
location ~* ^/(wp|wordpress)/(wp/)?v2/ {
  limit_req zone=bots;
  return 444;
}

location ~* ^/(settings|config)\.(json|ya?ml|js)$ {
  limit_req zone=bots;
  return 403 '403';
}

location = /docker-compose.yml {
  limit_req zone=bots;
  return 444;
}

location = /docker-compose.yaml {
  limit_req zone=bots;
  return 444;
}

location = /package.json {
  limit_req zone=bots;
  return 403 '403';
}

location = /sites/default/settings.txt {
  limit_req zone=bots;
  return 403 '403';
}

location ~* ^/(mail|smtp|auth|email)\.json$ {
  limit_req zone=bots;
  return 403 '403';
}

location ~* ^/(mail\.config|nodemailer\.config)\.js$ {
  limit_req zone=bots;
  return 403 '403';
}

# special rule to handle an extremely expensive PDF on deepfates.com
location = /files/signal.pdf {
  return 301 https://cdn.blot.im/folder/v-dabf3d08/blog_b19d1020756c45a09c37091a7fa252fa/files/signal.pdf;
}

# special rule to handle an extremely expensive WAV
location = "/_assets/Field Notes From Shipping Real Code With Claude.wav" {
  return 301 https://cdn.blot.im/folder/v-32aee19c/blog_b4f0291594b44dc8a105111fe0e6e166/_assets/Field%20Notes%20From%20Shipping%20Real%20Code%20With%20Claude.wav;
}

# bypass the cache for requests to /random
# todo: handle this with headers instead of a separate location block
location = /random {
  {{> reverse-proxy.conf}}
}

# error page for when node server is unavailable
location = /error-upstream-offline.html {
  root  {{{config_directory}}}/html;
  try_files /error-upstream-offline-blog.html =404;
}

location / {
  {{> reverse-proxy-cache.conf}}
}
