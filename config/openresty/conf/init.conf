# The "auto_ssl" shared dict should be defined with enough storage space to
# hold your certificate data. 1MB of storage holds certificates for
# approximately 100 separate domains. Note that this should not cause an
# error if there are too many domains, just that nginx will have to look
# up the certificate in the database which is slower.
# 100mb = 10,000 domains
lua_shared_dict auto_ssl 100m;

# The "auto_ssl" shared dict is used to temporarily store various settings
# like the secret used by the hook server on port 8999. Do not change or omit.
lua_shared_dict auto_ssl_settings 64k;

# A DNS resolver must be defined for OCSP stapling to function.
#
# This example uses Google's DNS server. You may want to use your system's
# default DNS servers, which can be found in /etc/resolv.conf. If your network
# is not IPv6 compatible, you may wish to disable IPv6 results by using the
# "ipv6=off" flag (like "resolver 8.8.8.8 ipv6=off").
# https://github.com/auto-ssl/lua-resty-auto-ssl/issues/12#issuecomment-259402817
# found by running cat /etc/resolv.conf and looking for the nameserver value
resolver 8.8.8.8 ipv6=off;

# Internal server running on port 8999 for handling certificate tasks.
server {

  listen 127.0.0.1:8999;

  # Increase the body buffer size, to ensure the internal POSTs can always
  # parse the full POST contents into memory.
  client_body_buffer_size 128k;
  client_max_body_size 128k;

  location / {
    content_by_lua_block {
      auto_ssl:hook_server()
    }
  }
}

init_by_lua_block {

    cacher = (require "cacher").new()
    cacher:set("cache_directory", "{{{cache_directory}}}")
    cacher:set("shared_dictionary", ngx.shared.cacher_dictionary)
    cacher:set("minimum_free_space", 1024 * 1024 * 2) 

    auto_ssl = (require "resty.auto-ssl").new()

    local redis = require "resty.redis"

    local redis_options = { host = "{{redis.host}}", port = 6379 , prefix = "ssl" }

    auto_ssl:set("redis", redis_options)

    -- Certificates are stored in redis
    auto_ssl:set("storage_adapter", "resty.auto-ssl.storage_adapters.redis")

    -- This function determines whether the incoming domain
    -- should automatically issue a new SSL certificate.
    -- Domain persistence and routing are controlled by the
    -- application's domain:* Redis keys, regardless of cert state.
    -- If issuance fails, this must not remove/block a saved domain.
    -- I need to set domain:blot.im to foo in the database so that
    -- the allow_domain function works as expected even though
    -- it's not technically a user's domain

    local function allow_domain(domain)

        local certstorage = auto_ssl.storage
        
        local fullchain_pem, privkey_pem = certstorage:get_cert(domain)

        -- If we have this cert in the memory cache
        -- then return it without checking redis to save time
        if fullchain_pem then
            return true
        end

        -- Fail closed: if Redis cannot be reached, or errors or times out
        -- part way through, we cannot tell whether the domain is one of
        -- ours, so do not let auto-ssl issue a certificate for it.
        local connection, connection_err = certstorage.adapter:get_connection()

        if not connection then
            ngx.log(ngx.ERR, "allow_domain: cannot connect to redis for ", domain, ": ", connection_err)
            return false
        end

        local res, err = connection:get('domain:' .. domain)

        if err then
            ngx.log(ngx.ERR, "allow_domain: redis error for ", domain, ": ", err)
            -- do not reuse a connection that may be in an unknown state
            ngx.ctx.auto_ssl_redis_connection = nil
            connection:close()
            return false
        end

        if res == ngx.null then
            return false
        end

        return true
    end

    auto_ssl:set("allow_domain", allow_domain)

    auto_ssl:init()

    -- lua-resty-auto-ssl 0.13.1's redis adapter connects with no timeouts,
    -- so nginx's 60s default applies and an unreachable or unresponsive Redis
    -- stalls the TLS handshake for a minute. This is the adapter's
    -- get_connection plus timeouts. Handshakes, challenges and the hook
    -- server get a short one; the daily renewal timer gets a long one because
    -- it runs KEYS over the whole keyspace. allow_domain uses this too.
    -- Revisit when lua-resty-auto-ssl is upgraded or replaced.
    auto_ssl.storage.adapter.get_connection = function(self)
        local connection = ngx.ctx.auto_ssl_redis_connection
        if connection then
            return connection
        end

        connection = redis:new()

        local timeout = 2000
        if ngx.get_phase() == "timer" then
            timeout = 60000
        end
        connection:set_timeouts(timeout, timeout, timeout)

        local ok, err = connection:connect(
            self.options["host"], self.options["port"], self.options["connect_options"] or {}
        )
        if not ok then
            return false, err
        end

        if self.options["auth"] then
            ok, err = connection:auth(self.options["auth"])
            if not ok then
                return false, err
            end
        end

        ngx.ctx.auto_ssl_redis_connection = connection
        return connection
    end
}

init_worker_by_lua_block {
  auto_ssl:init_worker()
  -- worker 0 rebuilds the purge index in the background after a start
  cacher:start(ngx)
  if ngx.worker.id() == 0 then
    cacher:monitor_free_space(ngx)
  end
}
