# The "auto_ssl" shared dict should be defined with enough storage space to
# hold your certificate data. 1MB of storage holds certificates for
# approximately 100 separate domains. Note that this should not cause an
# error if there are too many domains, just that nginx will have to look
# up the certificate in the database which is slower.
# 100mb = 10,000 domains
lua_shared_dict auto_ssl 100m;

# The "auto_ssl" shared dict is used to temporarily store various settings
# like the secret used by the hook server on port 8999. Do not change or omit.
lua_shared_dict auto_ssl_settings 64k;

# Remembers for a few seconds that Redis could not be reached, so that during
# an outage each uncached TLS handshake does not pay for its own failed connect.
lua_shared_dict redis_backoff 64k;

# The last certificate read from Redis for each custom domain this proxy has
# served, kept until the certificate expires. Used only when Redis cannot be
# read, so that a Redis outage longer than auto_ssl's one-hour cache does not
# put every recently served custom domain on the fallback certificate (see
# init_by_lua below). Entries are PEM, a little larger than the DER auto_ssl
# keeps; when it is full the least recently used are dropped. Like auto_ssl,
# it survives `openresty -s reload` but not a restart or a new container.
lua_shared_dict auto_ssl_stale 100m;

# A DNS resolver must be defined for OCSP stapling to function.
#
# This example uses Google's DNS server. You may want to use your system's
# default DNS servers, which can be found in /etc/resolv.conf. If your network
# is not IPv6 compatible, you may wish to disable IPv6 results by using the
# "ipv6=off" flag (like "resolver 8.8.8.8 ipv6=off").
# https://github.com/auto-ssl/lua-resty-auto-ssl/issues/12#issuecomment-259402817
# found by running cat /etc/resolv.conf and looking for the nameserver value
resolver 8.8.8.8 ipv6=off;

# Internal server running on port 8999 for handling certificate tasks.
server {

  listen 127.0.0.1:8999;

  # Increase the body buffer size, to ensure the internal POSTs can always
  # parse the full POST contents into memory.
  client_body_buffer_size 128k;
  client_max_body_size 128k;

  location / {
    content_by_lua_block {
      auto_ssl:hook_server()
    }
  }
}

init_by_lua_block {

    cacher = (require "cacher").new()
    cacher:set("cache_directory", "{{{cache_directory}}}")
    cacher:set("shared_dictionary", ngx.shared.cacher_dictionary)
    cacher:set("minimum_free_space", 1024 * 1024 * 2) 

    auto_ssl = (require "resty.auto-ssl").new()

    -- Let's Encrypt stopped running OCSP in 2025 and its certificates no
    -- longer carry a responder URL, so stapling fails on every handshake for
    -- a custom domain. auto-ssl logs that at ngx.ERR by default, which buries
    -- real errors in error.log.
    auto_ssl:set("ocsp_stapling_error_level", ngx.NOTICE)

    local redis = require "resty.redis"

    local redis_options = { host = "{{redis.host}}", port = 6379 , prefix = "ssl" }

    auto_ssl:set("redis", redis_options)

    -- Certificates are stored in redis
    auto_ssl:set("storage_adapter", "resty.auto-ssl.storage_adapters.redis")

    -- This function determines whether the incoming domain
    -- should automatically issue a new SSL certificate.
    -- Domain persistence and routing are controlled by the
    -- application's domain:* Redis keys, regardless of cert state.
    -- If issuance fails, this must not remove/block a saved domain.
    -- I need to set domain:blot.im to foo in the database so that
    -- the allow_domain function works as expected even though
    -- it's not technically a user's domain

    local function allow_domain(domain)

        local certstorage = auto_ssl.storage
        
        -- A domain with a certificate in Redis is one of ours. During a
        -- handshake, so is one whose certificate this proxy read from Redis
        -- before, while Redis cannot be read now (get_cert below falls back
        -- to auto_ssl_stale), so a recently served domain keeps working.
        local cert = certstorage:get_cert(domain)

        if cert then
            return true
        end

        -- Fail closed: if Redis cannot be reached, or errors or times out
        -- part way through, we cannot tell whether the domain is one of
        -- ours, so do not let auto-ssl issue a certificate for it.
        local connection, connection_err = certstorage.adapter:get_connection()

        if not connection then
            ngx.log(ngx.ERR, "allow_domain: cannot connect to redis for ", domain, ": ", connection_err)
            return false
        end

        local res, err = connection:get('domain:' .. domain)

        if err then
            ngx.log(ngx.ERR, "allow_domain: redis error for ", domain, ": ", err)
            -- do not reuse a connection that may be in an unknown state
            ngx.ctx.auto_ssl_redis_connection = nil
            connection:close()
            return false
        end

        if res == ngx.null then
            return false
        end

        return true
    end

    auto_ssl:set("allow_domain", allow_domain)

    auto_ssl:init()

    -- lua-resty-auto-ssl 0.13.1's redis adapter connects with no timeouts,
    -- so nginx's 60s default applies and an unreachable or unresponsive Redis
    -- stalls the TLS handshake for a minute. This is the adapter's
    -- get_connection plus timeouts. Handshakes, challenges and the hook
    -- server get a short one; the daily renewal timer gets a long one because
    -- it walks the whole keyspace. allow_domain uses this too.
    -- After a failed connect, Redis is treated as down for a few seconds, so a
    -- burst of handshakes for uncached domains fails fast instead of each
    -- waiting out the connect timeout. The timer ignores this: it is rare and
    -- must not skip a renewal because of a blip.
    -- Revisit when lua-resty-auto-ssl is upgraded or replaced.
    local REDIS_BACKOFF_SECONDS = 5

    auto_ssl.storage.adapter.get_connection = function(self)
        local connection = ngx.ctx.auto_ssl_redis_connection
        if connection then
            return connection
        end

        local is_timer = ngx.get_phase() == "timer"

        if not is_timer and ngx.shared.redis_backoff:get("down") then
            return false, "redis is unreachable (backing off)"
        end

        connection = redis:new()

        local timeout = 2000
        if is_timer then
            timeout = 60000
        end
        connection:set_timeouts(timeout, timeout, timeout)

        local ok, err = connection:connect(
            self.options["host"], self.options["port"], self.options["connect_options"] or {}
        )
        if not ok then
            ngx.shared.redis_backoff:set("down", true, REDIS_BACKOFF_SECONDS)
            return false, err
        end

        if self.options["auth"] then
            ok, err = connection:auth(self.options["auth"])
            if not ok then
                return false, err
            end
        end

        ngx.ctx.auto_ssl_redis_connection = connection
        return connection
    end

    -- The adapter's keys_with_suffix runs KEYS ssl:*:latest, which the daily
    -- renewal timer uses to list every certificate. KEYS blocks Redis for
    -- the whole keyspace walk (~750ms in production), stalling every other
    -- client. This is the same lookup done with SCAN, which walks the
    -- keyspace in small steps. SCAN can return a key more than once, so
    -- results are deduplicated.
    auto_ssl.storage.adapter.keys_with_suffix = function(self, suffix)
        local connection, connection_err = self:get_connection()
        if not connection then
            return nil, connection_err
        end

        local prefix = self.options["prefix"]
        local pattern = "*" .. suffix
        -- First character past the prefix and a colon
        local offset = 1
        if prefix then
            pattern = prefix .. ":" .. pattern
            offset = string.len(prefix) + 2
        end

        local keys = {}
        local seen = {}
        local cursor = "0"

        repeat
            local res, err = connection:scan(cursor, "MATCH", pattern, "COUNT", 1000)
            if not res then
                return nil, err
            end

            cursor = res[1]

            for _, key in ipairs(res[2]) do
                if not seen[key] then
                    seen[key] = true
                    table.insert(keys, string.sub(key, offset))
                end
            end
        until cursor == "0"

        return keys
    end

    -- auto-ssl caches each certificate in the auto_ssl dict for an hour and
    -- then reads it from Redis again. If Redis cannot be read then, the
    -- domain gets the fallback certificate, so an outage longer than an hour
    -- would take HTTPS down for every custom domain. During a handshake, each
    -- certificate read from Redis is also kept in auto_ssl_stale until it
    -- expires, and that copy is used only when reading Redis fails. Whenever
    -- Redis answers, its certificate is used and replaces the stale copy (or,
    -- if Redis has none, the stale copy is dropped). A certificate served
    -- from the stale copy stays in auto_ssl for a minute rather than an hour,
    -- so once Redis is back a newer certificate in it is picked up quickly.
    -- Only handshakes use the stale copy: the renewal timer and the hook
    -- server always see what Redis says.
    local stale_certs = ngx.shared.auto_ssl_stale
    local STALE_RECHECK_SECONDS = 60
    -- Let's Encrypt certificates last 90 days; a copy with no expiry recorded
    -- is kept no longer than that.
    local STALE_MAX_SECONDS = 90 * 24 * 60 * 60

    local function remember_cert(storage, domain, cert)
        local ttl = STALE_MAX_SECONDS
        if tonumber(cert["expiry"]) then
            ttl = math.min(ttl, tonumber(cert["expiry"]) - ngx.time())
        end

        if ttl <= 0 then
            stale_certs:delete(domain)
            return
        end

        local json, err = storage.json_adapter:encode({
            fullchain_pem = cert["fullchain_pem"],
            privkey_pem = cert["privkey_pem"],
            expiry = cert["expiry"],
        })
        if not json then
            ngx.log(ngx.ERR, "auto-ssl: cannot encode stale copy of certificate for ", domain, ": ", err)
            return
        end

        local ok, set_err = stale_certs:set(domain, json, ttl)
        if not ok then
            ngx.log(ngx.ERR, "auto-ssl: cannot keep stale copy of certificate for ", domain, ": ", set_err)
        end
    end

    local storage_get_cert = auto_ssl.storage.get_cert

    auto_ssl.storage.get_cert = function(self, domain)
        if ngx.get_phase() ~= "ssl_cert" then
            return storage_get_cert(self, domain)
        end

        -- allow_domain and auto-ssl both read the certificate during a
        -- handshake; read Redis once.
        local ctx = ngx.ctx
        if ctx.blot_cert_domain == domain then
            return ctx.blot_cert
        end

        local cert, err = storage_get_cert(self, domain)

        if err then
            -- Do not reuse a connection that errored or timed out part way
            -- through a reply, and treat a Redis that stopped answering like
            -- one that refused the connection.
            local connection = ctx.auto_ssl_redis_connection
            if connection then
                ctx.auto_ssl_redis_connection = nil
                connection:close()
            end
            if err == "timeout" then
                ngx.shared.redis_backoff:set("down", true, REDIS_BACKOFF_SECONDS)
            end

            local json = stale_certs:get(domain)
            if json then
                cert = self.json_adapter:decode(json)
            end
            if not cert then
                return nil, err
            end

            ngx.log(ngx.WARN, "auto-ssl: cannot read certificate for ", domain,
                " from redis (", err, "), serving the last one read")
            ctx.blot_cert_stale = true
        elseif cert and cert["fullchain_pem"] and cert["privkey_pem"] then
            remember_cert(self, domain, cert)
        else
            stale_certs:delete(domain)
            return cert
        end

        ctx.blot_cert_domain = domain
        ctx.blot_cert = cert
        return cert
    end

    -- Run after auto_ssl:ssl_certificate() in each handshake (auto-ssl.conf).
    -- Shortens how long auto_ssl caches a certificate that was just read:
    -- to STALE_RECHECK_SECONDS for a stale copy, and to
    -- PROXY_AUTO_SSL_CACHE_TTL seconds if that is set (for tests, which
    -- cannot wait out auto-ssl's hour; unset in production).
    local cache_ttl

    function auto_ssl_after_certificate()
        local ctx = ngx.ctx
        local domain = ctx.blot_cert_domain
        if not domain then
            return
        end

        if cache_ttl == nil then
            cache_ttl = tonumber(os.getenv("PROXY_AUTO_SSL_CACHE_TTL") or "") or false
            if cache_ttl and cache_ttl <= 0 then
                cache_ttl = false
            end
        end

        local ttl = cache_ttl or nil
        if ctx.blot_cert_stale then
            ttl = math.min(ttl or STALE_RECHECK_SECONDS, STALE_RECHECK_SECONDS)
        end
        if not ttl then
            return
        end

        -- No-ops if auto-ssl did not cache the certificate
        ngx.shared.auto_ssl:expire("domain:fullchain_der:" .. domain, ttl)
        ngx.shared.auto_ssl:expire("domain:privkey_der:" .. domain, ttl)
    end
}

init_worker_by_lua_block {
  auto_ssl:init_worker()
  -- worker 0 rebuilds the purge index in the background after a start
  cacher:start(ngx)
  if ngx.worker.id() == 0 then
    cacher:monitor_free_space(ngx)
  end
}
